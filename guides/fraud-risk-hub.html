<style>
:root{
  --bg:#080E1A;--bg-2:#0D1627;--bg-3:#111E35;--bg-4:#162340;
  --border:#1E2F4A;--border-2:#263855;--muted:#3A5270;--body:#6888A8;
  --text:#A8C4DE;--bright:#D4E8F8;--white:#EEF6FD;
  --teal:#14B8A6;--teal-dim:rgba(20,184,166,.12);--teal-lt:#2DD4BF;
  --gold:#D4A847;--gold-dim:rgba(212,168,71,.12);
  --green:#22C55E;--green-dim:rgba(34,197,94,.12);
  --red:#EF4444;--red-dim:rgba(239,68,68,.12);
  --warn:#F59E0B;--purple:#9B72F5;--purple-dim:rgba(155,114,245,.12);
  --radius:6px;--radius-lg:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;font-weight:300;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'DM Serif Display',serif;font-weight:400;line-height:1.2}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit}
.container{max-width:1100px;margin:0 auto;padding:0 2rem}

/* Grid background */
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(239,68,68,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(239,68,68,.018) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0}

/* Lang bar */
.lang-bar{background:var(--bg-2);border-bottom:1px solid var(--border);padding:.35rem 0;position:relative;z-index:101}
.lang-inner{max-width:1100px;margin:0 auto;padding:0 2rem;display:flex;justify-content:flex-end;gap:.25rem}
.lang-btn{font-family:'JetBrains Mono',monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;padding:.22rem .6rem;border:1px solid var(--border);color:var(--muted);cursor:pointer;background:transparent;transition:all .2s;border-radius:var(--radius)}
.lang-btn.active,.lang-btn:hover{border-color:var(--red);color:var(--red)}

/* Nav */
nav{padding:0 2rem;height:52px;border-bottom:1px solid var(--border);background:rgba(8,14,26,.92);position:sticky;top:0;z-index:200;backdrop-filter:blur(8px)}
.nav-inner{max-width:1100px;margin:0 auto;height:100%;display:flex;align-items:center;justify-content:space-between}
.nav-trail{font-family:'JetBrains Mono',monospace;font-size:.52rem;color:var(--muted);display:flex;align-items:center;gap:.5rem}
.nav-trail a{color:var(--body)}
.nav-trail a:hover{color:var(--teal)}
.nav-sep{color:var(--border-2)}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-text{display:flex;flex-direction:column;gap:.08rem;}
.logo-name{font-family:'JetBrains Mono',monospace;font-size:.88rem;font-weight:600;color:var(--bright);line-height:1;}
.logo-ai{color:var(--teal)}.logo-co{color:var(--muted);font-size:.8rem}

.nav-cta{font-family:'JetBrains Mono',monospace;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--bg);background:var(--red);border:1px solid var(--red);padding:.3rem .85rem;border-radius:6px;transition:all .2s}
.nav-cta:hover{opacity:.88}

/* Hero */
.hero{padding:3.5rem 0 3rem;border-bottom:1px solid var(--border);position:relative;overflow:hidden;z-index:1}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent)}
.hero::after{content:'';position:absolute;top:-60px;right:-80px;width:400px;height:400px;background:radial-gradient(circle,rgba(239,68,68,.05) 0%,transparent 70%);pointer-events:none}
.hero-eyebrow{font-family:'JetBrains Mono',monospace;font-size:.57rem;letter-spacing:.22em;text-transform:uppercase;color:var(--red);margin-bottom:1rem;display:flex;align-items:center;gap:.75rem}
.hero-eyebrow::before{content:'';display:block;width:28px;height:1px;background:var(--red)}
.hero h1{font-size:clamp(1.8rem,3.5vw,2.9rem);color:var(--white);max-width:760px;margin-bottom:.75rem}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero-desc{font-size:.88rem;color:var(--body);max-width:660px;line-height:1.85;margin-bottom:1.5rem}
.hero-meta{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.hero-badge{display:inline-flex;align-items:center;gap:.5rem;font-family:'JetBrains Mono',monospace;font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;padding:.35rem .75rem;border:1px solid}
.pii-notice{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--muted);background:var(--bg-3);border:1px solid var(--border);border-left:3px solid var(--teal);border-radius:4px;padding:.5rem .85rem;line-height:1.5;margin-bottom:1rem;}
.badge-privacy{color:var(--muted);border-color:var(--border)}.badge-privacy::before{content:'·';color:var(--green)}
.badge-teal{color:var(--teal);border-color:rgba(20,184,166,.3)}
.badge-gold{color:var(--gold);border-color:rgba(212,168,71,.3)}
.badge-purple{color:var(--purple);border-color:rgba(155,114,245,.3)}
.badge-red{color:var(--red);border-color:rgba(239,68,68,.3)}

/* Stats bar */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin:2.5rem 0;position:relative;z-index:1}
.stat-cell{background:var(--bg-2);padding:1.25rem 1.5rem}
.stat-label{font-family:'JetBrains Mono',monospace;font-size:.44rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
.stat-value{font-family:'DM Serif Display',serif;font-size:1.6rem;color:var(--bright);line-height:1}
.stat-value.red{color:var(--red)}.stat-value.g{color:var(--green)}.stat-value.gold{color:var(--gold)}.stat-value.t{color:var(--teal)}
.stat-sub{font-size:.65rem;color:var(--body);margin-top:.2rem}
@media(max-width:700px){.stats-bar{grid-template-columns:repeat(2,1fr)}}

/* Section labels */
.sec-label{font-family:'JetBrains Mono',monospace;font-size:.52rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);padding-bottom:.6rem;border-bottom:1px solid var(--border);margin-bottom:1.75rem}

/* Main */
.main-content{position:relative;z-index:1;padding:3rem 0}

/* Tool cards */
.tools-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:3rem}
@media(max-width:720px){.tools-grid{grid-template-columns:1fr}}
.tool-card{background:var(--bg-2);padding:1.75rem;display:flex;flex-direction:column;gap:.85rem;position:relative;overflow:hidden;transition:background .15s}
.tool-card:hover{background:var(--bg-3)}
.tool-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
.tool-card.gold-accent::before{background:var(--gold)}
.tool-card.purple-accent::before{background:var(--purple)}
.tool-card.green-accent::before{background:var(--green)}
.tool-card.teal-accent::before{background:var(--teal)}
.tool-card-num{font-family:'JetBrains Mono',monospace;font-size:.46rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tool-card-title{font-family:'DM Serif Display',serif;font-size:1.1rem;color:var(--white);line-height:1.25}
.tool-card-desc{font-size:.76rem;color:var(--body);line-height:1.7;flex:1}
.tool-card-tags{display:flex;gap:.4rem;flex-wrap:wrap}
.tag{font-family:'JetBrains Mono',monospace;font-size:.43rem;letter-spacing:.08em;text-transform:uppercase;padding:.15rem .4rem;border-radius:2px;white-space:nowrap;display:inline-block}
.tag-teal{background:var(--teal-dim);color:var(--teal)}
.tag-gold{background:var(--gold-dim);color:var(--gold)}
.tag-green{background:var(--green-dim);color:var(--green)}
.tag-purple{background:var(--purple-dim);color:var(--purple)}
.tag-red{background:var(--red-dim);color:var(--red)}
.tag-muted{background:var(--bg-3);color:var(--muted)}
.tool-card-link{display:inline-flex;align-items:center;gap:.4rem;font-family:'JetBrains Mono',monospace;font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;color:var(--red);transition:color .15s;margin-top:.25rem}
.tool-card-link:hover{color:#ff7676}
.tool-card-link::after{content:'→';transition:transform .15s}
.tool-card-link:hover::after{transform:translateX(3px)}
.tool-card.gold-accent .tool-card-link{color:var(--gold)}
.tool-card.purple-accent .tool-card-link{color:var(--purple)}
.tool-card.green-accent .tool-card-link{color:var(--green)}
.tool-card.teal-accent .tool-card-link{color:var(--teal)}
.overlap-note{font-size:.7rem;color:var(--warn);background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.2);padding:.5rem .75rem;font-style:italic;line-height:1.5}

.last-reviewed::before{content:'⏱';font-size:.6rem}

/* Group header */
.group-header{padding:.75rem 0 .75rem;margin-bottom:0;display:flex;align-items:center;gap:.75rem}
.group-label{font-family:'JetBrains Mono',monospace;font-size:.44rem;letter-spacing:.18em;text-transform:uppercase;color:var(--red);background:var(--red-dim);border:1px solid rgba(239,68,68,.2);padding:.2rem .6rem}
.group-title{font-family:'DM Serif Display',serif;font-size:1rem;color:var(--body)}

/* Journey */
.journey{margin-bottom:3rem}
.journey-title{font-family:'DM Serif Display',serif;font-size:1.3rem;color:var(--white);margin-bottom:.4rem}
.journey-sub{font-size:.8rem;color:var(--body);margin-bottom:1.75rem}
.journey-track{display:flex;gap:0;position:relative}
.journey-track::before{content:'';position:absolute;top:28px;left:20px;right:20px;height:1px;background:var(--border);z-index:0}
.journey-step{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;z-index:1;padding:0 .5rem}
.journey-dot{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--bg-2);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--muted);margin-bottom:.75rem;flex-shrink:0;transition:all .2s}
.journey-dot.active{background:var(--red-dim);border-color:var(--red);color:var(--red)}
.journey-dot.gold{background:var(--gold-dim);border-color:var(--gold);color:var(--gold)}
.journey-dot.purple{background:var(--purple-dim);border-color:var(--purple);color:var(--purple)}
.journey-dot.teal{background:var(--teal-dim);border-color:var(--teal);color:var(--teal)}
.journey-step-label{font-family:'JetBrains Mono',monospace;font-size:.48rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.2rem}
.journey-step-title{font-size:.76rem;color:var(--text);line-height:1.35}
.journey-step-tool{font-family:'JetBrains Mono',monospace;font-size:.44rem;color:var(--muted);margin-top:.2rem}
.journey-step-tool a{color:var(--red);border-bottom:1px solid rgba(239,68,68,.2);transition:border-color .2s}
.journey-step-tool a:hover{border-color:var(--red)}
@media(max-width:640px){.journey-track{flex-direction:column;gap:1rem}.journey-track::before{display:none}.journey-step{flex-direction:row;text-align:left;gap:.75rem}.journey-step-label{display:none}}

/* Reg grid */
.reg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:3rem}
@media(max-width:900px){.reg-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.reg-grid{grid-template-columns:1fr}}
.reg-cell{background:var(--bg-2);padding:1.25rem}
.reg-flag{font-family:'JetBrains Mono',monospace;font-size:.46rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.reg-name{font-family:'DM Serif Display',serif;font-size:1rem;color:var(--bright);margin-bottom:.4rem}
.reg-desc{font-size:.73rem;color:var(--body);line-height:1.65;margin-bottom:.75rem}
.reg-status{display:inline-flex;align-items:center;gap:.35rem;font-family:'JetBrains Mono',monospace;font-size:.44rem;letter-spacing:.08em;text-transform:uppercase}
.reg-status::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0}
.reg-status.live{color:var(--green)}.reg-status.live::before{background:var(--green)}
.reg-status.active{color:var(--teal)}.reg-status.active::before{background:var(--teal)}
.reg-status.phase{color:var(--warn)}.reg-status.phase::before{background:var(--warn)}

/* Audience grid */
.audience-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:3rem}
@media(max-width:640px){.audience-grid{grid-template-columns:1fr}}
.audience-cell{background:var(--bg-2);padding:1.25rem 1.5rem}
.audience-icon{font-size:1.2rem;margin-bottom:.6rem;opacity:.8}
.audience-role{font-family:'JetBrains Mono',monospace;font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:.35rem}
.audience-title{font-size:.82rem;color:var(--bright);margin-bottom:.35rem}
.audience-desc{font-size:.72rem;color:var(--body);line-height:1.65}

/* Quick-start */
.quickstart{background:var(--bg-2);border:1px solid var(--border);border-left:3px solid var(--gold);padding:2rem;margin-bottom:3rem}
.quickstart-title{font-family:'DM Serif Display',serif;font-size:1.2rem;color:var(--white);margin-bottom:.4rem}
.quickstart-sub{font-size:.78rem;color:var(--body);margin-bottom:1.5rem}
.qs-list{display:flex;flex-direction:column;gap:.75rem}
.qs-item{display:flex;gap:1rem;align-items:flex-start}
.qs-num{font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--gold);flex-shrink:0;width:20px;padding-top:.1rem}
.qs-body{font-size:.78rem;color:var(--body);line-height:1.6}
.qs-body strong{color:var(--text)}
.qs-body a{color:var(--red);border-bottom:1px solid rgba(239,68,68,.2);transition:border-color .2s}
.qs-body a:hover{border-color:var(--red)}

/* Related hubs */
.related-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:3rem}
@media(max-width:600px){.related-grid{grid-template-columns:1fr}}
.related-cell{background:var(--bg-2);padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:.5rem;transition:background .15s}
.related-cell:hover{background:var(--bg-3)}
.related-cat{font-family:'JetBrains Mono',monospace;font-size:.44rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.related-title{font-size:.84rem;color:var(--bright)}
.related-link{font-family:'JetBrains Mono',monospace;font-size:.48rem;letter-spacing:.1em;text-transform:uppercase;color:var(--red);display:inline-flex;align-items:center;gap:.35rem;transition:color .15s}
.related-link:hover{color:#ff7676}

/* MCP / Developer section */
.sec-divider{border:none;border-top:1px solid var(--border);margin:3rem 0}
.mcp-toggle{width:100%;background:var(--bg-2);border:1px solid var(--border);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;transition:background .15s;margin-bottom:0}
.mcp-toggle:hover{background:var(--bg-3)}
.mcp-toggle-icon{color:var(--muted);font-size:.9rem;transition:transform .25s}
.mcp-toggle-icon.open{transform:rotate(180deg)}

.mcp-table{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:.62rem}
.mcp-table th{text-align:left;padding:.65rem 1rem;border-bottom:1px solid var(--border-2);color:var(--muted);font-size:.44rem;letter-spacing:.1em;text-transform:uppercase;font-weight:400}
.mcp-table td{padding:.55rem 1rem;border-bottom:1px solid var(--border);color:var(--text);vertical-align:top}
.mcp-table tr:last-child td{border-bottom:none}
.mcp-table tr:hover td{background:rgba(255,255,255,.015)}
.mcp-id{color:var(--gold)}.mcp-name{color:var(--teal)}.ap2-y{color:var(--green);font-weight:500}.ap2-n{color:var(--muted)}
.mcp-note{font-size:.65rem;color:var(--muted);padding:1rem 1.25rem;font-family:'JetBrains Mono',monospace}

/* Footer */
footer{border-top:1px solid var(--border);padding:1.75rem 1.5rem;margin-top:3rem;position:relative;z-index:1}
.footer-inner-ai{display:flex;align-items:center;gap:2rem;flex-wrap:wrap;justify-content:space-between}
.footer-links-ai{display:flex;gap:1.25rem;font-family:'JetBrains Mono',monospace;font-size:.52rem;color:var(--muted)}
.footer-links-ai a{color:var(--muted);text-decoration:none;transition:color .2s}
.footer-links-ai a:hover{color:var(--teal-lt)}
.footer-badge-ai{display:flex;flex-direction:column;gap:.3rem;font-family:'JetBrains Mono',monospace;font-size:.44rem;color:var(--muted)}
.footer-brand-link{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--text)}
.footer-cat-tag{font-family:'JetBrains Mono',monospace;font-size:.5rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);line-height:1.4;margin-top:.15rem}
.footer-wordmark{font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:500}
.logo-icon-sm{background:var(--teal);color:#000;font-weight:700;font-size:.7rem;padding:.15rem .3rem;border-radius:3px}
@media(max-width:640px){.footer-inner-ai{flex-direction:column;text-align:center}.footer-badge-ai{align-items:center}}

</head>

    <!-- Quick-Start Guides -->
    <div class="sec-label">Quick-Start Guides</div>
    <div class="qs-list">

      <div class="qs-item">
        <button class="qs-trigger" onclick="toggleQS('qs1',this)">
          <span class="qs-trigger-label">▶ &nbsp;Scoring synthetic identity fraud risk</span>
          <span class="qs-trigger-time">T321 · ~3 min</span>
        </button>
        <div id="qs1" class="qs-body">
          <strong>Step 1.</strong> Open T321. Enter the 7 observable identity signals — SSN issue year, applicant age, credit file age, address tenure, account velocity in 90 days, phone age, and device anomaly flag. No PII required — all inputs are structural attributes.<br>
          <strong>Step 2.</strong> Click Score Risk. The composite score (0–100) appears with a colour-coded risk tier: Low / Moderate / High / Reject. The signal breakdown table shows how each dimension contributed.<br>
          <strong>Step 3.</strong> Review the CIP enhancement steps — they escalate with tier, from standard identity verification through out-of-wallet KBA, SSN tracing via SSNVS, and SAR filing guidance at Reject.<br>
          <strong>Step 4.</strong> Export Policy Mandate for your fraud operations audit trail. The mandate encodes all signal weights, thresholds, and CIP steps. Export Markdown for your credit policy review file.
        </div>
      </div>

      <div class="qs-item">
        <button class="qs-trigger" onclick="toggleQS('qs2',this)">
          <span class="qs-trigger-label">▶ &nbsp;Assessing APP scam risk before payment release</span>
          <span class="qs-trigger-time">T322 · ~2 min</span>
        </button>
        <div id="qs2" class="qs-body">
          <strong>Step 1.</strong> Open T322. Input the 7 payment context signals — beneficiary account age, first-time payee flag, payment purpose category, instruction channel, time pressure, amount vs sender median, and account pattern.<br>
          <strong>Step 2.</strong> Click Assess APP Scam Risk. The tool classifies the most probable scam typology from five types and scores 0–100 across Low / Moderate / High / Block tiers.<br>
          <strong>Step 3.</strong> Review the friction interventions table — CoP requirement, delay policy (warning / 24h hold / block), and PSR warning script obligation per tier.<br>
          <strong>Step 4.</strong> For PSR PS23/3 reimbursement eligibility and sending/receiving PSP liability split after a scam has occurred, use T257 in the Cat-21 hub. T322 is pre-payment only.<br>
          <strong>Step 5.</strong> Export Policy Mandate — the payload encodes the typology, risk tier, and friction policy for your fraud agent. No PSR liability fields are included in T322's export.
        </div>
      </div>

      <div class="qs-item">
        <button class="qs-trigger" onclick="toggleQS('qs3',this)">
          <span class="qs-trigger-label">▶ &nbsp;Building a chargeback representment package</span>
          <span class="qs-trigger-time">T41 · ~10 min</span>
        </button>
        <div id="qs3" class="qs-body">
          <strong>Step 1.</strong> Open T41. Select the card network — Visa CE 3.0, Mastercard, Amex, or Discover — and enter the dispute reason code.<br>
          <strong>Step 2.</strong> The evidence checklist populates automatically based on reason code and network. Work through each checklist item — the tool flags must-have vs supporting evidence.<br>
          <strong>Step 3.</strong> The win-probability estimator scores your evidence strength. Items marked HIGH IMPACT have the greatest effect on win rate — prioritise these in the representment package.<br>
          <strong>Step 4.</strong> For multi-dispute portfolios, use batch priority mode — the tool ranks disputes by ROI (win probability × transaction amount) to focus resources.<br>
          <strong>Step 5.</strong> Export the representment letter template and Policy Mandate JSON for dispute operations audit trail.
        </div>
      </div>

      <div class="qs-item">
        <button class="qs-trigger" onclick="toggleQS('qs4',this)">
          <span class="qs-trigger-label">▶ &nbsp;Running a batch sanctions screening</span>
          <span class="qs-trigger-time">T43 · ~5 min</span>
        </button>
        <div id="qs4" class="qs-body">
          <strong>Step 1.</strong> Open T43. Paste your NACHA, ISO 20022, SEPA, or SWIFT MT batch file. The tool auto-detects format.<br>
          <strong>Step 2.</strong> Select the sanctions lists to screen against — OFAC SDN, UN Consolidated, EU Consolidated, or all three. The fuzzy-match engine uses Levenshtein distance, Jaro-Winkler similarity, and Soundex phonetic matching entirely in-browser.<br>
          <strong>Step 3.</strong> Review the match results table — scored by match confidence. High-confidence matches require immediate hold and compliance escalation. Medium-confidence matches go to the false-positive triage workflow.<br>
          <strong>Step 4.</strong> Zero PII leaves the browser tab. Export the screening results as Policy Mandate JSON for your compliance audit trail.
        </div>
      </div>

      <div class="qs-item">
        <button class="qs-trigger" onclick="toggleQS('qs5',this)">
          <span class="qs-trigger-label">▶ &nbsp;Building a Policy Mandate for your fraud agent</span>
          <span class="qs-trigger-time">T323 · ~8 min</span>
        </button>
        <div id="qs5" class="qs-body">
          <strong>Step 1.</strong> Open T323. Configure Dimension 1 — set your synthetic ID reject score cutoff (calibrated to FRB SR 2022 guidance; recommended 75–85), ATO step-up cutoff, and model version tag.<br>
          <strong>Step 2.</strong> Configure Dimension 2 — APP scam controls. Set CoP enforcement to Mandatory if you operate on UK FPS under PSR PS23/3. Check the PSR liability acknowledgement checkbox if applicable. The tool flags it as a policy contradiction if you disable CoP while accepting PSR liability.<br>
          <strong>Step 3.</strong> Configure Dimension 3 — set your overall fraud loss budget in basis points and maximum acceptable rates for CNP, ATO, and APP fraud types.<br>
          <strong>Step 4.</strong> Configure Dimension 4 — SAR auto-file threshold, escalation chain roles, and board reporting frequency.<br>
          <strong>Step 5.</strong> Click Build. The tool generates an ordered agent_instructions array — your fraud agent's authorised rulebook. Export Policy Mandate and deploy to your fraud decisioning agent via the AINumbers.co MCP server.
