schema_version: "1.0"
parity_id: aml-consolidation
sign_off_status: SIGNED_OFF
created: "2026-06-13"
created_by: "claude-sonnet-4-6 / cowork session"

# This parity record covers 4 guides consolidated into 1 chain.
# The aml-kyc-compliance-hub.html is a hub/directory page and is NOT in scope
# for deletion — it should be preserved as a navigation surface.

sources:
  - type: guide
    path: "repo/guides/aml-workflow.html"
    title: "AML Compliance Workflow"
    description: >
      Static 4-step guide: T110 → T116 → T121 → T131. No AIN Bridge.
      Multi-language (EN/ES). Covers customer risk rating, TM rules, SAR
      narrative, AP2 AML mandate. Accent: red (AML/risk theme).

  - type: guide
    path: "repo/guides/aml-programme-workflow.html"
    title: "AML Programme Build-Out · Live Workflow"
    description: >
      4-stage live workflow with iframes: T110 → T116 → T119 → T131.
      Uses T119 (CTR/SAR threshold) instead of T121 (SAR narrative).
      AP2 JSON export. Zero PII.

  - type: guide
    path: "repo/guides/aml-programme-composer.html"
    title: "AML Programme Composer"
    description: >
      4-stage AIN Bridge composer: T110 → T116 → T119 → T131.
      postMessage orchestration. Composite mandate export.

  - type: guide
    path: "repo/guides/amlr-single-rulebook-composer.html"
    title: "AMLR Single Rulebook Composer"
    description: >
      5-stage AIN Bridge composer for EU AMLR: T485 → T486 → T487 → T488 → T350.
      Obliged entity scope, UBO mapping, cash limit/EDD, CDD policy, readiness gap.
      Deadline: July 2027.

chaingraph_equivalent:
  type: chain
  path: "repo/chaingraph/chains/aml-consolidation.html"
  chain_id: "aml-consolidation"
  chaingraph_url: "https://ainumbers.co/chaingraph/chains/aml-consolidation.html"
  notes: >
    Branching chain. ART-10 (AMLA typology scorer) is the common ChainGraph root
    with §4 artifact. Branch A covers the core AML programme (T110→T116→T119→T121→T131),
    consolidating aml-workflow + aml-programme-workflow + aml-programme-composer.
    Branch B covers AMLR single rulebook (T485→T486→T487→T488→T350), consolidating
    amlr-single-rulebook-composer. The aml-kyc-compliance-hub.html is a hub page
    and is NOT part of this conversion — it should not be deleted.

