gaps_in_chaingraph:
  - id: "multi-language"
    description: >
      aml-workflow.html supports EN/ES. Chain page is English only.
    severity: "minor"
    workaround: "Users can access original tools in Spanish directly"

  - id: "saessonal-storage-ain-lang"
    description: >
      aml-programme-workflow.html and aml-programme-composer.html may write
      ain_lang to sessionStorage via AIN Bridge. Chain nodes do not. Minor
      functional difference — chain uses §4 artifact export instead.
    severity: "minor"
    workaround: "§4 JSON export is more durable than sessionStorage"

improvements_in_chaingraph:
  - "4 guides consolidated into 1 branching chain"
  - "ART-10 §4 artifact anchors both branches — adds verifiable typology risk baseline"
  - "Branch A completes the CTR/SAR path by including both T119 and T121"
  - "AMLR deadline banner prominent in Branch B"
  - "Session-persistent compliance record via §4 export"

not_in_scope:
  - "aml-kyc-compliance-hub.html is a 22-tool hub/directory page — NOT converted, NOT deleted"

