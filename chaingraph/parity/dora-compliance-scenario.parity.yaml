  path: "repo/chaingraph/chains/dora-readiness.html"
  chain_id: "dora-readiness"
  chaingraph_url: "https://ainumbers.co/chaingraph/chains/dora-readiness.html"
  notes: >
    This is the most direct 1:1 conversion — the scenario guide's 3-scenario
    branching topology is directly reproduced as the dora-readiness chain's
    3-scenario branching topology. All steps, tools, and scenario logic are
    preserved with two enhancements: (1) ART-29 diagnostic added as the common
    entry root before T307; (2) RBE-11 upgraded to ART-09 ChainGraph link.

