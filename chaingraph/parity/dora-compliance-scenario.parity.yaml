source:
  type: guide
  path: "repo/guides/dora-compliance-scenario.html"
  title: "DORA Compliance Scenario Guide"
  description: >
    3-scenario dynamic guide. All scenarios share T307 (proportionality, step 1)
    and T310 (mandate, step 4). Scenario A Incident: RBE-11/art-09 → T308.
    Scenario B Gap: T300 → T302. Scenario C Supervisory: T301 → T359.
    JavaScript SCENARIOS object for dynamic step switching. No sessionStorage
    violations.

chaingraph_equivalent:
