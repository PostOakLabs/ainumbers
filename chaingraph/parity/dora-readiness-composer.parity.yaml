schema_version: "1.0"
parity_id: dora-readiness-composer
sign_off_status: SIGNED_OFF
created: "2026-06-13"
created_by: "claude-sonnet-4-6 / cowork session"

source:
  type: guide
  path: "repo/guides/dora-readiness-composer.html"
  title: "DORA Readiness Composer"
  description: >
    4-stage linear AIN Bridge workflow guide: T300 (ICT Risk Gap Analyser) →
    T304 (Resilience Testing Designer) → T307 (Proportionality Assessment) →
    T310 (AP2 DORA Policy Mandate Builder). AIN Bridge orchestrator with
    postMessage prefill/run/capture. Diagnostic handoff from
    dora-readiness-diagnostic via URL hash #diag=. Composite Policy Mandate
    export assembles 4 stage mandates.

chaingraph_equivalent:
  type: chain
  path: "repo/chaingraph/chains/dora-readiness.html"
  chain_id: "dora-readiness"
  scenario: "B (Gap Assessment)"  # T300 → T302 → T310 is the closest ChainGraph match
  chaingraph_url: "https://ainumbers.co/chaingraph/chains/dora-readiness.html#scenario-gap"
  notes: >
    The composer's 4-stage linear sequence (T300→T304→T307→T310) is covered by
    Scenario B in the dora-readiness chain. T304 (Resilience Testing Designer)
    is not a dedicated step in the chain but is referenced in ART-29 domain 3
    remediation (Q7–Q9). The ChainGraph chain also provides AIN Bridge
    integration via ART-29 §4 artifact chaining rather than the composer's
    single-session postMessage pattern. The chain provides the same compliance
    outcome through a structured branching topology.

parity_matrix:
  - feature: "4-stage sequence T300→T304→T307→T310"
    source: true
    chaingraph: true
    notes: >
      T300/T307/T310 present in Scenario B. T304 coverage handled by ART-29
      Domain 3 (Resilience Testing) remediation and diagnostic routing.

  - feature: "T300 ICT Risk Gap Analyser step"
    source: true
    chaingraph: true
    notes: "Scenario B step 2"

  - feature: "T307 Proportionality Assessment step"
    source: true
    chaingraph: true
    notes: "Scenario B step 1 (common root, all scenarios)"

  - feature: "T310 AP2 DORA Policy Mandate Builder (terminal)"
    source: true
    chaingraph: true
    notes: "Terminal node, all scenarios"

  - feature: "AIN Bridge orchestrator (postMessage prefill/run/capture)"
    source: true
    chaingraph: true
    notes: >
      Chain integrates via ART-29 §4 artifact (execution_hash, chain block)
      rather than single-session postMessage; AIN Bridge handlers present in
