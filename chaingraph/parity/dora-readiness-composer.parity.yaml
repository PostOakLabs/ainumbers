  - feature: "Diagnostic handoff via URL hash #diag="
    source: true
    chaingraph: true
    notes: >
      ART-29 is the equivalent ChainGraph diagnostic; its §4 JSON output
      anchors the chain rather than a hash passthrough.

  - feature: "Composite Policy Mandate assembling 4 stage mandates"
    source: true
    chaingraph: true
    notes: "T310 terminal step produces composite mandate from all scenario steps"

  - feature: "T304 Resilience Testing Designer as dedicated workflow step"
    source: true
    chaingraph: false
    notes: >
      PARTIAL — T304 is covered in ART-29 Domain 3 remediation links (Q7–Q9)
      but is not a discrete step in the dora-readiness chain. If needed in
      future, a Scenario D (testing) branch can be added.

  - feature: "sessionStorage ain_lang"
    source: true
    chaingraph: false
    notes: "REMOVED. ChainGraph nodes do not write ain_lang."

  - feature: "§4 execution_hash audit chain"
    source: false
    chaingraph: true
    notes: "NEW in ChainGraph — full §4 artifact anchoring at ART-29"

  - feature: "Branching topology (3 scenarios)"
    source: false
    chaingraph: true
    notes: "NEW — chain adds Incident (Scenario A) and Supervisory (Scenario C) paths beyond composer's linear scope"

gaps_in_chaingraph:
  - id: "T304-as-chain-step"
    description: >
      T304 (Resilience Testing Designer) is not a discrete step in any chain
      scenario. It is covered through ART-29 Domain 3 remediation. Consider
      adding Scenario D (Testing) to dora-readiness chain in a future wave.
    severity: "minor"
    workaround: "ART-29 Domain 3 remediation links to T304 directly"

improvements_in_chaingraph:
  - "3-scenario branching topology covers more DORA compliance paths than the linear composer"
  - "§4 hash-anchored artifacts provide machine-verifiable audit trail"
  - "Chain persists across sessions via §4 JSON export (vs. composer's ephemeral postMessage)"
  - "sessionStorage ain_lang violation removed"

