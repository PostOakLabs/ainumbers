<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="180" height="20" viewBox="0 0 180 20" role="img" aria-label="Powered by OpenChainGraph">
  <title>Powered by OpenChainGraph</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="180" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="80" height="20" fill="#555"/>
    <rect x="80" width="100" height="20" fill="#0057FF"/>
    <rect width="180" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="110">
    <text x="410" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="620" lengthAdjust="spacing">Powered by</text>
    <text x="410" y="140" transform="scale(.1)" textLength="620" lengthAdjust="spacing">Powered by</text>
    <text x="1300" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="880" lengthAdjust="spacing">OpenChainGraph</text>
    <text x="1300" y="140" transform="scale(.1)" textLength="880" lengthAdjust="spacing">OpenChainGraph</text>
  </g>
</svg>
