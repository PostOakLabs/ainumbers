<svg xmlns="http://www.w3.org/2000/svg" width="230" height="28" viewBox="0 0 230 28" role="img" aria-label="OpenChainGraph Verified Build">
<title>OpenChainGraph Verified Build</title>
<style>
  .ocgb-bg{fill:#111E35}
  .ocgb-accent{fill:#0D1627}
  .ocgb-border{stroke:#263855}
  .ocgb-label{fill:#A8C4DE}
  .ocgb-text{fill:#EEF6FD}
  .ocgb-check{stroke:#2DD4BF}
  @media (prefers-color-scheme: light) {
    .ocgb-bg{fill:#EDF1F5}
    .ocgb-accent{fill:#E2E9EF}
    .ocgb-border{stroke:#C7D2DC}
    .ocgb-label{fill:#3A4E60}
    .ocgb-text{fill:#12202E}
    .ocgb-check{stroke:#0F9C8C}
  }
</style>
<rect x="0.5" y="0.5" width="229" height="27" rx="5" class="ocgb-bg ocgb-border" stroke-width="1"/>
<rect x="0.5" y="0.5" width="86" height="27" rx="5" class="ocgb-accent"/>
<rect x="80" y="0.5" width="7" height="27" class="ocgb-accent"/>
<circle cx="16" cy="14" r="7" fill="none" class="ocgb-check" stroke-width="1.6"/>
<path d="M12.4 14.1l2.4 2.4 4.8-4.9" fill="none" class="ocgb-check" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="28" y="17.5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="0.02em" class="ocgb-label">OCG v0.4</text>
<text x="95" y="17.5" font-family="Sora, ui-sans-serif, sans-serif" font-size="10.5" font-weight="500" class="ocgb-text">Verified Build</text>
<rect x="0.5" y="0.5" width="229" height="27" rx="5" fill="none" class="ocgb-border" stroke-width="1"/>
</svg>
