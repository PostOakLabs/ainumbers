name: "Suggest a tool, node, or workflow"
description: "Propose a new fintech tool, OpenChainGraph compute node, or verifiable workflow for the AINumbers.co suite."
title: "[Suggestion] "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us the regulation, the input you have, and the output you need. Every suggestion is read.
        The suite is browser-side and deterministic — do not paste real personal data, use synthetic or anonymised inputs only.

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      description: What are you suggesting?
      options:
        - New tool
        - New chain (workflow)
        - Improve existing
        - Other
    validations:
      required: true

  - type: input
    id: domain
    attributes:
      label: Regulation or standard
      description: The statute, spec, or framework it serves.
      placeholder: "e.g. ISO 20022, MiCA, EMIR Refit, FATF Travel Rule"
    validations:
      required: false

  - type: textarea
    id: computes
    attributes:
      label: What it computes or verifies
      description: Describe the deterministic, browser-side calculation or check. Same input should always give the same output.
      placeholder: "e.g. validates a CBAM precursor emissions declaration against Annex III default values"
    validations:
      required: true

  - type: input
    id: who
    attributes:
      label: Who needs it
      description: The persona or buyer who would use this.
      placeholder: "e.g. a treasury analyst at a payments ISO, a compliance officer at a CASP"
    validations:
      required: false

  - type: textarea
    id: why-now
    attributes:
      label: Why now
      description: The driver, deadline, or demand behind this suggestion.
      placeholder: "e.g. MiCA transitional deadline, a new final rule, a recurring manual process"
    validations:
      required: false

  - type: checkboxes
    id: zero-pii-ack
    attributes:
      label: Zero-PII + deterministic acknowledgement
      description: Confirm the tool fits the suite's doctrine before suggesting it.
      options:
        - label: This tool would take non-PII structural or synthetic inputs and run entirely client-side (no server calls).
          required: true

  - type: textarea
    id: receipt
    attributes:
      label: Receipt (optional, fast-tracks review)
      description: Paste an `execution_hash` from an existing suite tool, or an OpenChainGraph receipt JSON, showing you actually ran the suite. Issues with a valid receipt get the `fast-track` label during triage.
      render: json
    validations:
      required: false
