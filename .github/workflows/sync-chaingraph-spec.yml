name: Sync ChainGraph spec to public mirror

# Keeps the public Pages mirror (PostOakLabs/chaingraph) in lockstep with the
# OpenChainGraph SSOT in this repo. Fires whenever the normative spec, its JSON
# schema, or the rendered HTML spec changes on main, then copies just those three
# files into the mirror and pushes via a short-lived GitHub App installation token
# (secrets SYNC_APP_ID + SYNC_APP_PRIVATE_KEY). App = "ainumbers-spec-sync",
# installed on PostOakLabs/chaingraph only, Contents:write only. Chosen over a
# deploy key because the org-wide `deploy_keys_enabled_for_repositories` policy
# can disable deploy keys org-wide (it did, 2026-06-25) — App tokens are immune.
# Scope is deliberate: only files with a source of truth in this repo are synced —
# index.html and the profiles/namespaces/adoption trees are mirror-owned, untouched.

on:
  push:
    branches: [main]
    paths:
      - 'chaingraph/standard/SPEC.md'
      - 'chaingraph/standard/openchain-graph-v0.4.schema.json'
      - 'chaingraph/openchain-graph-spec.html'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: chaingraph-mirror-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout site repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
        with:
          path: site

      - name: Mint GitHub App token (scoped to mirror repo only)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.0.0
        with:
          client-id: ${{ secrets.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: chaingraph

      - name: Checkout mirror (auth via App token)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
        with:
          repository: PostOakLabs/chaingraph
          token: ${{ steps.app-token.outputs.token }}
          path: mirror

      - name: Copy spec artifacts into mirror
        run: |
          cp site/chaingraph/standard/SPEC.md                          mirror/SPEC.md
          cp site/chaingraph/standard/openchain-graph-v0.4.schema.json mirror/schema/openchain-graph-v0.4.schema.json
          cp site/chaingraph/openchain-graph-spec.html                 mirror/spec.html
          # The mirror is pure static (HTML/MD/JSON) — disable Jekyll so Pages does a fast static build.
          # Without this, Pages runs Jekyll and a spec commit can error the build, leaving live Pages stale.
          touch mirror/.nojekyll

      - name: Commit & push if changed
        working-directory: mirror
        run: |
          git config user.name  "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          # -A of the explicit paths only (never a blanket add — mirror-owned index.html/profiles/ must stay untouched)
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard .nojekyll)" ]; then
            echo "Mirror already in sync — nothing to push."
            exit 0
          fi
          git add SPEC.md schema/openchain-graph-v0.4.schema.json spec.html .nojekyll
          git commit -m "sync: mirror OpenChainGraph spec from PostOakLabs/ainumbers@${GITHUB_SHA:0:7}"
          git push origin main
          echo "Pushed spec sync to PostOakLabs/chaingraph."
