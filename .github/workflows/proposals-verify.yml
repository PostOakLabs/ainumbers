name: Proposals Verify

# AGENTPR-1: agents (and humans) open real PRs for new tool/workflow proposals.
# A PR under this route may add exactly one proposals/<slug>.json file and
# touch nothing else — this workflow is the mechanical CI gate (schema,
# slug-collision, copy gates, out-of-dir rejection, receipt fast-track).
#
# SECURITY (doctrine item 5): this runs on plain `pull_request`, which is the
# DEFAULT-SAFE trigger for fork PRs — GitHub does not pass repository secrets
# to a `pull_request`-triggered run from a fork, and its GITHUB_TOKEN is
# read-only regardless of the `permissions:` block below. That is sufficient
# for this job (it only needs to read the diff and run a local, zero-dep
# script) and is why `receipt-verified` labeling is a SEPARATE workflow
# (proposals-label.yml, triggered by workflow_run) rather than a step here —
# labeling needs write, which a fork PR's own run cannot have and must not be
# given. Nothing here ever writes, merges, or auto-builds.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'proposals/**'
      - 'scripts/verify-proposals.mjs'
      - '.github/workflows/proposals-verify.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Schema + slug-collision + copy gates + out-of-dir
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout base (trusted scripts/ + registry)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: List changed files (API, no fork code executed)
        id: files
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { data } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const files = data.map((f) => f.filename);
            core.setOutput('list', files.join(','));
            return files;

      - name: Fetch proposal file contents (data only, never executed)
        run: |
          mkdir -p proposals
          IFS=',' read -ra FILES <<< "${{ steps.files.outputs.list }}"
          for f in "${FILES[@]}"; do
            if [[ "$f" == proposals/*.json ]]; then
              gh api "repos/${{ github.repository }}/contents/$f?ref=${{ github.event.pull_request.head.sha }}" \
                --jq '.content' | base64 -d > "$f"
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run gate on the fetched proposal files
        id: verify
        run: |
          shopt -s nullglob
          FILES=(proposals/*.json)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "proposals-verify: no proposals/*.json touched by this PR (path filter matched scripts/workflow instead) — nothing to validate."
            exit 0
          fi
          node scripts/verify-proposals.mjs --changed-files="${{ steps.files.outputs.list }}" "${FILES[@]}" | tee /tmp/verify-output.txt

      - name: Prepare label signal artifact
        if: always()
        run: |
          RECEIPT=false
          if grep -q "RECEIPT_VERIFIED=true" /tmp/verify-output.txt 2>/dev/null; then RECEIPT=true; fi
          mkdir -p /tmp/proposals-signal
          echo "{\"pr_number\": ${{ github.event.pull_request.number }}, \"receipt_verified\": $RECEIPT}" > /tmp/proposals-signal/signal.json

      - name: Upload label signal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proposals-signal
          path: /tmp/proposals-signal/signal.json
          retention-days: 5
