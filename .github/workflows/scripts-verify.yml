name: Scripts Verify

# Gate-coverage fix for SCRIPTSCI-1 (2026-07-15), 3rd instance of the
# "zero CI checks ran" class LANDCI-1/HTMLCI-1 each closed once (PR #257,
# #267). PR #273 (`scripts/`-only) got zero checks: all existing workflows
# are path-filtered and none has a `pull_request` trigger matching
# `scripts/**` — cross-engine-parity.yml covers only
# scripts/check-engine-parity.mjs; deploy-docs.yml names scripts/gen-openapi.mjs
# but is push-only, so it never gates a PR. The gates themselves live in
# scripts/ — a PR that breaks/weakens a gate is the one diff shape with no
# CI. This workflow runs the full preflight gate suite on any scripts/ change.
# Additive only: does not replace or weaken any existing gate.

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'chaingraph/vm/scripts/**'
      - 'chaingraph/graph/chains/**'
      # check-clause-digest.mjs (2026-08-16) gates NEW/CHANGED chaingraph/graph/nodes/*.json
      # shards, but this filter never included that path — PR #1291 added three non-compliant
      # node shards and Scripts Verify never ran on that diff at all. "Green in CI" there meant
      # "never dispatched," not "passed."
      - 'chaingraph/graph/nodes/**'
      # any workflow edit runs the full preflight so check-workflow-gate-parity
      # sees a newly-added CI gate and fails if preflight doesn't also run it
      - '.github/workflows/**'
      # 2026-08-28: the bot heal commit e0c21019 for
      # fv-explainer.html touched only that file - outside this filter, so the
      # staleness red ran unwatched ~13 min until the next watched-path push.
      # Watch the file. MUST stay byte-identical to the scripts-verify list in
      # scripts/ci-paths.json (the relevant job consumes the same list).
      - 'fv-explainer.html'
  pull_request:
    # ready_for_review added (DRAFTCI-2, 2026-07-20): draft PRs are skipped
    # below, so a readied draft must trigger a fresh run or it could merge
    # with no checks. Default types kept explicit alongside it.
    #
    # Always-report shape (2026-08-16): NO `paths:` filter here anymore.
    # Making the reporter job below a required status check on a path-filtered
    # pull_request trigger would deadlock every PR that never touches these
    # paths (the check never dispatches, GitHub waits forever). The workflow
    # now always dispatches; the `relevant` job decides (against the SAME path
    # list, scripts/ci-paths.json) whether the substantive job actually runs,
    # and the reporter job always reports. See that job's comment.
    #
    # converted_to_draft added (2026-08-30): a PR opened
    # non-draft that goes RED by design, then converted to draft AFTER the
    # run already failed, kept the stale red forever — nothing re-dispatched
    # this workflow on that transition. Measured on PR #1584: opened
    # 13:44:08Z, run failed by 13:44:33Z, converted_to_draft 13:54:49Z, red
    # check untouched afterward. This re-fires the workflow on that exact
    # transition so the draft==false skip below supersedes the stale red.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # merge_group: the reporter job below is a required status check, so it must
  # also fire on merge_group or GitHub never reports status for a queued PR and
  # the queue deadlocks — "omitting it causes status checks to fail reporting,
  # resulting in merge failures" (GitHub Docs, Managing a merge queue). No
  # `paths:` filter is supported on this trigger type; the `relevant` job's own
  # diff against merge_group.base_sha/head_sha is what scopes it, same as it
  # does for pull_request.
  merge_group:
    types: [checks_requested]
  # Manual-dispatch shape (2026-08-28):
  # lets the gate be exercised on demand on main (e.g. right after a bot heal
  # commit) without waiting for the next watched-path push. dry_run gates
  # nothing BY DECLARATION: this workflow only reports (preflight + status),
  # it has no irreversible steps, so the dry-run is the full
  # suite and every mode runs it.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run marker. This workflow has no irreversible steps; the full preflight suite runs in every mode.'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push/synchronize on the same PR ref supersedes its prior
  # in-progress run (2026-08-30) — letting the stale one
  # finish is redundant CI time, not lost coverage. Also cancels a stale
  # push:main run: derived-artifacts-regen.yml commits a regen fix-up on
  # the same `github.ref` shortly after most human pushes to main, and this
  # workflow has no push-only downstream job depending on it (unlike
  # land-verify.yml's attest-fv-artifacts) — so the newer commit's run
  # fully supersedes the older one. Measured 2026-08-30 run 33315676452: a
  # push-triggered run genuinely red on stale derived artifacts
  # (debt-ledger) ran for 9 minutes before reporting red, while the regen
  # bot's own push, 36s later, produced a clean green run for the same
  # ref — cancelling the stale one stops that redundant red from ever
  # completing. NEVER cancel a merge_group run — a cancelled merge_group
  # run reports nothing back to the queue, which deadlocks it rather than
  # just leaving a stale red.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  relevant:
    name: relevant
    # Always-report shape: fast path-relevance check, always dispatches (see
    # pull_request trigger comment above). On push this always reports hit=true — the
    # workflow's own `paths:` push filter already scoped dispatch, so there's nothing
    # further to decide. On pull_request it diffs base...head against the SAME path
    # list (scripts/ci-paths.json key "scripts-verify") used by the push trigger, so
    # the two can never silently diverge.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hit: ${{ steps.check.outputs.hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Check path relevance
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: node scripts/check-ci-relevant.mjs --key scripts-verify

  scripts-verify:
    name: Full preflight gate suite
    needs: relevant
    # DRAFTCI-2 (2026-07-20): expected-red proof/shard PRs open as drafts by
    # doctrine (they ride the next assemble-and-land step, which regenerates
    # chaingraph.json before anything merges). GitHub still runs pull_request workflows on
    # drafts, so those PRs showed a red X despite the draft rule — the red
    # carried no information. Skip drafts; the run fires on ready_for_review
    # and the push-to-main trigger remains the backstop.
    #
    # Always-report shape: also gated on needs.relevant.outputs.hit — an
    # irrelevant PR (no touched path) skips this job entirely; the reporter job
    # below still reports green in seconds via `skipped`.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.relevant.outputs.hit == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report dispatch mode
        if: github.event_name == 'workflow_dispatch'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: 'echo workflow_dispatch dry_run=$DRY_RUN - report-only workflow, no irreversible steps, full preflight suite runs in every mode'
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # fetch-depth 0 (was 1, 2026-08-16): check-clause-digest.mjs needs to resolve origin/main
          # and merge-base(origin/main, HEAD) to diff NEW/CHANGED node shards correctly. depth 1
          # leaves origin/main unresolvable on a pull_request checkout (which fetches only the merge
          # ref), silently degrading the gate to "0 touched, always green" — the same requirement
          # land-verify.yml already solved this way.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Assert base ref resolvable
        # The tripwire for the fetch-depth above. preflight.mjs below runs
        # several base-ref-consuming gates (check-clause-digest,
        # check-nav-reachability -> check-shard-assembly, run-proptests --base,
        # verify_repo --changed). With origin/<base> unresolvable some fail
        # closed and some silently degrade to "0 touched, always green", and
        # neither says so in a way the reader can act on. Three-second red here
        # naming the cause, instead of a twenty-minute misdiagnosis. Plain git,
        # no gate script: an environment precondition, not a gate, so it adds
        # nothing for check-workflow-gate-parity.mjs to pair against.
        shell: bash
        run: |
          set -euo pipefail
          BASE="origin/${GITHUB_BASE_REF:-main}"
          if ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            echo "::error::base ref $BASE does not resolve in this checkout. Base-ref-consuming gates in this job would fail CLOSED or silently degrade. Set fetch-depth: 0 on this job's actions/checkout step."
            exit 1
          fi
          echo "base-ref: RESOLVED $BASE @ $(git rev-parse --short=12 "$BASE")"

      # On merge_group, on push to main (EXCEPT the regen bot's own commit),
      # and on workflow_dispatch, assemble the derived tree EPHEMERALLY and
      # export DERIVED_ROOT for the preflight run.
      #
      # WHY push:main joined (measured 2026-09-11):
      # 19 of 19 red `Scripts Verify` runs on main 2026-09-08→11 were one
      # shape — a human merge commit landed, and the derived-freshness gates
      # ran HARD on it (push:main is MAIN context: everything blocks) but
      # judged the COMMITTED tree, whose shared derived artifacts are by
      # construction stale until derived-artifacts-regen.yml's
      # `chore(derived): regenerate …` commit lands ~1 minute later and goes
      # green. One red notification per merge, zero information. Judging the
      # merge commit against the same ephemeral regenerated tree the
      # merge_group queue already uses stops that pattern WITHOUT weakening
      # anything: the gates stay HARD (isMainContext() is true on push:main
      # and workflow_dispatch), and the DERIVED_ROOT_GATES commands
      # (scripts/derived-artifacts.mjs) overlay-read the scratch tree only —
      # no gate script changed, no gate became advisory, and the
      # DERIVED_ROOT_GATES list did not widen.
      #
      # THE REGEN EXCEPTION is the invariant "main is green after regen": the
      # bot's commit is the one push whose committed derived artifacts ARE
      # fresh, so its run must keep judging the committed tree (DERIVED_ROOT
      # stays empty — sibling step below) or a bot regression that committed
      # stale artifacts would be judged against a self-healed scratch tree
      # and never seen.
      #
      # The queue's ref is byte-for-byte the tree that will be main, so the
      # shared-derived-artifact gates (§18 coverage, count-drift,
      # derived-freshness, index-sync, sitemap, nav-reachability) are HARD
      # there — they read the scratch tree, never the checkout, and nothing
      # derived is ever committed (asserted below). On merge_group
      # preflight.mjs additionally strips DERIVED_ROOT from every non-aware
      # subprocess; the only readers of the variable anywhere in scripts/ are
      # the DERIVED_ROOT_GATES commands themselves (audited 2026-09-11: the
      # seven listed commands plus their helpers counts.mjs/derivedResolve),
      # so on the push/dispatch events — where no strip exists — every other
      # gate's verdict is untouched. pull_request runs skip this step
      # entirely and are UNCHANGED (PR-advisory, stale-by-construction
      # inputs). workflow_dispatch is report-only by declaration, so mounting
      # the scratch tree there only makes the on-demand proof possible.
      - name: Ephemeral derived tree (merge_group, push:main non-regen, dispatch)
        id: derived
        if: >-
          github.event_name == 'merge_group' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(derived): regenerate'))
        shell: bash
        run: |
          set -euo pipefail
          SCRATCH="${RUNNER_TEMP}/derived-tree"
          node scripts/assemble-chaingraph.mjs --out "${SCRATCH}/chaingraph/chaingraph.json"
          node scripts/derived-artifacts.mjs --out "${SCRATCH}"
          echo "root=${SCRATCH}" >> "$GITHUB_OUTPUT"
          echo "DERIVED_ROOT=${SCRATCH} — freshness gates judge the ephemeral regenerated tree (event: ${GITHUB_EVENT_NAME})."

      # The exact complement, so the committed-tree path is VISIBLE in the log
      # instead of a silently-skipped step: on the bot's own commit nothing is
      # assembled, DERIVED_ROOT stays empty, and the freshness gates judge the
      # COMMITTED tree — which the bot just made fresh (invariant: main is
      # green after regen). This line is the GREEN control's log evidence.
      - name: Regen commit — committed-tree path (DERIVED_ROOT left empty)
        if: >-
          github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(derived): regenerate')
        run: |
          echo "head commit is the regen bot's (chore(derived): regenerate…) — no ephemeral assembly, DERIVED_ROOT left empty, freshness gates judge the COMMITTED tree."

      - name: Preflight (full gate suite)
        env:
          # check-id-collision.mjs leg (c) scans other OPEN PRs for a claimed art-id
          # (the collision class no in-tree gate can see: two open PRs never share a
          # tree, so file-level uniqueness gates cannot catch them). gh reads the job's
          # own token from the environment — token-free, no extra secret.
          GITHUB_TOKEN: ${{ github.token }}
          # Empty on pull_request and on push:main runs of the regen bot's own
          # chore(derived) commit — those judge the committed tree, unchanged.
          # Set to the ephemeral scratch tree on merge_group, on push:main of a
          # human commit, and on workflow_dispatch (step above). preflight.mjs
          # scopes this to the DERIVED_ROOT_GATES commands only; that list did
          # not widen and no gate's blocking status moves.
          DERIVED_ROOT: ${{ steps.derived.outputs.root }}
          # When the scratch tree IS mounted, preflight must apply the SAME
          # root-scoping rules it applies on merge_group: strip the root from
          # every non-aware subprocess, run the DERIVED_ROOT_GATES commands
          # HARD against it, and downgrade the non-aware COVERED freshness
          # gates (e.g. EUC register, OKF bundle — they read in-tree paths
          # and cannot overlay-read a scratch tree) while the aware
          # `derived-artifacts.mjs --verify` enforces their freshness HARD
          # against the scratch tree. That rule set keys on
          # GITHUB_EVENT_NAME === 'merge_group' inside preflight.mjs (the
          # 2026-09-06 merge_group hard-gates rule), and this row is fenced
          # from editing gate scripts — so when DERIVED_ROOT is set the step
          # presents the event name that selects those existing rules, via a
          # shell-level override (GITHUB_* names are runner-reserved and a
          # step-level env entry would be silently ignored — measured
          # 2026-09-11, run 34654251817). Net enforcement is unchanged from
          # the queue's proven shape: nothing becomes advisory that is not
          # already advisory on merge_group, and every freshness verdict now
          # comes from the fresh scratch tree. When the root is NOT mounted
          # (pull_request, the regen bot's own push) preflight runs with the
          # runner's real environment and the run is byte-for-byte today's
          # behavior.
          #
          # NOTE: while the scratch tree is mounted this run intentionally
          # takes merge_group's shape in full — including its fail-fast
          # (no run-to-completion) on a red, and advisory statuses for the
          # non-aware COVERED gates. Their freshness stays HARD via the
          # aware --verify gate on the scratch tree.
        run: |
          if [ -n "$DERIVED_ROOT" ]; then
            GITHUB_EVENT_NAME=merge_group node scripts/preflight.mjs
          else
            node scripts/preflight.mjs
          fi

      # The single-writer law, proven, not assumed. The
      # ephemeral assembly above must have left the checkout byte-identical —
      # nothing derived is EVER committed from a run that assembled one.
      - name: Assert clean tree (nothing derived was committed)
        if: >-
          github.event_name == 'merge_group' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(derived): regenerate'))
        shell: bash
        run: |
          set -euo pipefail
          s="$(git status --porcelain)"
          if [ -n "$s" ]; then
            echo "::error::job dirtied the checkout — the ephemeral derived tree must never touch it:"
            printf '%s\n' "$s"
            exit 1
          fi
          echo "checkout clean — the ephemeral derived tree touched nothing."

      - name: Citation drift (degraded, metadata-only -- CI checks out no workspace-root research/clause-snapshots/)
        # Already exercised as part of the preflight run above; a separate named
        # step exists so a citation-drift failure reads as its own line in the
        # Actions UI instead of being buried in the full-suite log. CI has no
        # workspace-root snapshot excerpts, so this always runs in the degraded
        # shape (digest-resolution only; the value-match check reports
        # SKIPPED-NO-SNAPSHOT, never a pass).
        run: node scripts/check-citation-drift.mjs

  scripts-verify-required:
    name: scripts-verify / required
    # Always-report shape: the check named in the branch ruleset. ALWAYS
    # dispatches and ALWAYS reports (if: always()), so it can never leave a PR
    # hanging on a check that never ran. Fails iff the substantive job actually
    # ran and failed/was cancelled; a skip (irrelevant PR, or draft) is a pass.
    needs: [relevant, scripts-verify]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report
        env:
          RESULT: ${{ needs.scripts-verify.result }}
        run: |
          echo "scripts-verify result: $RESULT"
          if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
            exit 1
          fi
          exit 0
