name: Proposals Label

# AGENTPR-1 receipt fast-track (doctrine item 3 + security item 5): applying a
# label needs write, and a fork PR's OWN `pull_request` run must never get
# write (see proposals-verify.yml). This is the standard safe pattern —
# triggered by `workflow_run` of the read-only verify job, running in the base
# repo's context (never checks out fork code), reading only the small JSON
# signal artifact the verify job uploaded. Nothing here builds, merges, or
# executes anything from the PR.

on:
  workflow_run:
    workflows: ["Proposals Verify"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply receipt-verified label from signal artifact
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download signal artifact
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const match = artifacts.data.artifacts.find((a) => a.name === 'proposals-signal');
            if (!match) { core.info('No proposals-signal artifact — nothing to label.'); return; }
            const dl = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: match.id,
              archive_format: 'zip',
            });
            fs.writeFileSync('/tmp/signal.zip', Buffer.from(dl.data));
            const { execSync } = require('child_process');
            execSync('unzip -o /tmp/signal.zip -d /tmp/signal');
            const signal = JSON.parse(fs.readFileSync('/tmp/signal/signal.json', 'utf8'));
            if (!signal.receipt_verified) { core.info(`PR #${signal.pr_number}: not receipt-verified — no label.`); return; }
            const labelName = 'receipt-verified';
            const labels = await github.rest.issues.listLabelsForRepo({ owner: context.repo.owner, repo: context.repo.repo });
            if (!labels.data.some((l) => l.name === labelName)) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
                color: '0e8a16',
                description: 'AGENTPR-1: sample_artifact execution_hash recomputed and matched (embed/lib verify lineage).',
              });
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: signal.pr_number,
              labels: [labelName],
            });
            core.info(`PR #${signal.pr_number}: applied "${labelName}".`);
