name: HTML Verify

# Gate-coverage fix for HTMLCI-1 (2026-07-14): bulk HTML-only PRs (tool/guide/
# chaingraph page edits, CSP rollout batches, footer/chrome sweeps) touch no
# kernel or chaingraph.json path, so cross-engine-parity.yml and
# land-verify.yml's path filters never fire for them. CSP-ROLLOUT batch A
# merged 48 files including index.html with ZERO CI checks (admin-merge,
# preflight-green-only). This workflow closes that gap the same way
# land-verify.yml closed it for `.land` PRs.
#
# Cheap, HTML-relevant, already-green gates only. Node-only, no QuickJS/Bun/
# kernel setup. Additive only: does not replace or weaken any existing gate.

on:
  # REGEN-COMPLETION TRIGGER (2026-10-08 move): main-side gates fire on the
  # single-writer regen's
  # COMPLETION, not on the bare PR-merge commit (measured four-week census:
  # ~95 of 203 failed runs were push-triggered gates red-by-construction on
  # the merge commit before the regen's chore commit landed — nav-island 16,
  # sitemap/trust-signals stale among them). Every landing still reaches this
  # workflow on a fresh tree — the trigger mechanics, the
  # two-completions-per-drift-repairing-landing shape, the stand-down on the
  # superseded first completion, and the regen's own exposure of which commit
  # this is are documented at the top of land-verify.yml, which shares it.
  # The old push `paths:` filter survives as the ci-paths.json key
  # "html-verify" (the relevance job below diffs against it on
  # pull_request / merge_group); on workflow_run there is nothing to scope —
  # the gates run in full, exactly as they did on every push:main dispatch.
  workflow_run:
    workflows: [ "Derived Artifacts Regen" ]
    types: [ completed ]
    branches: [ main ]
  pull_request:
    # ready_for_review added (DRAFTCI-3, 2026-07-20): draft PRs are skipped
    # below, so a readied draft must trigger a fresh run or it could merge
    # with no checks. Default types kept explicit alongside it.
    #
    # Always-report shape (2026-08-16): NO `paths:` filter here anymore —
    # see scripts-verify.yml's identical comment. The `relevant` job below
    # decides against scripts/ci-paths.json key "html-verify".
    #
    # converted_to_draft added (2026-08-30): a PR opened
    # non-draft that goes RED by design, then converted to draft AFTER the
    # run already failed, kept the stale red forever — nothing re-dispatched
    # this workflow on that transition. Measured on PR #1584 (land-verify.yml
    # class): opened 13:44:08Z, run failed by 13:44:33Z, converted_to_draft
    # 13:54:49Z, red check untouched afterward. This re-fires the workflow on
    # that exact transition so the draft==false skip below supersedes the
    # stale red.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # merge_group: see scripts-verify.yml's identical comment — required checks
  # must fire on merge_group or the queue deadlocks waiting on a status that
  # never reports.
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push/synchronize on the same PR ref supersedes its prior
  # in-progress run (2026-08-30) — letting the stale one
  # finish is redundant CI time, not lost coverage. The same expression also
  # cancels a superseded workflow_run run (the 2026-10-08 regen-completion
  # move): a
  # drift-repairing landing fires this workflow twice — the first completion
  # (head_sha = the merge commit, stale-by-construction, stood down by the
  # substantive job's `if:` below) is cancelled by the second completion
  # (head_sha = the regen bot's fresh commit) seconds later; the newer run
  # wins. This workflow has no push-only downstream job (unlike
  # land-verify.yml's attest-fv-artifacts) to lose. Measured 2026-08-30 run
  # 33315676452: scripts-verify.yml's own push run stayed red on stale
  # derived artifacts (debt-ledger) for 9 minutes while the regen bot's own
  # push, 36s later, produced a clean green run for the same ref; same race
  # shape hits every workflow gating a COVERED derived artifact on push:main
  # — which is why the push:main trigger itself is now gone. NEVER cancel a
  # merge_group run — a cancelled merge_group run reports nothing back to
  # the queue, which deadlocks it rather than just leaving a stale red.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

# The commit this run gates. On workflow_run, github.sha is the head of the
# default branch at event time — it has already moved to the regen's repair
# commit when one exists, which is exactly the supersede signal the
# substantive job's `if:` reads — and the tree to gate is the completed
# regen's head_sha, never the event-time branch head (it can race past what
# the regen actually validated; same rule as deploy-to-dreamhost.yml's
# DEPLOY_SHA). On pull_request / merge_group, github.ref is the merge/queue
# ref — byte-for-byte today's default checkout.
env:
  GATE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

jobs:
  relevant:
    name: relevant
    # Always-report shape: see scripts-verify.yml's identical job for the
    # full rationale. workflow_run / workflow_dispatch events report hit=true
    # unconditionally (there is no path filter left to scope them; the
    # workflow_run trigger fires on every completed main regen and the gates
    # run in full — same as the old push:main dispatch).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hit: ${{ steps.check.outputs.hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Check path relevance
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: node scripts/check-ci-relevant.mjs --key html-verify

  html-verify:
    name: CSP + copy-hallmarks + dead-link + chrome gates
    needs: relevant
    # DRAFTCI-3 (2026-07-20): expected-red shard/kernel PRs open as drafts by
    # doctrine (they ride the next assemble-and-land regeneration step).
    # GitHub still runs pull_request workflows on drafts, so those PRs
    # showed a red X despite the draft
    # rule — the red carried no information. Skip drafts; the run fires on
    # ready_for_review and the workflow_run trigger (after the single-writer
    # regen) is the main-side backstop.
    #
    # Always-report shape: also gated on needs.relevant.outputs.hit.
    #
    # The regen-completion workflow_run guard (2026-10-08 move): only a
    # SUCCESSFUL main
    # regen may drive these gates, and only while its commit is still the
    # default branch's head at event time. The first completion of a
    # drift-repairing landing fires with head_sha = the merge commit M —
    # stale-by-construction for every shared derived artifact, and already
    # superseded by the regen bot's commit R (github.sha has moved past it) —
    # so this job stands down there and the second completion, head_sha = R,
    # runs every gate on the fresh tree. Zero red runs on the merge commit is
    # the point of the move; a stale artifact the regen will NOT repair still
    # reds here on the surviving completion, because github.sha never moves.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.relevant.outputs.hit == 'true' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # The one commit this run gates (workflow-level GATE_SHA — the
          # completed regen's head_sha on the workflow_run trigger; the
          # merge/queue ref unchanged on pull_request / merge_group).
          ref: ${{ env.GATE_SHA }}
          # fetch-depth 0 (was 1, 2026-08-27): the Nav reachability gate
          # below shells to check-shard-assembly.mjs, which needs to resolve
          # origin/main to tell a mid-flight PENDING-ASSEMBLE
          # shard from a genuinely unlinked island. depth 1 leaves origin/main
          # unresolvable on a pull_request checkout (single-branch, tip-only),
          # so resolveBase() fails closed (SO #34c) and the excuse never
          # applies — every brand-new node page reported as a false-positive
          # island. Same requirement scripts-verify.yml already solved this way
          # (2026-08-16, for check-clause-digest.mjs).
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Assert base ref resolvable
        # The tripwire for the fetch-depth above. The Nav reachability gate
        # below reaches check-shard-assembly.mjs, which resolves origin/<base>;
        # if the checkout does not carry that ref the sub-gate fails closed, and
        # this job's real subject is then a CHECKOUT defect, not a content
        # defect. Asserting it HERE makes that a three-second red naming the
        # cause instead of a twenty-minute hunt for a page that is not broken.
        # Plain git, no gate script: an environment precondition, not a gate, so
        # it adds nothing for check-workflow-gate-parity.mjs to pair against.
        shell: bash
        run: |
          set -euo pipefail
          BASE="origin/${GITHUB_BASE_REF:-main}"
          if ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            echo "::error::base ref $BASE does not resolve in this checkout. Base-ref-consuming gates in this job would fail CLOSED and mis-report. Set fetch-depth: 0 on this job's actions/checkout step."
            exit 1
          fi
          echo "base-ref: RESOLVED $BASE @ $(git rev-parse --short=12 "$BASE")"

      # On merge_group, assemble the derived tree
      # EPHEMERALLY so the nav-reachability gates below read the assembled
      # speculative monolith (their only DYNAMIC root) instead of the possibly
      # stale committed one — a genuinely unlinked page FAILS the queue there.
      # pull_request/push:main skip this step and are unchanged.
      - name: Ephemeral derived tree (merge_group)
        id: derived
        if: github.event_name == 'merge_group'
        shell: bash
        run: |
          set -euo pipefail
          SCRATCH="${RUNNER_TEMP}/derived-tree"
          node scripts/assemble-chaingraph.mjs --out "${SCRATCH}/chaingraph/chaingraph.json"
          node scripts/derived-artifacts.mjs --out "${SCRATCH}"
          echo "root=${SCRATCH}" >> "$GITHUB_OUTPUT"

      - name: Binary/control-byte gate (NUL + stray control bytes)
        # Runs first: a NUL byte makes a file read as BINARY to grep and ripgrep,
        # so every grep-based gate after it silently stops matching that file
        # while it still ships. A tool page shipped exactly that in 2026-08 with
        # a NUL inside a JS string delimiter, and the JS syntax gate read green
        # both before and after the fix, because that parses as valid JavaScript.
        # This is the HTML-PR leg; the vector that has actually bitten us is a
        # hand-edited tool page.
        run: node scripts/check-binary-bytes.mjs

      - name: CSP consistency (FOOTER-1/CSP-CONTRACT-1)
        run: node scripts/check-csp-consistency.mjs

      - name: Site static egress scan (tools/guides/chaingraph fetch/XHR/WS scan)
        run: node scripts/check-site-egress.mjs

      - name: Internal-lang leak (INTERNAL-LANG-LEAK-1)
        run: node scripts/check-internal-lang-leak.mjs

      - name: Copy hallmarks (§1.4)
        run: |
          node scripts/check-copy-hallmarks.mjs
          node scripts/check-webmcp-meta-budgets.mjs --ceiling
          node scripts/check-webmcp-meta-neardupes.mjs --ceiling

      - name: Cross-surface fact consistency
        # The page half of the pair land-verify.yml guards from the kernel side:
        # a page-only PR that edits a node page's published table_version /
        # table_source / regulatory_basis / mcp_name / version away from what
        # its kernel emits fails here. Leg (b) is report-only and never affects
        # the exit code.
        run: node scripts/check-cross-surface.mjs

      - name: Credits registry coverage (vendored-code license gate)
        run: node scripts/check-credits-coverage.mjs repo

      - name: Credits page freshness (generated from registry)
        run: node scripts/gen-credits.mjs repo --check

      - name: Dead-link gate
        run: node scripts/dead-link-check.mjs

      - name: Nav reachability gate (NAV-ISLAND-1 - no new island pages)
        # HARD in every context, PR and main alike. Fails if a committed .html is
        # reachable by no on-site nav path (only via sitemap/direct URL) and is
        # not in scripts/nav-island-baseline.json. Redirect shims (meta-refresh /
        # robots noindex) are auto-exempt. A new island is a CONTENT defect the
        # PR itself must fix (link the page from a hub) — the main-side regen
        # cannot repair it, so it is never advisory. (Measured 2026-08-16: this
        # step used to be advisory on PRs and PR #1309 shipped
        # chaingraph/integrator-profile.html unlinked, green.)
        # (the a62d8601 incident): on pull_request a
        # chaingraph/<id>.html page whose shard is on disk is treated as
        # REACHABLE-PENDING-REGEN (advisory) — a regen failure on main must not
        # block the fix PR. On merge_group the gate reads the ephemeral assembled
        # monolith (DERIVED_ROOT below) and the page either resolves or FAILS.
        env:
          DERIVED_ROOT: ${{ steps.derived.outputs.root }}
        run: node scripts/check-nav-reachability.mjs

      - name: Nav-island baseline freshness (shared derived artifact)
        # nav-island-baseline.json is a SHARED DERIVED ARTIFACT — measured,
        # rewritten by 57% of page-adding commits. It is single-writer: the
        # Derived Artifacts Regen workflow on main owns it, and a PR branch must
        # not regenerate it (concurrent branches rewriting one generated file
        # conflict on merge, which deletes the merge ref and silently removes CI
        # from the PR entirely). Blocking a PR on a gate that PR is not allowed
        # to satisfy would turn every such PR red, so: ADVISORY on a
        # pull_request, BLOCKING on push-to-main/merge_group.
        #
        # ⛔ The gate is NOT skipped and NOT deleted — it runs identically in both
        # contexts and emits a visible ::warning:: annotation when it fails on a
        # PR. Only the exit code differs. run-gate.mjs (LAND-VERIFY-ADVISORY-
        # SPLIT-1) is the one place this split lives now, shared with
        # land-verify.yml's count-drift gate. On merge_group, DERIVED_ROOT
        # (the DERIVED_ROOT mount) makes isMainContext() HARD and the gate reads
        # the ephemeral assembled tree, so a stale baseline REFUSES the queue.
        env:
          DERIVED_ROOT: ${{ steps.derived.outputs.root }}
        run: node scripts/run-gate.mjs node scripts/check-nav-reachability.mjs --baseline-check

      # Nothing derived is EVER committed from the
      # ephemeral assembly — proven, not assumed.
      - name: Assert clean tree (merge_group — nothing derived was committed)
        if: github.event_name == 'merge_group'
        shell: bash
        run: |
          set -euo pipefail
          s="$(git status --porcelain)"
          if [ -n "$s" ]; then
            echo "::error::merge_group job dirtied the checkout — the ephemeral derived tree must never touch it:"
            printf '%s\n' "$s"
            exit 1
          fi
          echo "checkout clean — the ephemeral derived tree touched nothing."

      - name: Node-page chrome (nav/footer)
        run: node scripts/check-node-page-chrome.mjs

  html-verify-required:
    name: html-verify / required
    # Always-report shape: the check named in the branch ruleset. See
    # scripts-verify.yml's identical reporter job for the full rationale.
    needs: [relevant, html-verify]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report
        env:
          RESULT: ${{ needs.html-verify.result }}
        run: |
          echo "html-verify result: $RESULT"
          if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
            exit 1
          fi
          exit 0
