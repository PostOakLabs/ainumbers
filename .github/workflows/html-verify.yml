name: HTML Verify

# Gate-coverage fix for HTMLCI-1 (2026-07-14): bulk HTML-only PRs (tool/guide/
# chaingraph page edits, CSP rollout batches, footer/chrome sweeps) touch no
# kernel or chaingraph.json path, so cross-engine-parity.yml and
# land-verify.yml's path filters never fire for them. CSP-ROLLOUT batch A
# merged 48 files including index.html with ZERO CI checks (admin-merge,
# preflight-green-only). This workflow closes that gap the same way
# land-verify.yml closed it for `.land` PRs.
#
# Cheap, HTML-relevant, already-green gates only. Node-only, no QuickJS/Bun/
# kernel setup. Additive only: does not replace or weaken any existing gate.

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/**.html'
      - 'guides/**.html'
      - 'chaingraph/**.html'
      - '*.html'
      - '.github/workflows/html-verify.yml'
  pull_request:
    # ready_for_review added (DRAFTCI-3, 2026-07-20): draft PRs are skipped
    # below, so a readied draft must trigger a fresh run or it could merge
    # with no checks. Default types kept explicit alongside it.
    #
    # Always-report shape (2026-08-16): NO `paths:` filter here anymore —
    # see scripts-verify.yml's identical comment. The `relevant` job below
    # decides against scripts/ci-paths.json key "html-verify".
    #
    # converted_to_draft added (CI-REDNOISE-GATE-1, 2026-08-30): a PR opened
    # non-draft that goes RED by design, then converted to draft AFTER the
    # run already failed, kept the stale red forever — nothing re-dispatched
    # this workflow on that transition. Measured on PR #1584 (land-verify.yml
    # class): opened 13:44:08Z, run failed by 13:44:33Z, converted_to_draft
    # 13:54:49Z, red check untouched afterward. This re-fires the workflow on
    # that exact transition so the draft==false skip below supersedes the
    # stale red.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # merge_group: see scripts-verify.yml's identical comment — required checks
  # must fire on merge_group or the queue deadlocks waiting on a status that
  # never reports.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  relevant:
    name: relevant
    # Always-report shape: see scripts-verify.yml's identical job for the
    # full rationale. Push events report hit=true unconditionally (the push
    # `paths:` filter above already scoped dispatch).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hit: ${{ steps.check.outputs.hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Check path relevance
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: node scripts/check-ci-relevant.mjs --key html-verify

  html-verify:
    name: CSP + copy-hallmarks + dead-link + chrome gates
    needs: relevant
    # DRAFTCI-3 (2026-07-20): expected-red shard/kernel PRs open as drafts by
    # doctrine (they ride the next assemble-and-land regeneration step).
    # GitHub still runs pull_request workflows on drafts, so those PRs
    # showed a red X despite the draft
    # rule — the red carried no information. Skip drafts; the run fires on
    # ready_for_review and the push-to-main trigger remains the backstop.
    #
    # Always-report shape: also gated on needs.relevant.outputs.hit.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.relevant.outputs.hit == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # fetch-depth 0 (was 1, 2026-08-27): the Nav reachability gate
          # below shells to check-shard-assembly.mjs, which needs to resolve
          # origin/main to tell a mid-flight PENDING-ASSEMBLE
          # shard from a genuinely unlinked island. depth 1 leaves origin/main
          # unresolvable on a pull_request checkout (single-branch, tip-only),
          # so resolveBase() fails closed (SO #34c) and the excuse never
          # applies — every brand-new node page reported as a false-positive
          # island. Same requirement scripts-verify.yml already solved this way
          # (2026-08-16, for check-clause-digest.mjs).
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Assert base ref resolvable
        # The tripwire for the fetch-depth above. The Nav reachability gate
        # below reaches check-shard-assembly.mjs, which resolves origin/<base>;
        # if the checkout does not carry that ref the sub-gate fails closed, and
        # this job's real subject is then a CHECKOUT defect, not a content
        # defect. Asserting it HERE makes that a three-second red naming the
        # cause instead of a twenty-minute hunt for a page that is not broken.
        # Plain git, no gate script: an environment precondition, not a gate, so
        # it adds nothing for check-workflow-gate-parity.mjs to pair against.
        shell: bash
        run: |
          set -euo pipefail
          BASE="origin/${GITHUB_BASE_REF:-main}"
          if ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            echo "::error::base ref $BASE does not resolve in this checkout. Base-ref-consuming gates in this job would fail CLOSED and mis-report. Set fetch-depth: 0 on this job's actions/checkout step."
            exit 1
          fi
          echo "base-ref: RESOLVED $BASE @ $(git rev-parse --short=12 "$BASE")"

      - name: Binary/control-byte gate (NUL + stray control bytes)
        # Runs first: a NUL byte makes a file read as BINARY to grep and ripgrep,
        # so every grep-based gate after it silently stops matching that file
        # while it still ships. A tool page shipped exactly that in 2026-08 with
        # a NUL inside a JS string delimiter, and the JS syntax gate read green
        # both before and after the fix, because that parses as valid JavaScript.
        # This is the HTML-PR leg; the vector that has actually bitten us is a
        # hand-edited tool page.
        run: node scripts/check-binary-bytes.mjs

      - name: CSP consistency (FOOTER-1/CSP-CONTRACT-1)
        run: node scripts/check-csp-consistency.mjs

      - name: Site static egress scan (tools/guides/chaingraph fetch/XHR/WS scan)
        run: node scripts/check-site-egress.mjs

      - name: Internal-lang leak (INTERNAL-LANG-LEAK-1)
        run: node scripts/check-internal-lang-leak.mjs

      - name: Copy hallmarks (§1.4)
        run: node scripts/check-copy-hallmarks.mjs

      - name: Cross-surface fact consistency
        # The page half of the pair land-verify.yml guards from the kernel side:
        # a page-only PR that edits a node page's published table_version /
        # table_source / regulatory_basis / mcp_name / version away from what
        # its kernel emits fails here. Leg (b) is report-only and never affects
        # the exit code.
        run: node scripts/check-cross-surface.mjs

      - name: Credits registry coverage (vendored-code license gate)
        run: node scripts/check-credits-coverage.mjs repo

      - name: Credits page freshness (generated from registry)
        run: node scripts/gen-credits.mjs repo --check

      - name: Dead-link gate
        run: node scripts/dead-link-check.mjs

      - name: Nav reachability gate (NAV-ISLAND-1 - no new island pages)
        # HARD in every context, PR and main alike. Fails if a committed .html is
        # reachable by no on-site nav path (only via sitemap/direct URL) and is
        # not in scripts/nav-island-baseline.json. Redirect shims (meta-refresh /
        # robots noindex) are auto-exempt. A new island is a CONTENT defect the
        # PR itself must fix (link the page from a hub) — the main-side regen
        # cannot repair it, so it is never advisory. (Measured 2026-08-16: this
        # step used to be advisory on PRs and PR #1309 shipped
        # chaingraph/integrator-profile.html unlinked, green.)
        run: node scripts/check-nav-reachability.mjs

      - name: Nav-island baseline freshness (shared derived artifact)
        # nav-island-baseline.json is a SHARED DERIVED ARTIFACT — measured,
        # rewritten by 57% of page-adding commits. It is single-writer: the
        # Derived Artifacts Regen workflow on main owns it, and a PR branch must
        # not regenerate it (concurrent branches rewriting one generated file
        # conflict on merge, which deletes the merge ref and silently removes CI
        # from the PR entirely). Blocking a PR on a gate that PR is not allowed
        # to satisfy would turn every such PR red, so: ADVISORY on a
        # pull_request, BLOCKING on push-to-main/merge_group.
        #
        # ⛔ The gate is NOT skipped and NOT deleted — it runs identically in both
        # contexts and emits a visible ::warning:: annotation when it fails on a
        # PR. Only the exit code differs. run-gate.mjs (LAND-VERIFY-ADVISORY-
        # SPLIT-1) is the one place this split lives now, shared with
        # land-verify.yml's count-drift gate.
        run: node scripts/run-gate.mjs node scripts/check-nav-reachability.mjs --baseline-check

      - name: Node-page chrome (nav/footer)
        run: node scripts/check-node-page-chrome.mjs

  html-verify-required:
    name: html-verify / required
    # Always-report shape: the check named in the branch ruleset. See
    # scripts-verify.yml's identical reporter job for the full rationale.
    needs: [relevant, html-verify]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report
        env:
          RESULT: ${{ needs.html-verify.result }}
        run: |
          echo "html-verify result: $RESULT"
          if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
            exit 1
          fi
          exit 0
