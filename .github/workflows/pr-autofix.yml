name: PR Autofix

# The per-PR derivables autofix (2026-10-08), staged from the four-week census of
# failed push/merge_group runs (§4 fix 1 there): the autofix.ci / pre-commit.ci
# pattern for the per-PR derivables. The census measured 203 failed
# push/merge_group runs in four weeks; 44 were the §18 deferred
# ratchet/provenance ejecting a node PR that lacked its baseline bump, ~24 were
# or a11y writer blocks, ~8 were manifest-example drift. Every one of those is
# deterministic from the PR's own files and has an existing `--write` command —
# but none was enforced before the label, because the PR-side gate is advisory
# while the merge_group gate is hard (a PR-side advisory is not CI-enforcement).
# PR's OWN deterministic writers on the PR head branch:
#
#   1. RETIRED 2026-10-19 (parallel PRs conflicted on the file): the §18 baseline
#      is now a main-regen single-writer artifact (derived-artifacts.mjs id
#      'compute-proof-baseline'); this workflow no longer writes it and its
#      containment no longer allows it. History of the retired writer:
#      new/changed node under chaingraph/graph/nodes/
#        -> the §18 bump rode the node PR:
#           `node scripts/check-compute-proof-coverage.mjs --update-baseline`
#           against an EPHEMERALLY ASSEMBLED speculative monolith (the same two
#           commands the merge_group jobs run: assemble-chaingraph --out scratch
#           + derived-artifacts --out, then DERIVED_ROOT) — exactly the tree
#           merge_group judges. A bare --update-baseline on the PR checkout
#           would read the stale committed monolith and write a no-op baseline;
#           the scratch assembly is what makes the bump real (measured
#           2026-10-08 on a synthetic committed deferred shard: only the
#           DERIVED_ROOT run over the derived-artifacts --out scratch absorbs
#           it — "new node(s) accepted", deferred 4 -> 5, the exact #2284 bump
#           shape). Refuse-on-regression is unchanged: a real proof regression
#           (proven at pin, deferred now) makes the writer exit 1 and NOTHING
#           is auto-edited — a deliberate re-park of a proven node is a Tim
#           call, not a bot edit.
#   2. new/changed manifests/*.manifest.json
#        -> `node scripts/gen-manifest-examples.mjs --write --only <id>` per
#           manifest (id = basename minus .manifest.json).
#   3. new/changed page under chaingraph/*.html or tools/*.html
#        -> `node scripts/check-ask-agent-block.mjs --write --only <node id>`
#           per manifest-backed node page (the ask-agent writer scoping rule: --only
#           scopes the WRITE pass; the CHECK pass stays whole-tree and runs in
#           scripts-verify.yml, now HARD on pull_request), plus
#           `node scripts/check-a11y-tree.mjs --write` (no --only flag exists;
#           the writer itself rewrites only pages whose chrome drifted —
#           byte-exact pages are skipped — and holds hand-authored pages and
#           tools/ pages out of scope by its own fence).
#   4. a NEW root *.html
#        -> fail with the exact `gen-sitemap-html` rootPages message. That list
#           is curated prose (icon/name/href per page); NOT auto-edited.
#
# If the tree changed: commit by EXPLICIT pathspec as the spec-sync App (the
# same token path automerge-label.yml and derived-artifacts-regen.yml mint —
# never GITHUB_TOKEN, whose pushes do not retrigger PR checks) and push to the
# PR head branch, then exit 0 with a "autofix pushed <sha>" notice (it exited 1
# by design until 2026-10-29). The fresh push re-runs every check;
# the follow-up run on the bot-authored head is skipped by the loop guards, and
# the re-tested run reports the PR's real verdicts. If the tree did not
# change: exit 0.
#
# TRUST BOUNDARY (2026-11-03). The writers above are
# PR-branch code. Until this row they ran in the same job that minted the
# push-capable App token, so a PR that edited a script it runs (or wrote
# .git/hooks, $GITHUB_ENV, $GITHUB_PATH) could act with that token. Now:
#   - job `autofix` runs the PR's writers with NO App token and contents: read.
#     It hands over only data: a binary patch of the writers' diff, as an
#     artifact.
#   - job `autofix-push` mints the token and runs NO PR-branch code: a fresh
#     checkout, `git apply` of the patch after re-checking every path in it
#     against the PR's touched set (+ the writers' baselines) and refusing
#     renames, deletions, mode changes, symlinks and submodules, then commit
#     and push with an empty hooks path.
# A PR can still edit THIS file, and pull_request runs the PR's copy of it.
# That edit is a workflow change, which automerge-label.yml arms only after a
# green zizmor run, and which a reviewer sees.
#
# MAIN-MOVED SYNC (job `sync-main`, 2026-11-03). On push to main
# (and workflow_dispatch, dry-run by default) it runs
# scripts/ci/pr-sync-main.mjs from main's own checkout: merge origin/main into
# each BEHIND/DIRTY same-repo PR (merge, never rebase or force), take main's
# side of a conflict only in main-owned derived paths (SSOT
# scripts/derived-artifacts.mjs), comment once per head on any other conflict.
# Bounds and loop guards live in the script header. It never runs the PR's
# writers itself: its App-authored merge push fires pull_request here, and the
# two jobs above regenerate the derivables on the merged tree.
#
# LOOP GUARDS (both required by the row):
#   - same-repo heads only: a fork's head repo differs from the base repo,
#     which the App token cannot push to (same guard automerge-label.yml uses).
#   - skip the App's own autofix commits: the guard step skips a head commit
#     whose subject starts with `chore(autofix):`, and any other head commit
#     authored/committed by the App EXCEPT a `chore(bot-sync):` merge (whose
#     derivables are exactly what this workflow must refresh). The job-level
#     actor check is gone for that reason: the bot-sync merge push is the
#     App's. The chain is bounded: bot-sync merge -> one autofix commit ->
#     skipped.
#   - the sync job pushes only to PR branches, never to main, so it cannot
#     retrigger its own `push: main`.
#
# WRITER-SCOPE CONTAINMENT (row hard stop: "a writer changes files outside the
# PR's own touched set"): after the writers run, every changed path is checked
# against the PR's touched set plus the three writers' own baseline outputs
# (scripts/compute-proof-baseline.json, scripts/a11y-baseline.json,
# scripts/manifest-examples-baseline.json). Any escape fails the run BEFORE a
# commit is attempted — the autofix may narrow a PR's red, never widen its
# diff.
#
# KERNEL WRITERS (2026-11-06): a PR touching chaingraph/kernels/<id>.kernel.mjs also
# gets, via scripts/ci/pr-autofix-kernel.mjs, the identity stamp in its own node shard
# (gen-kernel-identity --write --shard=<id>), a manifest input-schema backfill
# (gen-input-schemas --write --only <id>), and, for a touched non-derived root page,
# the footer chrome writer. Each writer has its own path allowlist and a write outside
# it is reverted and fails the job; shared derived artifacts are never allowlisted.
# The page kernel-digest meta is deliberately NOT written: re-stamping it would bless
# a stale inline compute copy, which is what that sentinel exists to catch.
#
# NOT_A_GATE in check-workflow-gate-parity.mjs: this workflow gates no merge —
# its pushing run ends green with an "autofix pushed" notice, not a required
# check verdict. The required set is unchanged (rulesets are outside this
# row's fence); scripts-verify.yml and land-verify.yml carry the four promoted
# PR-side gate steps that re-test the autofixed tree HARD.

on:
  pull_request:
    # Default types (opened, synchronize, reopened) are exactly the head-push
    # lifecycle this workflow needs. Drafts are autofixed too: a bump that
    # rides the PR branch is already correct at ready_for_review time.
  push:
    # Main moved: job `sync-main` brings the open PRs up to date. The script
    # waits (bounded) for derived-artifacts-regen on the pushed sha, then syncs
    # only if main did not move meanwhile: a regen that committed hands off to
    # its own commit's push run, and one that committed nothing (always the
    # run on the regen bot's own commit) lets this run sync. It never exits
    # waiting for a push that may not come. A workflow_run trigger on the
    # regen would do the same, but zizmor flags workflow_run as a high
    # dangerous-trigger and this job holds a push token.
    branches: [ main ]
  schedule:
    # Drain the PRs a push run deferred at its max-prs cap (10 per run) while
    # main sits still. Runs only job `sync-main` (the autofix job needs a
    # pull_request event); the script's "main unchanged" and bounded-retry
    # logic apply as on push. Offset from the hour to dodge the cron rush.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Really merge and push (default: dry-run, prints the decision per open PR)'
        type: boolean
        default: false
      max_prs:
        description: 'Most PR branches to push in this run'
        type: string
        default: '10'

permissions:
  contents: read

concurrency:
  # Serialise per PR (and the sync runs as one group), never cancel: a
  # cancelled run could die between commit and push; queueing the next run is
  # strictly safer (the follow-up run on a bot-authored head is skipped by the
  # loop guards above). One pending sync run is kept, so a burst of main pushes
  # collapses into one sync against the newest main.
  group: pr-autofix-${{ github.event.pull_request.number || 'sync-main' }}
  cancel-in-progress: false

jobs:
  autofix:
    name: Run the PR's own deterministic writers
    # Same-repo heads only (fork heads are unpushable for the App token). This
    # job holds NO App token: it runs PR-branch code (see TRUST BOUNDARY).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.package.outputs.changed }}
    steps:
      - name: Checkout PR head commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # The HEAD commit, not the default merge ref: the patch this job
          # hands over is applied to the PR's own head tree, byte for byte.
          # The exact sha (not the branch name) so `autofix-push` checks out
          # the very tree the patch was computed on.
          ref: ${{ github.event.pull_request.head.sha }}
          # fetch-depth 0: the touched-set derivation diffs origin/main...HEAD
          # (a merge-base diff), so origin/main must resolve as a real commit.
          fetch-depth: 0
          # Do NOT persist any credential in .git/config (zizmor: artipacked).
          persist-credentials: false

      # Loop guard (see LOOP GUARDS above). grep -F (fixed-string) is
      # load-bearing: the login contains [bot], which is a regex character class.
      - name: Guard — skip the App's own autofix commits
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          BOT_LOGIN: ainumbers-spec-sync[bot]
        run: |
          set -euo pipefail
          INFO="$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '[.author.login // "", .committer.login // ""] | join(" ")')"
          SUBJECT="$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.commit.message | split("\n")[0]')"
          echo "head commit author/committer logins: $INFO"
          echo "head commit subject: $SUBJECT"
          SKIP=false
          case "$SUBJECT" in
            'chore(autofix):'*) SKIP=true ;;
            'chore(bot-sync):'*) : ;;
            *) if grep -qF "$BOT_LOGIN" <<< "$INFO"; then SKIP=true; fi ;;
          esac
          if [ "$SKIP" = "true" ]; then
            echo "::notice title=Skipped::head commit $HEAD_SHA is the App's own autofix commit — autofix already ran; nothing to do."
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Setup Node 20
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Kernel writer allowlist tests
        if: steps.guard.outputs.skip != 'true'
        run: node --test scripts/ci/pr-autofix-kernel.test.mjs

      - name: Resolve base and classify the PR's touched set
        if: steps.guard.outputs.skip != 'true'
        id: touched
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            git fetch origin main
          fi
          git cat-file -e origin/main^{commit} || { echo "::error::origin/main does not resolve; cannot derive the PR's touched set"; exit 1; }

          mapfile -d '' -t FILES < <(git diff -z --name-only origin/main...HEAD)
          printf 'PR touches %d file(s) vs merge-base(origin/main, HEAD)\n' "${#FILES[@]}"

          NODES=(); MANIFESTS=(); PAGES=(); ROOTHTML=(); KERNELS=()
          for f in "${FILES[@]}"; do
            case "$f" in
              chaingraph/graph/nodes/*.json) NODES+=("$f") ;;
              manifests/*.manifest.json) MANIFESTS+=("$f") ;;
              chaingraph/*.html|tools/*.html) PAGES+=("$f") ;;
              chaingraph/kernels/*.kernel.mjs) KERNELS+=("$f") ;;
            esac
          done
          # NEW root *.html only: added in this PR, no directory component.
          mapfile -d '' -t ADDEDHTML < <(git diff -z --diff-filter=A --name-only origin/main...HEAD -- '*.html')
          for f in "${ADDEDHTML[@]}"; do
            case "$f" in
              */*) : ;;
              *) ROOTHTML+=("$f") ;;
            esac
          done

          # NUL-safe handoff to the writer steps (filenames are PR-author
          # controlled — same injection-safe plumbing as land-verify.yml's
          # touched-floor-files step: NUL-delimited lists on disk, mapfile -d ''
          # on read, never re-joined into a single unquoted string).
          : > "${RUNNER_TEMP}/nodes.z"; : > "${RUNNER_TEMP}/manifests.z"; : > "${RUNNER_TEMP}/pages.z"
          for f in "${NODES[@]}"; do printf '%s\0' "$f" >> "${RUNNER_TEMP}/nodes.z"; done
          for f in "${MANIFESTS[@]}"; do printf '%s\0' "$f" >> "${RUNNER_TEMP}/manifests.z"; done
          for f in "${PAGES[@]}"; do printf '%s\0' "$f" >> "${RUNNER_TEMP}/pages.z"; done
          # The full touched set, NUL-delimited, for the kernel writers' allowlists.
          : > "${RUNNER_TEMP}/touched.z"
          for f in "${FILES[@]}"; do printf '%s\0' "$f" >> "${RUNNER_TEMP}/touched.z"; done
          ROOTPAGES=()
          for f in "${FILES[@]}"; do
            case "$f" in
              */*) : ;;
              *.html) ROOTPAGES+=("$f") ;;
            esac
          done
          printf 'nodes=%d manifests=%d pages=%d new_root_html=%d\n' "${#NODES[@]}" "${#MANIFESTS[@]}" "${#PAGES[@]}" "${#ROOTHTML[@]}"

          {
            echo "has_nodes=$([[ ${#NODES[@]} -gt 0 ]] && echo true || echo false)"
            echo "has_manifests=$([[ ${#MANIFESTS[@]} -gt 0 ]] && echo true || echo false)"
            echo "has_pages=$([[ ${#PAGES[@]} -gt 0 ]] && echo true || echo false)"
            echo "has_root_html=$([[ ${#ROOTHTML[@]} -gt 0 ]] && echo true || echo false)"
            echo "has_kernel_writers=$([[ ${#KERNELS[@]} -gt 0 || ${#ROOTPAGES[@]} -gt 0 ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: New root page — the curated rootPages list is prose, not autofixable
        if: steps.guard.outputs.skip != 'true' && steps.touched.outputs.has_root_html == 'true'
        run: |
          set -euo pipefail
          # The EXACT failure text gen-sitemap-html.mjs prints for this class
          # (scripts/gen-sitemap-html.mjs, missingRootPages branch), so the red
          # reads identically wherever it surfaces. The list is curated prose;
          # the fix is a hand edit adding icon/name/href for each new page.
          mapfile -d '' -t ADDEDHTML < <(git diff -z --diff-filter=A --name-only origin/main...HEAD -- '*.html')
          MISSING=''
          for f in "${ADDEDHTML[@]}"; do
            case "$f" in
              */*) : ;;
              *)
                # A new root page the PR already added to the curated list is
                # not missing: red only on pages with no href entry there.
                if grep -qF "href: '$f'" scripts/gen-sitemap-html.mjs; then
                  echo "gen-sitemap-html: new root page $f is already in the curated rootPages list."
                  continue
                fi
                MISSING="${MISSING}${MISSING:+, }$f"
                echo "gen-sitemap-html: root page(s) missing from the curated rootPages list. Add each one (icon/name/href) so sitemap.html stays complete:"
                echo "  $f"
                ;;
            esac
          done
          [ -z "$MISSING" ] && exit 0
          # The annotation alone is actionable: it names the missing page(s)
          # instead of saying only "root page(s) missing".
          echo "::error title=gen-sitemap-html: root page(s) missing from the curated rootPages list: ${MISSING}::Add each one (icon/name/href) to the curated rootPages list so sitemap.html stays complete."
          exit 1

      # §18 baseline: NOT autofixed on the PR any more (main-regen single writer,
      # 2026-10-19). The bump that used to ride every node PR is what made parallel
      # node/prove PRs conflict serially on scripts/compute-proof-baseline.json. The
      # §18 gate now exempts brand-new deferred nodes from the ceiling, a prove PR
      # already sits under it, and main's derived-artifacts regen (COVERED id
      # 'compute-proof-baseline') is the single writer that pins the file after merge.
      # A real proof regression still reds the PR (scripts-verify / land-verify, HARD).

      - name: Manifest examples — gen-manifest-examples --write --only <id> per manifest
        if: steps.guard.outputs.skip != 'true' && steps.touched.outputs.has_manifests == 'true'
        env:
          MANIFESTS_Z: ${{ runner.temp }}/manifests.z
        run: |
          set -euo pipefail
          mapfile -d '' -t MANIFEST_FILES < "$MANIFESTS_Z"
          for f in "${MANIFEST_FILES[@]}"; do
            id="$(basename "$f" .manifest.json)"
            case "$id" in
              *,*) echo "::error::manifest id '$id' contains a comma; cannot pass through --only safely"; exit 1 ;;
            esac
            echo "▶ gen-manifest-examples --write --only $id"
            node scripts/gen-manifest-examples.mjs --write --only "$id"
          done

      - name: Ask-agent + a11y writer stamps on the PR's own pages (scoped writes)
        if: steps.guard.outputs.skip != 'true' && steps.touched.outputs.has_pages == 'true'
        env:
          PAGES_Z: ${{ runner.temp }}/pages.z
        run: |
          set -euo pipefail
          mapfile -d '' -t PAGE_FILES < "$PAGES_Z"
          # --write --only <node id> scopes the WRITE pass to exactly this
          # node's page. Two skips, both by design:
          #   • a page without a manifest is hand-authored (no generated block
          #     exists to write);
          #   • a BRAND-NEW node is not a live id in the COMMITTED monolith yet
          #     (the writer keys on chaingraph.json, which only the main-side
          #     assembler folds — measured 2026-10-08: `--only <new-id>` exits
          #     1 "not a live node id in chaingraph.json"). Its block was
          #     authored in-PR by the builder; the whole-tree CHECK pass (now
          #     HARD on pull_request in scripts-verify.yml) is what judges it.
          for f in "${PAGE_FILES[@]}"; do
            id="$(basename "$f" .html)"
            if [ ! -f "manifests/$id.manifest.json" ]; then
              echo "  skip ask-agent write for $f — no manifests/$id.manifest.json (hand-authored page, no generated block)"
              continue
            fi
            if ! NODE_ID="$id" node -e "const cg=require('./chaingraph/chaingraph.json'); process.exit((cg.nodes||[]).some((n) => n.tool_id === process.env.NODE_ID && n.status === 'live') ? 0 : 1)"; then
              echo "  skip ask-agent write for $id — not a live node in the committed monolith (brand-new node; the builder authored its block in-PR)"
              continue
            fi
            echo "▶ check-ask-agent-block --write --only $id"
            node scripts/check-ask-agent-block.mjs --write --only "$id"
          done
          # No --only flag exists on the a11y writer; it rewrites only pages
          # whose chrome drifted — INCLUDING pre-existing check-clean
          # normalization drift on pages this PR never touched (measured
          # 2026-10-08: nine main pages carry an older <meta name="ai-tool">
          # placement the writer normalizes). The row scopes this write to the
          # PR's own pages, so reverts outside the touched set right here and
          # names them; the containment step below still hard-fails the run if
          # anything outside survives the revert.
          echo "▶ check-a11y-tree --write (restricted to this PR's pages; out-of-scope reverts are discarded)"
          if ! node scripts/check-a11y-tree.mjs --write; then
            # Best-effort here BY DESIGN: a non-zero write pass (e.g. a stale
            # a11y-baseline entry, whose removal is a hand edit — the ratchet
            # only goes down) must not eat the §18 bump this run exists to
            # push. The HARD whole-tree CHECK pass in scripts-verify.yml is
            # the verdict that reds the PR.
            echo "::warning title=check-a11y-tree --write exited non-zero::a drift the writer cannot fix (e.g. a stale baseline entry) needs a hand edit; the HARD check pass in scripts-verify.yml reds this PR until then."
          fi
          mapfile -d '' -t FILES_ALL < <(git diff -z --name-only origin/main...HEAD)
          mapfile -d '' -t DIRTY < <(git diff -z --name-only)
          for f in "${DIRTY[@]}"; do
            keep=0
            for t in "${FILES_ALL[@]}"; do [ "$f" = "$t" ] && keep=1 && break; done
            case "$f" in
              scripts/a11y-baseline.json|scripts/manifest-examples-baseline.json) keep=1 ;;
            esac
            if [ "$keep" = "0" ]; then
              echo "  discarded a11y-writer rewrite outside this PR's touched set: $f (check-clean on main — not this PR's diff to widen)"
              git checkout -- "$f"
            fi
          done

      # Kernel-PR writers: the node shard's kernel identity stamp, the manifest input
      # schema, and the root-page footer chrome. Each writer sits behind its own path
      # allowlist inside scripts/ci/pr-autofix-kernel.mjs (header lists the triggers and
      # allowlists); a write outside a writer's allowlist is reverted and, for the stamp
      # and schema writers, fails the job. No shared derived artifact is ever allowlisted:
      # those have one writer, derived-artifacts-regen.yml on main.
      - name: Kernel writers (identity stamp, input schema, root chrome) behind per-writer allowlists
        if: steps.guard.outputs.skip != 'true' && steps.touched.outputs.has_kernel_writers == 'true'
        run: |
          set -euo pipefail
          node scripts/ci/pr-autofix-kernel.mjs --touched "${RUNNER_TEMP}/touched.z"

      - name: Containment — the writers changed nothing outside this PR's touched set
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Status records in `git status --porcelain -z` look like "XY path"
          # where X or Y may itself be a space (an unstaged edit is " M path").
          # Renames carry the orig path as a SECOND, unprefixed record — the
          # state flag below keeps it whole (the writers never rename, but the
          # parser must not corrupt one silently either).
          mapfile -d '' -t RAW < <(git status --porcelain -z)
          CHANGED=()
          PREV_RENAME=0
          for r in "${RAW[@]}"; do
            if [ "$PREV_RENAME" = "1" ]; then
              p="$r"; PREV_RENAME=0
            elif [[ "$r" =~ ^.[A-Z?!\ ][[:space:]] ]]; then
              p="${r:3}"
              case "${r:0:1}" in R|C) PREV_RENAME=1 ;; esac
            else
              p="$r"
            fi
            [ -n "$p" ] && CHANGED+=("$p")
          done

          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "Tree did not change — no derivable drift in this PR."
            exit 0
          fi
          echo "autofix changed:"
          printf '  %q\n' "${CHANGED[@]}"

          # Allowed = the PR's own touched set (files the writers may rewrite
          # in place) + the three writers' own baseline outputs.
          mapfile -d '' -t FILES < <(git diff -z --name-only origin/main...HEAD)
          : > "${RUNNER_TEMP}/allowed.txt"
          for f in "${FILES[@]}"; do printf '%s\n' "$f" >> "${RUNNER_TEMP}/allowed.txt"; done
          printf '%s\n' scripts/a11y-baseline.json scripts/manifest-examples-baseline.json >> "${RUNNER_TEMP}/allowed.txt"
          # The kernel writers' per-writer allowlists (their own node shard and
          # manifest, touched non-derived root pages); nothing shared is in it.
          node scripts/ci/pr-autofix-kernel.mjs --extras "${RUNNER_TEMP}/touched.z" >> "${RUNNER_TEMP}/allowed.txt"
          sort -u -o "${RUNNER_TEMP}/allowed.txt" "${RUNNER_TEMP}/allowed.txt"

          printf '%s\n' "${CHANGED[@]}" | sort -u > "${RUNNER_TEMP}/changed.txt"
          ESCAPED="$(comm -23 "${RUNNER_TEMP}/changed.txt" "${RUNNER_TEMP}/allowed.txt")"
          if [ -n "$ESCAPED" ]; then
            echo "::error::autofix hard stop — a writer changed files outside the PR's own touched set:"
            printf '%s\n' "$ESCAPED"
            echo "The autofix may narrow a PR's red, never widen its diff. Nothing was committed."
            exit 1
          fi
          echo "Containment clean — every changed path is inside the PR's touched set (+ the writers' own baselines)."

      - name: Package the autofix diff as a patch (or report a no-op)
        id: package
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/autofix"
          s="$(git status --porcelain)"
          if [ -z "$s" ]; then
            echo "autofix: no derivable drift in this PR — nothing to write. Exiting 0."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "autofix will hand over:"
          printf '%s\n' "$s"

          # Explicit pathspec only, one `git add` per path — `git add` aborts
          # the WHOLE command on a pathspec that matches nothing, so a phantom
          # entry would silently stage nothing (the measured
          # derived-artifacts-regen.yml lesson). Status records look like
          # "XY path" with X/Y possibly a space; renames carry the orig path
          # as a second unprefixed record and are kept whole (the writers
          # never rename).
          mapfile -d '' -t RAW < <(git status --porcelain -z)
          PREV_RENAME=0
          for r in "${RAW[@]}"; do
            if [ "$PREV_RENAME" = "1" ]; then
              p="$r"; PREV_RENAME=0
            elif [[ "$r" =~ ^.[A-Z?!\ ][[:space:]] ]]; then
              p="${r:3}"
              case "${r:0:1}" in R|C) PREV_RENAME=1 ;; esac
            else
              p="$r"
            fi
            [ -n "$p" ] || continue
            git add -- "$p"
          done
          git diff --cached --binary > "${RUNNER_TEMP}/autofix/autofix.patch"
          echo "patch: $(wc -c < "${RUNNER_TEMP}/autofix/autofix.patch") bytes"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Hand the patch to the push job
        if: steps.package.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix/autofix.patch
          retention-days: 1
          if-no-files-found: error

  autofix-push:
    name: Apply the writers' patch and push it as the App
    # The only job that holds the App token. It runs NO PR-branch code: a fresh
    # checkout, a trusted path check of the patch, `git apply`, commit, push.
    needs: autofix
    if: needs.autofix.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head commit (data only; nothing from it is executed)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix

      - name: Check the patch's paths, then apply it
        run: |
          set -euo pipefail
          PATCH="${RUNNER_TEMP}/autofix/autofix.patch"
          # Empty hooks dir for every git call in this job: the checkout is PR
          # data and must not execute anything.
          NOHOOKS="${RUNNER_TEMP}/nohooks"; mkdir -p "$NOHOOKS"
          G=(git -c "core.hooksPath=$NOHOOKS")
          # Shapes the writers never produce are refused outright: renames,
          # copies, deletions, mode changes, symlinks (120000), submodules (160000).
          SUMMARY="$("${G[@]}" apply --summary "$PATCH")"
          if grep -Eq '^ (rename|copy|delete mode|mode change|create mode 1[26]0000)' <<< "$SUMMARY"; then
            echo "::error::autofix-push refused the patch: it renames, deletes, changes a mode, or adds a symlink/submodule."
            printf '%s\n' "$SUMMARY"
            exit 1
          fi
          # Every path in the patch must sit inside the PR's touched set (+ the
          # writers' baselines): the same containment the writer job checked,
          # recomputed here from trusted code on a fresh checkout.
          mapfile -d '' -t FILES < <("${G[@]}" diff -z --name-only origin/main...HEAD)
          : > "${RUNNER_TEMP}/allowed.txt"
          for f in "${FILES[@]}"; do printf '%s\n' "$f" >> "${RUNNER_TEMP}/allowed.txt"; done
          printf '%s\n' scripts/a11y-baseline.json scripts/manifest-examples-baseline.json >> "${RUNNER_TEMP}/allowed.txt"
          # Kernel writers' per-writer allowlists, recomputed here in trusted shell: a
          # touched kernel's own node shard and manifest. Root pages and every shared
          # derived artifact are never added here (those have one writer, the main
          # regen). Ids are filename stems and must match the estate id alphabet.
          for f in "${FILES[@]}"; do
            case "$f" in
              chaingraph/kernels/*.kernel.mjs)
                kid="${f#chaingraph/kernels/}"; kid="${kid%.kernel.mjs}"
                if [[ "$kid" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
                  printf '%s\n' "chaingraph/graph/nodes/${kid}.json" "manifests/${kid}.manifest.json" >> "${RUNNER_TEMP}/allowed.txt"
                fi ;;
            esac
          done
          sort -u -o "${RUNNER_TEMP}/allowed.txt" "${RUNNER_TEMP}/allowed.txt"
          : > "${RUNNER_TEMP}/patched.txt"
          mapfile -d '' -t NUMSTAT < <("${G[@]}" apply --numstat -z "$PATCH")
          for r in "${NUMSTAT[@]}"; do
            [ -n "$r" ] || continue
            printf '%s\n' "${r#*$'\t'*$'\t'}" >> "${RUNNER_TEMP}/patched.txt"
          done
          sort -u -o "${RUNNER_TEMP}/patched.txt" "${RUNNER_TEMP}/patched.txt"
          ESCAPED="$(comm -23 "${RUNNER_TEMP}/patched.txt" "${RUNNER_TEMP}/allowed.txt")"
          if [ -n "$ESCAPED" ]; then
            echo "::error::autofix-push refused the patch: it touches files outside the PR's own touched set:"
            printf '%s\n' "$ESCAPED"
            exit 1
          fi
          "${G[@]}" apply --index "$PATCH"
          echo "applied:"
          "${G[@]}" diff --cached --name-only

      - name: Mint PR push token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-contents: write

      - name: Commit and push the autofix diff
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          NOHOOKS="${RUNNER_TEMP}/nohooks"; mkdir -p "$NOHOOKS"
          git config core.hooksPath "$NOHOOKS"
          git config user.name  "ainumbers-spec-sync[bot]"
          git config user.email "ainumbers-spec-sync[bot]@users.noreply.github.com"
          # Two -m flags, not one multi-line literal: an unindented continuation
          # line inside `run: |` silently invalidates the whole workflow file
          # (measured 2026-08-16: 11 zero-job failure runs across every branch).
          git commit \
            -m "chore(autofix): apply PR derivables (#${PR_NUMBER})" \
            -m "Automated by .github/workflows/pr-autofix.yml: the per-PR derivables (manifest examples, ask-agent + a11y writer stamps, kernel identity stamp, manifest input schema, root chrome) are deterministic from this PR's own files and ride the PR branch."

          # App-authored push: a GITHUB_TOKEN-authored push would not retrigger
          # the PR's checks (the whole reason this row exists); the App's does.
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # A builder push landing between checkout and
          # this push rejects it (fetch first). Rebase the one autofix commit
          # onto the new head and retry ONCE. If the rebase conflicts or the
          # retry still loses the race, exit 0 with a notice: the builder's
          # newer push re-triggers this workflow, which recomputes the
          # derivables from the newer tree, so nothing is lost.
          if ! git push origin "HEAD:${HEAD_REF}"; then
            if git fetch origin "${HEAD_REF}" && git rebase "origin/${HEAD_REF}" && git push origin "HEAD:${HEAD_REF}"; then
              echo "autofix: push raced a newer head; rebased and pushed."
            else
              git rebase --abort 2>/dev/null || true
              echo "::notice title=Autofix superseded::The PR head moved during this run. The newer push re-runs this workflow on the newer tree."
              exit 0
            fi
          fi
          SHA="$(git rev-parse HEAD)"
          echo "autofix pushed ${SHA}, re-run pending"
          echo "### autofix pushed ${SHA}, re-run pending" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit ${SHA::7} was pushed to this PR. The App-authored push re-runs every check on the new commit. No action is needed unless those checks fail." >> "$GITHUB_STEP_SUMMARY"
          # This run used to exit 1 by design (the
          # autofix.ci pattern) to signal the fix-up push. That red cost more
          # than it said: 70 of 913 failed runs from 10-01 to 10-29 were this
          # exit, and every PR watcher spent a diagnosis on a run that had
          # succeeded. The App-authored push already re-triggers every
          # required check, so a notice carries the same signal without a red.
          echo "::notice title=Autofix pushed a fix-up commit::Commit ${SHA::7} was pushed to this PR and its checks are re-running on it."
          exit 0

  sync-main:
    name: Merge main into BEHIND/DIRTY PRs (main-owned derived conflicts only)
    # main's own code only: a workflow_dispatch from another branch would run
    # that branch's script with the App token, so it is refused here.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Up to 15 min waiting for the regen on the pushed sha, then at most 10 merges.
    timeout-minutes: 40
    permissions:
      contents: read # checkout of main; every write goes through the App token
      # Read with GITHUB_TOKEN: the App token carries only contents + pull-requests.
      actions: read # derived-artifacts-regen.yml's runs, for the regen wait
    steps:
      - name: Checkout main
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      # Fail closed: a decision function that fails its own fixtures never
      # touches a PR branch.
      - name: Decision tests
        run: node scripts/ci/pr-sync-main.test.mjs

      - name: Mint PR push token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-contents: write

      - name: Sync open PRs with main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          ACTIONS_READ_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_APPLY: ${{ inputs.apply }}
          INPUT_MAX_PRS: ${{ inputs.max_prs }}
        run: |
          set -euo pipefail
          ARGS=(--markdown)
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "schedule" ]; then
            ARGS+=(--apply --event-sha "$EVENT_SHA")
          elif [ "$INPUT_APPLY" = "true" ]; then
            ARGS+=(--apply)
          else
            ARGS+=(--dry-run)
          fi
          MAX="${INPUT_MAX_PRS:-10}"
          case "$MAX" in ''|*[!0-9]*) echo "::error::max_prs must be a whole number, got '$MAX'"; exit 1 ;; esac
          ARGS+=(--max-prs "$MAX")
          git config user.name  "ainumbers-spec-sync[bot]"
          git config user.email "ainumbers-spec-sync[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          node scripts/ci/pr-sync-main.mjs "${ARGS[@]}" | tee "${RUNNER_TEMP}/sync.md"
          { echo "### bot-sync (${EVENT_NAME})"; echo; cat "${RUNNER_TEMP}/sync.md"; } >> "$GITHUB_STEP_SUMMARY"
