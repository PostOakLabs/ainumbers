name: Deploy to DreamHost

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run preflight checks only — skip the deploy step'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ── Pre-flight checks (run before touching the server) ─────────────────────
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          fetch-depth: 1

      - name: ⬢ Setup Node (for hash + syntax gates)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: 🔐 OpenChainGraph hash + JS syntax gates
        # Hard gate (exits 1 on failure). Catches: any inline classic <script>
        # that fails to parse; forbidden hash patterns (array-replacer
        # canonicalization, fake 32-bit simpleHash); execution_hash golden-parity
        # drift; and an art-01 canonicalizer self-test. These zero-dependency
        # scripts are the regression guard for the 2026-06-18 hash remediation.
        run: |
          node chaingraph/kernels/syntax-check.mjs
          node chaingraph/kernels/lint-forbidden-hash.mjs
          node chaingraph/kernels/golden-parity.test.mjs
          node chaingraph/kernels/determinism-replay.test.mjs
          node chaingraph/kernels/vm-parity-gate.mjs --strict
          node chaingraph/kernels/empty-input-finite.test.mjs
          node scripts/check-kernel-determinism.mjs
          node chaingraph/kernels/parity-art-01.test.mjs
          node chaingraph/kernels/inline-hash-equality.test.mjs
          node chaingraph/kernels/proof-binding.test.mjs
          node chaingraph/kernels/kernel-identity.test.mjs
          node chaingraph/kernels/gen-kernel-identity.mjs --check
          node chaingraph/kernels/compute-proof.test.mjs
          node chaingraph/kernels/anchor-binding.test.mjs
          node chaingraph/exporters/sd-export-roundtrip.test.mjs
          node scripts/check-shipped-prose.mjs
          node scripts/check-copy-hallmarks.mjs
          node scripts/check-manifest-parity.mjs
          node scripts/check-manifest-schema.mjs
          node chaingraph/kernels/gen-index.mjs --check
          node scripts/check-kernel-coverage.mjs
          node scripts/check-compute-proof-coverage.mjs

      - name: 🔍 Index sync — verify all tools are on the homepage
        # Fails the build if any tool in tools/ has no card in index.html
        # (unless it's in the INTENTIONAL_OMISSIONS list in the script).
        # To suppress a false positive: add the filename to INTENTIONAL_OMISSIONS
        # in scripts/check_index_sync.py and commit that change.
        run: python scripts/check_index_sync.py --strict --no-color

      - name: Dead-link gate (CONTRACT A3.6 - no new dangling internal links)
        # Fails the build if any committed .html introduces an internal href/src
        # that does not resolve to a file on disk, vs scripts/dead-link-baseline.json
        # (known pre-existing dead links, grandfathered). To accept an intended change:
        #   node scripts/dead-link-check.mjs --update   then commit the baseline.
        run: node scripts/dead-link-check.mjs

      - name: 🔢 Count-drift gate (SPEC §count-drift-prevention)
        # Fails if any published count sentinel is stale vs the filesystem SSOT.
        # Every published number (browser tools, mcp.live, openapi.ops, etc.) has a
        # sentinel marker (<!--COUNT:key-->N<!--/COUNT--> or data-count="key") that
        # this script checks. Fix: node scripts/verify-counts.mjs --fix + commit.
        # Never hardcode a count to make this pass — fix the sentinel or the source.
        run: node scripts/verify-counts.mjs --check

      - name: ⬡ Hub freshness gate — chaingraph-hub.html grid == chaingraph.json
        # The hub's CHAIN_INDEX grid (and its runtime-derived hero stat) is generated
        # by gen-chain-index.mjs. If a chain is added to chaingraph.json but the hub
        # isn't regenerated, the showcase silently drifts (sync-stats only checks the
        # hero stat vs its OWN card grid — internal consistency, not freshness).
        # This is how the hub drifted to a stale count behind a chain build.
        # Fix: node scripts/gen-chain-index.mjs  (re-embeds grid + hero counts), commit.
        run: node scripts/gen-chain-index.mjs --check

      - name: 📐 OpenChainGraph SSOT conformance gates (v0.4)
        # Conformance-by-construction (standard/SPEC.md §15). Enforces the SSOT at PR time:
        #   schema-validate          — chaingraph.json nodes/chains + fixtures validate against the
        #                              v0.4 JSON Schema (strict: additionalProperties:false on envelope+node).
        #   spec-version-consistency — one version-of-record across SPEC.md frontmatter, schema,
        #                              spec page <meta>, hub <meta> (the v0.1/v0.3.1/v0.4 skew guard).
        #   spec-gate-coverage       — every §15 normative rule names a real gate; worker-repo gates
        #                              (hash-sweep, smoke-mcp, …) are verified in the worker's own CI.
        # All zero-dependency, exit 1 on failure. Canonical home: repo/chaingraph/standard/.
        run: |
          node chaingraph/standard/schema-validate.mjs
          node chaingraph/standard/spec-version-consistency.mjs
          node chaingraph/standard/spec-gate-coverage.mjs
          node chaingraph/standard/spec-page-parity.mjs
          node chaingraph/standard/spec-page-subsection-parity.mjs

      - name: 🧩 Catalog-parity gate (§15 — no orphan chain pages)
        # catalog-parity.mjs (SPEC.md §15: "every node url page + chain page exists, no
        # orphans") was a gate FILE on disk since Addendum A but was never invoked from CI
        # or preflight — spec-gate-coverage.mjs only checks the file exists, not that it
        # runs (audit finding 2026-07-09). This wrapper wires it in with a baseline shield
        # (scripts/catalog-parity-baseline.json) for the 17 pre-existing orphan chain pages
        # found on first real run, same pattern as check-copy-hallmarks.mjs: any NEW orphan
        # fails immediately, legacy debt burns down via --update as pages are triaged.
        run: node scripts/check-catalog-parity.mjs

      - name: 📋 Tool count summary
        run: |
          TOOL_COUNT=$(ls tools/*.html 2>/dev/null | wc -l)
          GUIDE_COUNT=$(ls guides/*.html 2>/dev/null | wc -l)
          MANIFEST_COUNT=$(ls manifests/*.manifest.json 2>/dev/null | wc -l)
          echo "🔢 Tools: $TOOL_COUNT | Guides: $GUIDE_COUNT | Manifests: $MANIFEST_COUNT"

      - name: 🔒 Line-ending guard — confirm no CRLF in committed HTML/JSON
        # Catches accidental CRLF commits that cause phantom diffs on re-push.
        # .gitattributes enforces LF, but this step gives a visible CI signal
        # if a file slips through (e.g. committed before .gitattributes existed).
        run: |
          BAD=$(git ls-files '*.html' '*.json' '*.yml' '*.js' '*.css' \
                | xargs grep -rlP '\r' 2>/dev/null || true)
          if [ -n "$BAD" ]; then
            echo "⚠️  CRLF line endings detected in:"
            echo "$BAD"
            echo ""
            echo "Run: git add --renormalize . && git commit -m 'chore: normalise line endings'"
            echo "(This is a warning — deploy will still proceed)"
          else
            echo "✅ All text files use LF line endings"
          fi

      - name: 🗂 Manifest parity check — warn if manifest count exceeds tool count
        # Orphaned .manifest.json files (no matching tool HTML) inflate the count
        # and indicate a cleanup is needed. Emits a warning but does not fail the build.
        run: |
          TOOLS=$(ls tools/*.html 2>/dev/null | wc -l)
          MFSTS=$(ls manifests/*.manifest.json 2>/dev/null | wc -l)
          echo "📦 Tools: $TOOLS | Manifests: $MFSTS"
          if [ "$MFSTS" -gt "$TOOLS" ]; then
            ORPHANS=$((MFSTS - TOOLS))
            echo "⚠️  $ORPHANS orphaned manifest(s) detected — manifests/ has more files than tools/"
            echo "   Run: diff <(ls manifests/*.manifest.json | sed 's|manifests/||;s|\.manifest\.json||') \\"
            echo "            <(ls tools/*.html | sed 's|tools/||;s|\.html||') | grep '^<'"
            echo "   to identify which manifests have no matching tool."
            echo "(This is a warning — deploy will still proceed)"
          else
            echo "✅ Manifest count is within bounds"
          fi

      - name: 🛡 verify_repo.py — PII text, manifest coverage, AP2 consistency, sitemap coverage
        # Hard gate: exits 1 on any failure, blocking deploy.
        # Checks: (1) pii-notice divs carry canonical §1.3 text,
        #         (2) every tools/*.html has a .manifest.json,
        #         (3) ap2_export:true manifests have id="ap2ExportBtn" in HTML,
        #         (4) every tool + guide appears in sitemap.xml.
        run: python scripts/verify_repo.py

      - name: 📦 mfstSec presence check — every tool must include the manifest panel
        # Fails the build if any tool in tools/ is missing the mfstSec section.
        # This ensures every tool exposes its AP2 manifest.json to end users.
        # To intentionally exclude a tool, add it to the OMIT list below.
        run: |
          OMIT=""  # space-separated filenames to skip, e.g. "tools/foo.html tools/bar.html"
          MISSING=""
          for f in tools/*.html; do
            # Skip intentionally omitted files
            if echo "$OMIT" | grep -qw "$f"; then continue; fi
            if ! grep -q "mfstSec" "$f"; then
              MISSING="$MISSING\n  $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "❌ The following tools are missing the mfstSec manifest panel:"
            printf "$MISSING\n"
            echo ""
            echo "Add the standard <section id=\"mfstSec\"> block before </footer> in each file."
            exit 1
          else
            echo "✅ All tools contain the mfstSec manifest panel"
          fi

  # ── Deploy (only runs if preflight passes and dry_run is not set) ─────────
  deploy:
    name: Deploy to DreamHost
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: preflight
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          fetch-depth: 1

      - name: 🔐 Setup SSH Key & Host
        run: |
          mkdir -p ~/.ssh
          # Strip Windows line endings from the key before writing
          echo "${{ secrets.DH_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DH_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

          # Verification (safe — does not expose key content)
          echo "Key header : $(head -1 ~/.ssh/deploy_key)"
          echo "Key footer : $(tail -1 ~/.ssh/deploy_key)"
          echo "Permissions: $(stat -c %a ~/.ssh/deploy_key)"

      - name: 🔌 Test SSH connection to DreamHost
        # Hard-fail early if the key is wrong — prevents rsync from running
        # with --delete against an unreachable or misidentified target.
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            ${{ secrets.DH_SSH_USER }}@${{ secrets.DH_SSH_HOST }} "echo '✅ SSH connection confirmed'"

      - name: 🔍 Dry-run rsync (shows what will change — no writes)
        # Two narrow carve-outs before the blanket .md exclude below: chaingraph/okf/
        # is the CI-freshness-gated (generate-okf.mjs --check) machine-knowledge bundle,
        # and chaingraph/standard/SPEC.md is the publicly-linked SSOT doc — both are
        # meant to be live, unlike CONTRACT.md/CLAUDE.md/other internal build docs.
        run: |
          rsync -avz --delete --dry-run --omit-dir-times \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitattributes' \
            --exclude='scripts/' \
            --include='chaingraph/okf/**' \
            --include='chaingraph/standard/SPEC.md' \
            --exclude='*.md' \
            --exclude='specs/' \
            --exclude='CONTRACT.md' \
            --exclude='CLAUDE.md' \
            --exclude='.gitignore' \
            --exclude='.env*' \
            --exclude='node_modules/' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='reconciled/' \
            --exclude='CANONICAL_TOOL_EXAMPLE.html' \
            --exclude='docs/' \
            ./ ${{ secrets.DH_SSH_USER }}@${{ secrets.DH_SSH_HOST }}:${{ secrets.DH_WEB_ROOT }}/

      - name: 🚀 Sync to DreamHost via rsync
        # Keep these --include/--exclude flags identical to the dry-run rsync above.
        run: |
          rsync -avz --delete --omit-dir-times \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitattributes' \
            --exclude='scripts/' \
            --include='chaingraph/okf/**' \
            --include='chaingraph/standard/SPEC.md' \
            --exclude='*.md' \
            --exclude='specs/' \
            --exclude='CONTRACT.md' \
            --exclude='CLAUDE.md' \
            --exclude='.gitignore' \
            --exclude='.env*' \
            --exclude='node_modules/' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='reconciled/' \
            --exclude='CANONICAL_TOOL_EXAMPLE.html' \
            --exclude='docs/' \
            ./ ${{ secrets.DH_SSH_USER }}@${{ secrets.DH_SSH_HOST }}:${{ secrets.DH_WEB_ROOT }}/

          echo "✅ rsync completed successfully."

      - name: ☁️ Purge Cloudflare cache
        # ainumbers.co is fronted by Cloudflare. Static assets (.jsonld profiles + contexts,
        # chaingraph.json, spec/guide HTML, tool exports) are edge-cached and otherwise serve
        # STALE until TTL expiry — e.g. a freshly deployed profile URL returns the old cached
        # 404/empty. Purge the zone after a successful rsync so fresh content is visible at once.
        #
        # Requires two repo secrets (GitHub → Settings → Secrets → Actions):
        #   CF_ZONE_ID    — the ainumbers.co zone ID (Cloudflare dashboard → Overview → API → Zone ID)
        #   CF_API_TOKEN  — a scoped API token with permission: Zone → Cache Purge → Purge
        # Uses purge_everything (works on all Cloudflare plans; prefix/tag purge is Enterprise-only).
        # Skips gracefully if the secrets are not set, so it never blocks an otherwise-good deploy.
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "ℹ️  CF_ZONE_ID / CF_API_TOKEN not set — skipping Cloudflare purge."
            echo "   Add them in GitHub → Settings → Secrets → Actions (token scope: Zone → Cache Purge → Purge)."
            exit 0
          fi
          RESP=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$RESP"
          if echo "$RESP" | grep -q '"success":true'; then
            echo "✅ Cloudflare cache purged — fresh content live"
          else
            echo "❌ Cloudflare purge failed (see response above). Files deployed OK; cache will clear on TTL."
            exit 1
          fi

      - name: 🌐 Smoke test — homepage responds
        # A lightweight check that the site root returns HTTP 200 after deploy.
        # Set DH_SITE_URL secret to your domain, e.g. https://ainumbers.co
        run: |
          if [ -z "${{ secrets.DH_SITE_URL }}" ]; then
            echo "ℹ️  DH_SITE_URL secret not set — skipping smoke test"
            echo "   Add it in GitHub → Settings → Secrets → Actions"
            exit 0
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 "${{ secrets.DH_SITE_URL }}")
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
            echo "✅ Site responded with HTTP $HTTP_CODE"
          else
            echo "❌ Site returned HTTP $HTTP_CODE — deploy may have failed"
            exit 1
          fi

      - name: 📊 Deploy summary
        run: |
          TOOL_COUNT=$(ls tools/*.html 2>/dev/null | wc -l)
          GUIDE_COUNT=$(ls guides/*.html 2>/dev/null | wc -l)
          echo "## Deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------:|" >> $GITHUB_STEP_SUMMARY
          echo "| Tools deployed | $TOOL_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Guides deployed | $GUIDE_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
