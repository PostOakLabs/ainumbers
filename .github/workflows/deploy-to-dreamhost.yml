name: Deploy to DreamHost

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run preflight checks only — skip the deploy step'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ── Pre-flight checks (run before touching the server) ─────────────────────
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: ⬢ Setup Node (for hash + syntax gates)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: 🪖 Detect helm-relevant changes
        # The helm drift/guide-freshness gates below assert helm.html against
        # helm/version.json + helm/guide-freshness.json — state that goes stale
        # on a schedule set by the SEPARATE ainumbers-helm repo's release job,
        # not by anything in a given site push. Blocking every push on that
        # staleness caused a --no-verify bypass once already and blocked #766.
        # Scope the gates to pushes that actually touch helm-relevant paths —
        # the release job's own push to helm/version.json IS such a push, so
        # the gate still fires exactly where drift can originate; a push
        # touching only tools/guides/kernels never trips it. fetch-depth:1
        # above means the pre-push parent commit isn't checked out — fetch just
        # that one commit to diff against. Undeterminable (new branch, dispatch
        # run, fetch failure) fails OPEN — gates still run — this narrows blast
        # radius, it never weakens what the gate itself checks.
        id: helmscope
        env:
          # Event values cross via env:, never `${{ }}` inside the run: body.
          # These three are SHAs and a trigger name, so nothing here is
          # attacker-shapeable today; the point is that no expansion is spliced
          # into the script text, so the property holds by construction rather
          # than by each value happening to be benign.
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          BEFORE="$EVENT_BEFORE"
          ZERO="0000000000000000000000000000000000000000"
          CHANGED="undeterminable"
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null || true
            if git cat-file -e "$BEFORE" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$BEFORE" "$EVENT_SHA" -- helm.html helm/ scripts/check-helm-version-drift.mjs scripts/gen-helm-guide-freshness.mjs)
            fi
          fi
          if [ -n "$CHANGED" ]; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "Helm-relevant change detected (or undeterminable — failing open): '$CHANGED'"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "No helm-relevant paths changed in this push — helm gates skipped."
          fi

      - name: 🔐 OpenChainGraph hash + JS syntax gates
        # The Property-testing floor line below scopes to the
        # kernels this push touches, reusing the $BEFORE commit the 🪖 helm-scope step
        # above already fetched (git fetch --depth=1 origin "$BEFORE", unconditional for
        # push events) — no second fetch needed. Falls back to a full run when BEFORE is
        # unresolvable or a shared kernel helper (chaingraph/kernels/_*.mjs) is touched.
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        # Hard gate (exits 1 on failure). Catches: any inline classic <script>
        # that fails to parse; forbidden hash patterns (array-replacer
        # canonicalization, fake 32-bit simpleHash); execution_hash golden-parity
        # drift; and an art-01 canonicalizer self-test. These zero-dependency
        # scripts are the regression guard for the 2026-06-18 hash remediation.
        run: |
          node chaingraph/kernels/syntax-check.mjs
          node chaingraph/kernels/lint-forbidden-hash.mjs
          node chaingraph/kernels/golden-parity.test.mjs
          node chaingraph/kernels/determinism-replay.test.mjs
          node chaingraph/kernels/vm-parity-gate.mjs --strict
          node chaingraph/kernels/empty-input-finite.test.mjs
          node scripts/check-kernel-determinism.mjs
          node chaingraph/kernels/parity-art-01.test.mjs
          node chaingraph/kernels/inline-hash-equality.test.mjs
          node scripts/check-canon-order.mjs
          node scripts/check-dag-idents.mjs
          node chaingraph/kernels/proof-binding.test.mjs
          node chaingraph/kernels/policy-params-hash.test.mjs
          node chaingraph/kernels/kernel-identity.test.mjs
          node chaingraph/kernels/gen-kernel-identity.mjs --check
          node chaingraph/kernels/gen-kernel-identity.mjs --check --shard
          node chaingraph/kernels/compute-proof.test.mjs
          ZERO="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "push" ] && [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "$ZERO" ] && git cat-file -e "$EVENT_BEFORE" 2>/dev/null; then
            node scripts/run-proptests.mjs --base "$EVENT_BEFORE" --head "$GITHUB_SHA"
          else
            node scripts/run-proptests.mjs
          fi
          node scripts/check-fv-floor-coverage.mjs
          node scripts/check-fv-floor-coverage.test.mjs
          node chaingraph/kernels/anchor-binding.test.mjs
          node chaingraph/exporters/sd-export-roundtrip.test.mjs
          node scripts/check-shipped-prose.mjs
          node scripts/check-copy-hallmarks.mjs
          node scripts/check-credits-coverage.mjs repo
          node scripts/gen-credits.mjs repo --check
          node scripts/check-manifest-parity.mjs
          node scripts/check-manifest-schema.mjs
          node chaingraph/kernels/gen-index.mjs --check
          node scripts/check-kernel-coverage.mjs
          node scripts/check-compute-proof-coverage.mjs
          node scripts/check-s18-digest-freshness.mjs
          node scripts/check-s18-digest-freshness.test.mjs
          node scripts/check-recompute-equality.mjs
          node scripts/check-recompute-equality.test.mjs
          node scripts/check-proof-badge.mjs
          node scripts/check-template-integrity.mjs
          node scripts/check-verify-no-egress.mjs

      - name: 🔍 Index sync — verify all tools are on the homepage
        # Fails the build if any tool in tools/ has no card in index.html
        # (unless it's in the INTENTIONAL_OMISSIONS list in the script).
        # To suppress a false positive: add the filename to INTENTIONAL_OMISSIONS
        # in scripts/check_index_sync.py and commit that change.
        run: python scripts/check_index_sync.py --strict --no-color

      - name: 🧩 chaingraph.json shard freshness (CGSHARD-1 CS-1)
        # chaingraph.json is now GENERATED from chaingraph/graph/nodes/*.json +
        # chaingraph/graph/chains/*.json + chaingraph.meta.json. Fails if the
        # committed chaingraph.json doesn't match what the shards assemble to.
        # Fix: node scripts/assemble-chaingraph.mjs (regenerates), then commit.
        run: node scripts/assemble-chaingraph.mjs --check

      - name: Dead-link gate (CONTRACT A3.6 - no new dangling internal links)
        # Fails the build if any committed .html introduces an internal href/src
        # that does not resolve to a file on disk, vs scripts/dead-link-baseline.json
        # (known pre-existing dead links, grandfathered). To accept an intended change:
        #   node scripts/dead-link-check.mjs --update   then commit the baseline.
        run: node scripts/dead-link-check.mjs

      - name: 🧭 Nav reachability gate (NAV-ISLAND-1 - no new island pages)
        # Fails if any committed .html is reachable by no on-site nav path (only via
        # sitemap.xml / a direct URL), vs scripts/nav-island-baseline.json. Redirect
        # shims (meta-refresh / robots noindex) are auto-exempt; chaingraph.json
        # entries count as dynamically reachable. To accept a by-design island:
        #   node scripts/check-nav-reachability.mjs --update   then commit the baseline.
        run: node scripts/check-nav-reachability.mjs

      - name: 🔢 Count-drift gate (SPEC §count-drift-prevention)
        # Fails if any published count sentinel is stale vs the filesystem SSOT.
        # Every published number (browser tools, mcp.live, openapi.ops, etc.) has a
        # sentinel marker (<!--COUNT:key-->N<!--/COUNT--> or data-count="key") that
        # this script checks. Fix: node scripts/verify-counts.mjs --fix + commit.
        # Never hardcode a count to make this pass — fix the sentinel or the source.
        run: node scripts/verify-counts.mjs --check

      - name: 🔢 MCP protocol-version drift gate
        # Fails if any of the four published MCP protocol-version strings (docs/index.html,
        # docs/openapi.json, guides/mcp-clone-guide.html, mcp-playground.html) drifts from
        # data/mcp-protocol-version.json's negotiated_protocol_version. On a real protocol
        # bump, re-verify live and update ONLY that one JSON file, then --fix the sites.
        run: node scripts/verify-mcp-protocol-version.mjs

      - name: 📅 Deadline-wall freshness gate
        # Fails if any data/reg-deadlines.json entry's own verified_on stamp is
        # past the named staleness threshold. Derives staleness from the entry
        # itself — no hand-maintained re-verify ledger. Fix: re-check the entry
        # against its source_url and update verified_on.
        run: node scripts/check-deadline-freshness.mjs

      - name: 📅 Bank dated-fact freshness gate
        # Fails if a data/bank-fact-freshness.json entry's own verified_on stamp
        # is past the named staleness threshold. Same derive-from-the-entry
        # pattern as the deadline-wall gate above — no hand-maintained
        # re-verify ledger.
        run: node scripts/check-bank-fact-freshness.mjs

      - name: 🔢 Tool-number uniqueness gate (TOOLNUM-FIX-1)
        # Fails if two tools/*.html share a leading NNN- number. tool-page numbers
        # are a global monotonic sequence hand-derived per build; two sessions
        # landing in the same window can each self-derive the same number (the
        # TOOLNUM-FIX-1 incident: DATAROOM-1 and FA-4 both shipped "546"). The
        # count-drift gate above only counts files, so a collision still passes it.
        run: node scripts/check-tool-number-unique.mjs

      - name: ⬡ Hub freshness gate — chaingraph-hub.html grid == chaingraph.json
        # The hub's CHAIN_INDEX grid (and its runtime-derived hero stat) is generated
        # by gen-chain-index.mjs. If a chain is added to chaingraph.json but the hub
        # isn't regenerated, the showcase silently drifts (sync-stats only checks the
        # hero stat vs its OWN card grid — internal consistency, not freshness).
        # This is how the hub drifted to a stale count behind a chain build.
        # Fix: node scripts/gen-chain-index.mjs  (re-embeds grid + hero counts), commit.
        run: node scripts/gen-chain-index.mjs --check

      - name: 🧊 Generated-surface freshness gates (workbench/canvas/start-index/root-chrome/llms/sitemap-html/openapi)
        # These surfaces are baked at build time from chaingraph.json/tools/guides (CONTRACT §0.4
        # zero-network-calls). Their --check gates ran only in preflight.mjs (local, skippable) and
        # scripts-verify.yml (path-filtered to scripts/**), so a chaingraph.json-only push could ship
        # without regenerating them, leaving workbench/canvas/etc. silently stale. Fix any failure:
        # run the matching gen-*.mjs (no --check) then commit.
        run: |
          node scripts/gen-workbench.mjs --check
          node scripts/gen-canvas.mjs --check
          node scripts/gen-start-index.mjs --check
          node scripts/gen-root-chrome.mjs --check
          node scripts/gen-llms-full.mjs --check
          node scripts/gen-estate-map.mjs --check
          node scripts/gen-sitemap-html.mjs --check
          node scripts/gen-openapi.mjs --check

      - name: 📐 OpenChainGraph SSOT conformance gates (v0.4)
        # Conformance-by-construction (standard/SPEC.md §15). Enforces the SSOT at PR time:
        #   schema-validate          — chaingraph.json nodes/chains + fixtures validate against the
        #                              v0.4 JSON Schema (strict: additionalProperties:false on envelope+node).
        #   spec-version-consistency — one version-of-record across SPEC.md frontmatter, schema,
        #                              spec page <meta>, hub <meta> (the v0.1/v0.3.1/v0.4 skew guard).
        #   spec-gate-coverage       — every §15 normative rule names a real gate; worker-repo gates
        #                              (hash-sweep, smoke-mcp, …) are verified in the worker's own CI.
        # All zero-dependency, exit 1 on failure. Canonical home: repo/chaingraph/standard/.
        run: |
          node chaingraph/standard/schema-validate.mjs
          node chaingraph/standard/spec-version-consistency.mjs
          node chaingraph/standard/spec-gate-coverage.mjs
          node chaingraph/standard/spec-page-parity.mjs
          node chaingraph/standard/spec-page-subsection-parity.mjs

      - name: 🪖 Helm technical design page parity
        # helm-technical-design.html renders a document whose source of truth lives in the
        # helm repository. A pinned copy is vendored under helm/technical-design/ so this
        # check is local and deterministic: site CI cannot see helm's HEAD, and a page that
        # fetched the markdown at load time would stop working the moment that host did.
        # Checks structure (sections, TOC, subheadings) plus the vendored pin, and warns
        # without failing when the pin is behind upstream. The .test.mjs proves it goes red.
        #
        # Deliberately NOT gated on steps.helmscope.outputs.touched. That scoping exists
        # for the version-drift gate below, which asserts against state the separate helm
        # repo's release job sets. This gate compares only files in this repo against each
        # other, and the helmscope path filter does not match helm-technical-design.html,
        # so scoping it here would silently ungate the page it exists to protect.
        run: |
          node scripts/check-helm-techdoc-parity.mjs
          node scripts/check-helm-techdoc-parity.test.mjs

      - name: 🪖 Helm release/version drift gate (HELM-RELEASE-DRIFT-GATES-1)
        # helm.html's release download/tag links must match helm/version.json's
        # latest_version — the pinned feed the helm repo's own release job pushes to this
        # repo's main on every GA tag (no live GitHub API call needed here). Proven by a
        # committed tamper fixture (.test.mjs). Path-scoped — see "Detect helm-relevant
        # changes" above. Machine-satisfiable, never blocks on a human duty — unlike the
        # guide-freshness check, which is a human "does the walkthrough visibly
        # differ" judgment and moved to a non-blocking scheduled report
        # (.github/workflows/helm-guide-freshness-schedule.yml) so a byte-identical
        # repair release can never again hold up an unrelated site deploy.
        if: steps.helmscope.outputs.touched == 'true'
        run: |
          node scripts/check-helm-version-drift.mjs
          node scripts/check-helm-version-drift.test.mjs

      - name: 🪖 Helm gate skipped (no helm-relevant paths changed)
        if: steps.helmscope.outputs.touched != 'true'
        run: echo "This push touched no helm-relevant path (helm.html, helm/, or the helm gate scripts) — the helm release/version drift gate is skipped. (Guide freshness runs separately, on a schedule.)"

      - name: 🧩 Catalog-parity gate (§15 — no orphan chain pages)
        # catalog-parity.mjs (SPEC.md §15: "every node url page + chain page exists, no
        # orphans") was a gate FILE on disk since Addendum A but was never invoked from CI
        # or preflight — spec-gate-coverage.mjs only checks the file exists, not that it
        # runs (audit finding 2026-07-09). This wrapper wires it in with a baseline shield
        # (scripts/catalog-parity-baseline.json) for the 17 pre-existing orphan chain pages
        # found on first real run, same pattern as check-copy-hallmarks.mjs: any NEW orphan
        # fails immediately, legacy debt burns down via --update as pages are triaged.
        run: node scripts/check-catalog-parity.mjs

      - name: 📋 Tool count summary
        run: |
          TOOL_COUNT=$(ls tools/*.html 2>/dev/null | wc -l)
          GUIDE_COUNT=$(ls guides/*.html 2>/dev/null | wc -l)
          MANIFEST_COUNT=$(ls manifests/*.manifest.json 2>/dev/null | wc -l)
          echo "🔢 Tools: $TOOL_COUNT | Guides: $GUIDE_COUNT | Manifests: $MANIFEST_COUNT"

      - name: 🔒 Line-ending guard — confirm no CRLF in committed HTML/JSON
        # Catches accidental CRLF commits that cause phantom diffs on re-push.
        # .gitattributes enforces LF, but this step gives a visible CI signal
        # if a file slips through (e.g. committed before .gitattributes existed).
        run: |
          BAD=$(git ls-files '*.html' '*.json' '*.yml' '*.js' '*.css' \
                | xargs grep -rlP '\r' 2>/dev/null || true)
          if [ -n "$BAD" ]; then
            echo "⚠️  CRLF line endings detected in:"
            echo "$BAD"
            echo ""
            echo "Run: git add --renormalize . && git commit -m 'chore: normalise line endings'"
            echo "(This is a warning — deploy will still proceed)"
          else
            echo "✅ All text files use LF line endings"
          fi

      - name: 🗂 Manifest parity check — warn if manifest count exceeds tool count
        # Orphaned .manifest.json files (no matching tool HTML) inflate the count
        # and indicate a cleanup is needed. Emits a warning but does not fail the build.
        run: |
          TOOLS=$(ls tools/*.html 2>/dev/null | wc -l)
          MFSTS=$(ls manifests/*.manifest.json 2>/dev/null | wc -l)
          echo "📦 Tools: $TOOLS | Manifests: $MFSTS"
          if [ "$MFSTS" -gt "$TOOLS" ]; then
            ORPHANS=$((MFSTS - TOOLS))
            echo "⚠️  $ORPHANS orphaned manifest(s) detected — manifests/ has more files than tools/"
            echo "   Run: diff <(ls manifests/*.manifest.json | sed 's|manifests/||;s|\.manifest\.json||') \\"
            echo "            <(ls tools/*.html | sed 's|tools/||;s|\.html||') | grep '^<'"
            echo "   to identify which manifests have no matching tool."
            echo "(This is a warning — deploy will still proceed)"
          else
            echo "✅ Manifest count is within bounds"
          fi

      - name: 🛡 verify_repo.py — PII text, manifest coverage, AP2 consistency, sitemap coverage
        # Hard gate: exits 1 on any failure, blocking deploy.
        # Checks: (1) pii-notice divs carry canonical §1.3 text,
        #         (2) every tools/*.html has a .manifest.json,
        #         (3) ap2_export:true manifests have id="ap2ExportBtn" in HTML,
        #         (4) every tool + guide appears in sitemap.xml.
        run: python scripts/verify_repo.py

      - name: 📦 mfstSec presence check — every tool must include the manifest panel
        # Fails the build if any tool in tools/ is missing the mfstSec section.
        # This ensures every tool exposes its AP2 manifest.json to end users.
        # To intentionally exclude a tool, add it to the OMIT list below.
        run: |
          OMIT=""  # space-separated filenames to skip, e.g. "tools/foo.html tools/bar.html"
          MISSING=""
          for f in tools/*.html; do
            # Skip intentionally omitted files
            if echo "$OMIT" | grep -qw "$f"; then continue; fi
            if ! grep -q "mfstSec" "$f"; then
              MISSING="$MISSING\n  $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "❌ The following tools are missing the mfstSec manifest panel:"
            printf "$MISSING\n"
            echo ""
            echo "Add the standard <section id=\"mfstSec\"> block before </footer> in each file."
            exit 1
          else
            echo "✅ All tools contain the mfstSec manifest panel"
          fi

  # ── Deploy (only runs if preflight passes and dry_run is not set) ─────────
  deploy:
    name: Deploy to DreamHost
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: preflight
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🔐 Setup SSH Key & Host
        env:
          # Secrets cross via env:, never `${{ }}` inside the run: body.
          # These are repo secrets, NOT attacker-controlled input, so this is
          # not the fork-PR RCE shape. Two real exposures remain and are what
          # this change closes:
          #   (1) an expansion is spliced into the script TEXT, so the value
          #       becomes part of the program the runner writes to disk and
          #       passes to the shell;
          #   (2) a value containing shell metacharacters — a quote, a
          #       backtick, `$(` — would break or re-shape the command. A PEM
          #       key is base64 and will not contain them today, so this is
          #       robustness and defence in depth, not a live incident.
          DH_SSH_KEY: ${{ secrets.DH_SSH_KEY }}
          DH_SSH_HOST: ${{ secrets.DH_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          # Strip Windows line endings from the key before writing.
          # printf '%s\n' rather than echo: the key is multi-line, and echo's
          # backslash handling is shell-dependent while printf '%s' is not.
          # Output is byte-identical for a well-formed PEM.
          printf '%s\n' "$DH_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DH_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Verification (safe — does not expose key content)
          echo "Key header : $(head -1 ~/.ssh/deploy_key)"
          echo "Key footer : $(tail -1 ~/.ssh/deploy_key)"
          echo "Permissions: $(stat -c %a ~/.ssh/deploy_key)"

      - name: 🔌 Test SSH connection to DreamHost
        # Hard-fail early if the key is wrong — prevents rsync from running
        # with --delete against an unreachable or misidentified target.
        env:
          DH_SSH_USER: ${{ secrets.DH_SSH_USER }}
          DH_SSH_HOST: ${{ secrets.DH_SSH_HOST }}
        run: |
          # Quoted as ONE argument. The previous form was unquoted, so a value
          # containing whitespace or a glob character would have word-split
          # into several arguments; for the current values the resulting argv
          # is identical.
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "$DH_SSH_USER@$DH_SSH_HOST" "echo '✅ SSH connection confirmed'"

      - name: 🪪 Write deploy stamp (DEPLOYDRIFT-1)
        # Written HERE, at rsync time, from the commit actually being deployed —
        # never at preflight — so it attests what really shipped, not what merely
        # passed checks. scripts/check-deploy-drift.mjs compares this against
        # origin/main's HEAD to detect a deploy that silently failed to fire.
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          mkdir -p .well-known
          printf '{"sha":"%s","deployed_at":"%s"}\n' \
            "$DEPLOY_SHA" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > .well-known/deploy-stamp.json
          cat .well-known/deploy-stamp.json

      - name: 🔍 Dry-run rsync (shows what will change — no writes)
        # Two narrow carve-outs before the blanket .md exclude below: chaingraph/okf/
        # is the CI-freshness-gated (generate-okf.mjs --check) machine-knowledge bundle,
        # and chaingraph/standard/SPEC.md is the publicly-linked SSOT doc — both are
        # meant to be live, unlike CONTRACT.md/CLAUDE.md/other internal build docs.
        env:
          DH_SSH_USER: ${{ secrets.DH_SSH_USER }}
          DH_SSH_HOST: ${{ secrets.DH_SSH_HOST }}
          DH_WEB_ROOT: ${{ secrets.DH_WEB_ROOT }}
        run: |
          rsync -avz --delete --dry-run --omit-dir-times \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitattributes' \
            --exclude='scripts/' \
            --include='chaingraph/okf/**' \
            --include='chaingraph/standard/SPEC.md' \
            --exclude='*.md' \
            --exclude='specs/' \
            --exclude='CONTRACT.md' \
            --exclude='CLAUDE.md' \
            --exclude='.gitignore' \
            --exclude='.env*' \
            --exclude='node_modules/' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='reconciled/' \
            --exclude='CANONICAL_TOOL_EXAMPLE.html' \
            --exclude='docs/' \
            ./ "$DH_SSH_USER@$DH_SSH_HOST:$DH_WEB_ROOT/"

      - name: 🚀 Sync to DreamHost via rsync
        # Keep these --include/--exclude flags identical to the dry-run rsync above.
        env:
          DH_SSH_USER: ${{ secrets.DH_SSH_USER }}
          DH_SSH_HOST: ${{ secrets.DH_SSH_HOST }}
          DH_WEB_ROOT: ${{ secrets.DH_WEB_ROOT }}
        run: |
          rsync -avz --delete --omit-dir-times \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitattributes' \
            --exclude='scripts/' \
            --include='chaingraph/okf/**' \
            --include='chaingraph/standard/SPEC.md' \
            --exclude='*.md' \
            --exclude='specs/' \
            --exclude='CONTRACT.md' \
            --exclude='CLAUDE.md' \
            --exclude='.gitignore' \
            --exclude='.env*' \
            --exclude='node_modules/' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='reconciled/' \
            --exclude='CANONICAL_TOOL_EXAMPLE.html' \
            --exclude='docs/' \
            ./ "$DH_SSH_USER@$DH_SSH_HOST:$DH_WEB_ROOT/"

          echo "✅ rsync completed successfully."

      - name: ☁️ Purge Cloudflare cache
        # ainumbers.co is fronted by Cloudflare. Static assets (.jsonld profiles + contexts,
        # chaingraph.json, spec/guide HTML, tool exports) are edge-cached and otherwise serve
        # STALE until TTL expiry — e.g. a freshly deployed profile URL returns the old cached
        # 404/empty. Purge the zone after a successful rsync so fresh content is visible at once.
        #
        # Requires two repo secrets (GitHub → Settings → Secrets → Actions):
        #   CF_ZONE_ID    — the ainumbers.co zone ID (Cloudflare dashboard → Overview → API → Zone ID)
        #   CF_API_TOKEN  — a scoped API token with permission: Zone → Cache Purge → Purge
        # Uses purge_everything (works on all Cloudflare plans; prefix/tag purge is Enterprise-only).
        # Skips gracefully if the secrets are not set, so it never blocks an otherwise-good deploy.
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "ℹ️  CF_ZONE_ID / CF_API_TOKEN not set — skipping Cloudflare purge."
            echo "   Add them in GitHub → Settings → Secrets → Actions (token scope: Zone → Cache Purge → Purge)."
            exit 0
          fi
          RESP=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$RESP"
          if echo "$RESP" | grep -q '"success":true'; then
            echo "✅ Cloudflare cache purged — fresh content live"
          else
            echo "❌ Cloudflare purge failed (see response above). Files deployed OK; cache will clear on TTL."
            exit 1
          fi

      - name: 🌐 Smoke test — homepage responds
        # A lightweight check that the site root returns HTTP 200 after deploy.
        # Set DH_SITE_URL secret to your domain, e.g. https://ainumbers.co
        env:
          DH_SITE_URL: ${{ secrets.DH_SITE_URL }}
        run: |
          if [ -z "$DH_SITE_URL" ]; then
            echo "ℹ️  DH_SITE_URL secret not set — skipping smoke test"
            echo "   Add it in GitHub → Settings → Secrets → Actions"
            exit 0
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 "$DH_SITE_URL")
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
            echo "✅ Site responded with HTTP $HTTP_CODE"
          else
            echo "❌ Site returned HTTP $HTTP_CODE — deploy may have failed"
            exit 1
          fi

      - name: 📊 Deploy summary
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          TOOL_COUNT=$(ls tools/*.html 2>/dev/null | wc -l)
          GUIDE_COUNT=$(ls guides/*.html 2>/dev/null | wc -l)
          echo "## Deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------:|" >> $GITHUB_STEP_SUMMARY
          echo "| Tools deployed | $TOOL_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Guides deployed | $GUIDE_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`$DEPLOY_SHA\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`$DEPLOY_BRANCH\` |" >> $GITHUB_STEP_SUMMARY
