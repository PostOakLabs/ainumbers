name: Deploy drift check

# DEPLOYDRIFT-1: catches a deploy-to-dreamhost.yml push-trigger that silently
# does not fire (measured incident: ASSEMBLE-LAND-9 / PR #437 / 55e38f0c).
# Runs on a schedule DELIBERATELY — a check wired only inside the deploy
# workflow can't catch the deploy workflow not running. This is a NEW,
# separate workflow; the schedule: sentinel in cross-engine-parity.yml only
# asserts no schedule trigger in THAT file (.github/workflows/cross-engine-parity.yml:232-249)
# and does not forbid one elsewhere.
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (SO #40a) — every step in this workflow is read-only (live fetches, no push/deploy/commit), so dry_run=true runs the full check suite; there is no irreversible step to skip.'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check-drift:
    name: Compare live deploy stamp to origin/main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: ⬢ Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: 🔎 Check for deploy drift (advisory — see FAIL_ON_DRIFT in the script)
        run: node scripts/check-deploy-drift.mjs

      # The between-deploy leg (2026-09-03): the served-egress/byte-integrity
      # check landed via #1668 fired ONLY post-deploy in
      # deploy-to-dreamhost.yml — a CF dashboard change, edge config change,
      # or origin compromise hours AFTER a deploy was invisible until the
      # next deploy. Same script, no second checker to drift.
      # Seeded draw: --sample 25 --seed $(date +%s) gives coverage over time
      # that the fixed even spread cannot (the post-deploy leg stays
      # deterministic 12, unchanged). RED = workflow failure; no
      # auto-remediation; cf-cache-status discipline unchanged.
      - name: 🔎 Served-egress + byte-integrity check (live, seeded sample)
        run: node scripts/check-served-egress.mjs --sample 25 --seed $(date +%s)
