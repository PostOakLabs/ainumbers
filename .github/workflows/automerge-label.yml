name: Automerge Label

# Takes the `gh pr merge` step off every session. A session that finds a PR
# green just labels it `automerge`; this workflow enables GitHub's own
# auto-merge, and GitHub merges the PR itself once every required check
# passes. No session runs `gh pr merge` again; Tim clicks nothing.
#
# WHY AN APP TOKEN, NOT GITHUB_TOKEN — same trap as derived-artifacts-regen.yml:
# a GITHUB_TOKEN-authored merge is exempt from ruleset bypass and does not
# fire `push: main` workflows, so deploy + derived-artifacts regen would
# silently stop running on every automerged PR. Mint the same
# ainumbers-spec-sync App installation token that regen uses, scoped to
# pull-requests:write only (no contents write needed here — the merge itself
# is done via `gh pr merge --auto`, not a push this job authors).
#
# MERGEQUEUE-REQUEUE-ON-TIMEOUT-1 (2026-09-10): also fires on the
# `pull_request` activity type `dequeued`. The merge queue (ruleset
# main-ci-anchor, 20721322) removes an entry whose checks outlive
# check_response_timeout_minutes (30) and publishes webhook
# `pull_request.dequeued` with reason enum value `CI_TIMEOUT` (GraphQL
# RemovedFromMergeQueueEvent.reason == checks_timed_out); the PR stays open
# and labelled with nothing re-arming it. On that event — and ONLY that one;
# CI_FAILURE / MERGE_CONFLICT / MANUAL / BRANCH_PROTECTIONS are never
# re-queued — the same enable/enqueue step re-queues the PR, capped at 3
# CI_TIMEOUT removals counted from the PR timeline; at the cap a comment is
# posted and the PR is left un-queued.

# AUTOMERGE-WORKFLOWFILE-GAP-1 (2026-10-17), two gaps measured on PR #2376:
# (1) a PR that edits .github/workflows/** can never be armed by this App token
# (it carries no `workflows` permission; GitHub refuses both
# enablePullRequestAutoMerge and enqueuePullRequest). The App installation's
# workflows grant could not be verified from CI, and requesting an ungranted
# permission makes the token mint itself fail for EVERY PR, so the token is
# left as-is and a workflow-touching PR now gets an explicit
# `needs-human-merge` comment instead of a silently failed run.
# (2) a labelled PR removed from the queue for any reason other than
# checks_timed_out (e.g. failed_checks) and later green again was never
# re-armed. The hourly `rearm-recovered` job below scans labelled open PRs and
# arms any that are mergeStateStatus CLEAN with nothing pending.
on:
  pull_request:
    types: [labeled, dequeued]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  enable-automerge:
    name: Enable auto-merge on labeled PR
    if: (github.event.action == 'labeled' && github.event.label.name == 'automerge') || (github.event.action == 'dequeued' && github.event.reason == 'CI_TIMEOUT' && contains(github.event.pull_request.labels.*.name, 'automerge'))
    runs-on: ubuntu-latest
    steps:
      # Held-draft shard PRs must never auto-merge (board/STANDING-ORDERS.md
      # -0.7) and a fork PR's head repo differs from the base repo, which the
      # App token cannot push/merge across without a second grant — skip both.
      - name: Guard draft and fork PRs
        id: guard
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          WF=$(gh pr diff "$PR" -R "$BASE_REPO" --name-only | grep -c '^\.github/workflows/' || true)
          echo "workflow_files=$WF" >> "$GITHUB_OUTPUT"
          if [ "$WF" -gt 0 ]; then
            echo "::notice title=Skipped::PR touches .github/workflows/**; the App token has no workflows permission, so it cannot be armed. Needs a human merge."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ "$IS_DRAFT" = "true" ]; then
            echo "::notice title=Skipped::PR is a draft; auto-merge not enabled."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::notice title=Skipped::PR head repo ($HEAD_REPO) differs from base repo ($BASE_REPO); auto-merge not enabled."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # Mints a credential scoped to this one repo, expiring with the job.
      # Same App + same action pin as derived-artifacts-regen.yml and
      # sync-chaingraph-spec.yml. BOTH permissions below are required: a
      # pull-requests:write-only token gets "Resource not accessible by
      # integration (mergePullRequest)" from enablePullRequestAutoMerge —
      # measured 2026-08-16, run 31981224894 — because enabling auto-merge
      # is gated on merge/contents permission, not just PR-write. The
      # installation already grants contents:write (same as regen's token).
      - name: Mint PR token
        if: steps.guard.outputs.proceed == 'true' || steps.guard.outputs.workflow_files != '0'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-contents: write

      - name: Notice - workflow-touching PR needs a human merge
        if: steps.guard.outputs.workflow_files != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh pr view "$PR" -R "$REPO" --json comments -q '.comments[].body' | grep -q 'needs-human-merge'; then
            echo "needs-human-merge notice already posted"
            exit 0
          fi
          gh pr comment "$PR" -R "$REPO" --body "needs-human-merge: this PR changes \`.github/workflows/**\`. The automerge App token has no \`workflows\` permission, so GitHub refuses to arm or enqueue it. Auto-merge was NOT enabled; merge it by hand."

      # MERGEQUEUE-REQUEUE-ON-TIMEOUT-1 (2026-09-10): dequeued runs only —
      # count this PR's prior removals from the merge queue and re-queue on
      # the CI_TIMEOUT path below only while the count is under 3. Counted
      # from the PR timeline (RemovedFromMergeQueueEvent, last 10), filtering
      # reason == checks_timed_out (the GraphQL spelling of the webhook's
      # CI_TIMEOUT enum). The removal that fired this run is already on the
      # timeline when the dequeued webhook delivers, so it is counted too:
      # removal 3 is the cap — that one posts the comment and does not
      # re-queue. Removals for any other reason are not counted and never
      # reach this job (job `if`).
      - name: Cap CI_TIMEOUT re-queues
        if: github.event.action == 'dequeued'
        id: timeout-cap
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          NODE_ID=$(gh pr view "$PR" -R "$REPO" --json id -q .id)

          COUNT=$(gh api graphql -f query='
            query($id: ID!) {
              node(id: $id) {
                ... on PullRequest {
                  timelineItems(itemTypes: [REMOVED_FROM_MERGE_QUEUE_EVENT], last: 10) {
                    nodes {
                      ... on RemovedFromMergeQueueEvent { reason }
                    }
                  }
                }
              }
            }' -f id="$NODE_ID" | jq '[.data.node.timelineItems.nodes[] | select(.reason == "checks_timed_out")] | length')

          echo "merge queue removed this PR for CI_TIMEOUT $COUNT time(s) including this one"
          if [ "$COUNT" -ge 3 ]; then
            gh pr comment "$PR" -R "$REPO" --body "merge-queue: removed for CI_TIMEOUT 3 times; not re-queuing. Split the PR or raise check_response_timeout_minutes (ruleset 20721322)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      # `gh pr merge --auto` silently no-ops on a PR that is ALREADY green
      # at label time, given the active merge_queue rule (main-ci-anchor,
      # 20721322) — measured 2026-08-17 on PR #1348, run 32029898577: the
      # step exited 0, printed "! The merge strategy for main is set by the
      # merge queue", posted the comment below, and yet autoMergeRequest
      # stayed null and the PR was never added to the queue. Still-running
      # PRs are unaffected (#1345/#1349 merged fine — native auto-merge
      # waits for their checks, then GitHub itself enqueues them). So this
      # step no longer trusts the command's exit code: it asserts the end
      # state via GraphQL and falls back to enqueuePullRequest directly
      # when native auto-merge left the PR untouched.
      - name: Enable auto-merge / enqueue
        if: steps.guard.outputs.proceed == 'true' && steps.timeout-cap.outputs.proceed != 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # -R required: no checkout step runs in this job, so gh has no git
          # repo to infer the target from (measured 2026-08-16, run 31980911540:
          # "fatal: not a git repository" without it). `|| true`: this is the
          # happy path for a still-checking PR, not a fatal condition here —
          # the assertion below is what decides pass/fail.
          gh pr merge "$PR" -R "$REPO" --auto --squash || true

          NODE_ID=$(gh pr view "$PR" -R "$REPO" --json id -q .id)

          check_state() {
            gh api graphql -f query='
              query($id: ID!) {
                node(id: $id) {
                  ... on PullRequest {
                    merged
                    autoMergeRequest { enabledAt }
                    mergeQueueEntry { id }
                  }
                }
              }' -f id="$NODE_ID"
          }

          RESULT=$(check_state)
          MERGED=$(echo "$RESULT" | jq -r '.data.node.merged')
          AUTO=$(echo "$RESULT" | jq -r '.data.node.autoMergeRequest')
          QUEUED=$(echo "$RESULT" | jq -r '.data.node.mergeQueueEntry')

          if [ "$MERGED" = "true" ] || [ "$AUTO" != "null" ] || [ "$QUEUED" != "null" ]; then
            echo "auto-merge confirmed: merged=$MERGED autoMergeRequest=$AUTO mergeQueueEntry=$QUEUED"
          else
            echo "::notice title=Fallback::native auto-merge left PR #$PR untouched (already green); enqueueing directly via GraphQL enqueuePullRequest"
            gh api graphql -f query='
              mutation($id: ID!) {
                enqueuePullRequest(input: {pullRequestId: $id}) {
                  mergeQueueEntry { id }
                }
              }' -f id="$NODE_ID"

            RESULT=$(check_state)
            MERGED=$(echo "$RESULT" | jq -r '.data.node.merged')
            AUTO=$(echo "$RESULT" | jq -r '.data.node.autoMergeRequest')
            QUEUED=$(echo "$RESULT" | jq -r '.data.node.mergeQueueEntry')

            if [ "$MERGED" != "true" ] && [ "$AUTO" = "null" ] && [ "$QUEUED" = "null" ]; then
              echo "::error title=Automerge failed::PR #$PR is neither merged, auto-merge-pending, nor enqueued after the enqueuePullRequest fallback. This step must not report success while leaving the PR untouched (board/STANDING-ORDERS.md #41/#34c)."
              exit 1
            fi
            echo "auto-merge confirmed via fallback: merged=$MERGED autoMergeRequest=$AUTO mergeQueueEntry=$QUEUED"
          fi

          gh pr comment "$PR" -R "$REPO" --body "auto-merge enabled by automerge-label.yml; GitHub merges this PR itself once every required check passes. No further \`gh pr merge\` needed."

  # AUTOMERGE-WORKFLOWFILE-GAP-1: recovery re-arm. Scheduled/manual only.
  rearm-recovered:
    name: Re-arm labelled PRs that recovered to green
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Mint PR token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-contents: write

      - name: Arm labelled, clean, un-armed PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          FAILS=0
          for PR in $(gh pr list -R "$REPO" --label automerge --state open --draft=false --json number -q '.[].number'); do
            VIEW=$(gh pr view "$PR" -R "$REPO" --json id,mergeStateStatus,autoMergeRequest,headRepositoryOwner,files)
            STATE=$(echo "$VIEW" | jq -r .mergeStateStatus)
            ARMED=$(echo "$VIEW" | jq -r '.autoMergeRequest')
            WF=$(echo "$VIEW" | jq '[.files[].path | select(startswith(".github/workflows/"))] | length')
            NODE_ID=$(echo "$VIEW" | jq -r .id)
            Q=$(gh api graphql -f query='query($id: ID!){node(id:$id){... on PullRequest{mergeQueueEntry{id}}}}' -f id="$NODE_ID" | jq -r '.data.node.mergeQueueEntry')
            if [ "$ARMED" != "null" ] || [ "$Q" != "null" ]; then echo "#$PR already armed/queued"; continue; fi
            if [ "$WF" -gt 0 ]; then echo "#$PR touches workflows; needs human merge, skipped"; continue; fi
            if [ "$STATE" != "CLEAN" ]; then echo "#$PR mergeStateStatus=$STATE, not re-arming"; continue; fi
            echo "#$PR is CLEAN, labelled and un-armed; arming"
            gh pr merge "$PR" -R "$REPO" --auto --squash || true
            AUTO=$(gh pr view "$PR" -R "$REPO" --json autoMergeRequest -q .autoMergeRequest)
            if [ "$AUTO" = "null" ] || [ -z "$AUTO" ]; then
              gh api graphql -f query='mutation($id: ID!){enqueuePullRequest(input:{pullRequestId:$id}){mergeQueueEntry{id}}}' -f id="$NODE_ID" || { echo "::error title=Re-arm failed::#$PR"; FAILS=$((FAILS+1)); continue; }
            fi
            gh pr comment "$PR" -R "$REPO" --body "auto-merge re-armed by automerge-label.yml (scheduled recovery scan: PR is clean and was not armed)."
          done
          [ "$FAILS" -eq 0 ]
