name: Automerge Label

# Takes the `gh pr merge` step off every session. A session that finds a PR
# green just labels it `automerge`; this workflow enables GitHub's own
# auto-merge, and GitHub merges the PR itself once every required check
# passes. No session runs `gh pr merge` again; Tim clicks nothing.
#
# WHY AN APP TOKEN, NOT GITHUB_TOKEN — same trap as derived-artifacts-regen.yml:
# a GITHUB_TOKEN-authored merge is exempt from ruleset bypass and does not
# fire `push: main` workflows, so deploy + derived-artifacts regen would
# silently stop running on every automerged PR. Mint the same
# ainumbers-spec-sync App installation token that regen uses, scoped to
# pull-requests:write only (no contents write needed here — the merge itself
# is done via `gh pr merge --auto`, not a push this job authors).

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  enable-automerge:
    name: Enable auto-merge on labeled PR
    if: github.event.label.name == 'automerge'
    runs-on: ubuntu-latest
    steps:
      # Held-draft shard PRs must never auto-merge (board/STANDING-ORDERS.md
      # -0.7) and a fork PR's head repo differs from the base repo, which the
      # App token cannot push/merge across without a second grant — skip both.
      - name: Guard draft and fork PRs
        id: guard
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$IS_DRAFT" = "true" ]; then
            echo "::notice title=Skipped::PR is a draft; auto-merge not enabled."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::notice title=Skipped::PR head repo ($HEAD_REPO) differs from base repo ($BASE_REPO); auto-merge not enabled."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # Mints a credential scoped to this one repo, expiring with the job.
      # Same App + same action pin as derived-artifacts-regen.yml and
      # sync-chaingraph-spec.yml. BOTH permissions below are required: a
      # pull-requests:write-only token gets "Resource not accessible by
      # integration (mergePullRequest)" from enablePullRequestAutoMerge —
      # measured 2026-08-16, run 31981224894 — because enabling auto-merge
      # is gated on merge/contents permission, not just PR-write. The
      # installation already grants contents:write (same as regen's token).
      - name: Mint PR token
        if: steps.guard.outputs.proceed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-contents: write

      # `gh pr merge --auto` silently no-ops on a PR that is ALREADY green
      # at label time, given the active merge_queue rule (main-ci-anchor,
      # 20721322) — measured 2026-08-17 on PR #1348, run 32029898577: the
      # step exited 0, printed "! The merge strategy for main is set by the
      # merge queue", posted the comment below, and yet autoMergeRequest
      # stayed null and the PR was never added to the queue. Still-running
      # PRs are unaffected (#1345/#1349 merged fine — native auto-merge
      # waits for their checks, then GitHub itself enqueues them). So this
      # step no longer trusts the command's exit code: it asserts the end
      # state via GraphQL and falls back to enqueuePullRequest directly
      # when native auto-merge left the PR untouched.
      - name: Enable auto-merge / enqueue
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # -R required: no checkout step runs in this job, so gh has no git
          # repo to infer the target from (measured 2026-08-16, run 31980911540:
          # "fatal: not a git repository" without it). `|| true`: this is the
          # happy path for a still-checking PR, not a fatal condition here —
          # the assertion below is what decides pass/fail.
          gh pr merge "$PR" -R "$REPO" --auto --squash || true

          NODE_ID=$(gh pr view "$PR" -R "$REPO" --json id -q .id)

          check_state() {
            gh api graphql -f query='
              query($id: ID!) {
                node(id: $id) {
                  ... on PullRequest {
                    merged
                    autoMergeRequest { enabledAt }
                    mergeQueueEntry { id }
                  }
                }
              }' -f id="$NODE_ID"
          }

          RESULT=$(check_state)
          MERGED=$(echo "$RESULT" | jq -r '.data.node.merged')
          AUTO=$(echo "$RESULT" | jq -r '.data.node.autoMergeRequest')
          QUEUED=$(echo "$RESULT" | jq -r '.data.node.mergeQueueEntry')

          if [ "$MERGED" = "true" ] || [ "$AUTO" != "null" ] || [ "$QUEUED" != "null" ]; then
            echo "auto-merge confirmed: merged=$MERGED autoMergeRequest=$AUTO mergeQueueEntry=$QUEUED"
          else
            echo "::notice title=Fallback::native auto-merge left PR #$PR untouched (already green); enqueueing directly via GraphQL enqueuePullRequest"
            gh api graphql -f query='
              mutation($id: ID!) {
                enqueuePullRequest(input: {pullRequestId: $id}) {
                  mergeQueueEntry { id }
                }
              }' -f id="$NODE_ID"

            RESULT=$(check_state)
            MERGED=$(echo "$RESULT" | jq -r '.data.node.merged')
            AUTO=$(echo "$RESULT" | jq -r '.data.node.autoMergeRequest')
            QUEUED=$(echo "$RESULT" | jq -r '.data.node.mergeQueueEntry')

            if [ "$MERGED" != "true" ] && [ "$AUTO" = "null" ] && [ "$QUEUED" = "null" ]; then
              echo "::error title=Automerge failed::PR #$PR is neither merged, auto-merge-pending, nor enqueued after the enqueuePullRequest fallback. This step must not report success while leaving the PR untouched (board/STANDING-ORDERS.md #41/#34c)."
              exit 1
            fi
            echo "auto-merge confirmed via fallback: merged=$MERGED autoMergeRequest=$AUTO mergeQueueEntry=$QUEUED"
          fi

          gh pr comment "$PR" -R "$REPO" --body "auto-merge enabled by automerge-label.yml; GitHub merges this PR itself once every required check passes. No further \`gh pr merge\` needed."
