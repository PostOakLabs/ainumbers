name: Helm Guide Freshness (scheduled)

# The guide-freshness check (does helm.html's walkthrough, scenes s1-s6,
# visibly differ since the last synced release, or is the new version
# acknowledged as having nothing to show) asserts a human judgment call, not a
# machine-derivable fact. Keeping it on the blocking deploy path meant every
# site push — including ones touching no helm file at all — reds the moment a
# helm release ships without a walkthrough edit or an acknowledgment, which
# happened twice in one day and once took ainumbers.co/helm/version.json down
# with it (run 30655191112).
#
# This is a side project with no on-call human, so no design that ends in a
# person acknowledging something before a deploy can proceed is acceptable.
# The check moves here instead: same evaluate() logic in
# gen-helm-guide-freshness.mjs, same non-blocking shape as the worker's
# Vendor Freshness (vendor-freshness-schedule.yml) — it can only raise a
# tracking issue, never block anything, because by the time this runs there
# is nothing left to block. Deploy to DreamHost's own preflight job stays
# the real, blocking gate for what it always blocked (JS syntax, hashes,
# dead links, helm release/version drift, etc.) — this workflow adds zero
# blocking surface anywhere.
#
# 2026-08-11: a job literally named "report only" still exited 1 on a stale
# finding, reddening the run and sending a failure email every 6h cycle
# (3x in one day) — noise-training on a real signal. Fixed by exit-code
# triage in gen-helm-guide-freshness.mjs (0 = clean, 2 = stale finding,
# 1 = the checker itself crashed) plus a GITHUB_OUTPUT the run reads:
# stale=true|false runs GREEN with a ::notice + job summary; any other exit
# code still reds. raise-on-stale is gated on that output, not on failure(),
# so it keeps firing on a stale finding even though the run is green.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours — matches the worker's Vendor Freshness cadence
  workflow_dispatch: {}      # manual trigger for seeding/verifying the gate

permissions:
  contents: read

jobs:
  check-freshness:
    name: Guide-freshness check (report only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: ⬢ Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: 🧪 Run gate unit tests (a real bug here MUST still red the run)
        run: node scripts/gen-helm-guide-freshness.test.mjs

      - name: 🪖 Helm guide freshness (report only — stale is a finding, not a failure)
        id: check
        run: |
          set +e
          OUTPUT=$(node scripts/gen-helm-guide-freshness.mjs --check 2>&1)
          CODE=$?
          echo "$OUTPUT"
          if [ "$CODE" -eq 0 ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" -eq 2 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            {
              echo "## 🪖 Helm guide freshness: STALE"
              echo ""
              echo '```'
              echo "$OUTPUT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Helm guide freshness::$OUTPUT"
          else
            # Any other exit code (uncaught exception, missing file, etc.) is
            # the checker itself being broken, not a staleness finding — this
            # MUST red the run.
            echo "::error title=Helm guide-freshness checker crashed::exit code $CODE — $OUTPUT"
            exit "$CODE"
          fi

  raise-on-stale:
    name: Raise a tracking issue on a stale walkthrough
    needs: check-freshness
    if: needs.check-freshness.outputs.stale == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🚨 Open or update the guide-freshness tracking issue
        # No new third-party action: gh CLI ships preinstalled on ubuntu-latest runners.
        # Idempotent — reuses one open issue by title match instead of spamming a new
        # issue every 6h cycle while the staleness persists.
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Helm guide freshness: walkthrough byte-identical since last release"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          BODY="Scheduled helm guide-freshness check found helm.html's \
          walkthrough (scenes s1-s6) is byte-identical to the last synced release, but \
          helm/version.json names a newer one.

          This does NOT block any deploy — it is a report-only finding for whoever wants to \
          look at it next.

          **Fix, either one:**
          - Add something a user can see to the walkthrough for the new release, then run \
          \`node scripts/gen-helm-guide-freshness.mjs\` and commit the updated \
          \`helm/guide-freshness.json\`, or
          - If there is genuinely nothing visible to show (e.g. a repair-only release), add \
          the version to \`helm/guide-freshness.json\`'s \`acknowledged_no_change\` array with \
          a reason, then run the same sync command.

          Failing run: $RUN_URL"
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "Still stale as of this cycle. $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
