name: Auto Arm

# Labels `automerge` on allowlisted PRs the moment they are green on a fresh
# head, so arming no longer waits for a scheduled sweep.
# All decision logic lives in scripts/ci/auto-arm.mjs (fixture-tested). Every
# decision is a job-summary line (armed / waiting: <reason>). Never removes
# labels, never merges. The label is applied with the App token so the
# `labeled` event fires automerge-label.yml (a GITHUB_TOKEN label would not).
on:
  check_suite:
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: auto-arm
  cancel-in-progress: false

jobs:
  auto-arm:
    name: Arm allowlisted PRs on green
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Mint PR token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-contents: write

      # On push to main this is also the serial baton: the first open branch
      # in auto-arm-allow.json `lineage` is re-evaluated after a lineage merge.
      - name: Decide and arm
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/auto-arm.mjs
