name: Replay Result Matrix

# Manual only. Replays the golden fixture corpus on three operating systems and
# uploads replay-result.json (deterministic) and replay-env.json (host facts).
# The three replay-result.json files must be byte-identical. This workflow
# attests nothing, is never a required check and never runs on merge_group.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Replay corpus
        shell: bash
        run: node scripts/replay-result.mjs --out replay-out

      - name: Print result digest
        shell: bash
        run: node -e "const c=require('crypto'),f=require('fs');console.log('replay-result.json sha256 '+c.createHash('sha256').update(f.readFileSync('replay-out/replay-result.json')).digest('hex'))"

      - name: Upload result files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: replay-result-${{ matrix.os }}
          path: replay-out/
          if-no-files-found: error
