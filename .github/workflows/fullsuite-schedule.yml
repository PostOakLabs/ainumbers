name: Full Suite (scheduled)

# FULLSUITE-SCHEDULE-1 — anchored on 0xAlpha/2026-08-21-mechanical-verification-audit.md
# Finding 4 / Rec B3 (Tier B #3): "nothing periodically re-runs the *entire* hard suite
# against main to catch slow drift that no single diff shape triggers." Every existing
# CI workflow is path-filtered by design (scripts-verify.yml, html-verify.yml,
# land-verify.yml, ...) — correct for keeping PRs fast, but it means a gate that only
# regresses because of TIME (a staleness window crossed, an upstream drift, live
# /mcp state diverging from committed data) is never re-checked unless its own diff
# shape happens to touch it. This workflow closes that gap by re-running the full
# estate on a schedule, independent of any diff.
#
# REPORT-ONLY, FOREVER (row rail). This workflow:
#   - never blocks a merge or a deploy — it has no `pull_request` trigger and is not
#     named in any branch ruleset's required-status-checks;
#   - never writes to either repo — no auto-fix, no regen commit. SO #35 (single
#     writer for shared derived artifacts) stays entirely with
#     derived-artifacts-regen.yml; this workflow's `permissions:` is contents:read
#     at both the top level and every job, with no exceptions;
#   - therefore SO #47's declared-write-set requirement does not apply — there is no
#     write for scripts/derived-artifacts.mjs to declare.
#
# HOW A FINDING SURFACES. Each check below is a separate step so every one of them
# always runs regardless of an earlier failure (`continue-on-error: true` +
# `if: always()` on the summary step) — a single weekly run gives the full picture
# instead of stopping at the first red, mirroring preflight.mjs's own --keep-going
# philosophy. The job's own final exit code still goes red if anything failed: that
# redness on the Actions tab (plus the job summary table) IS the report surface —
# where the ORCH's CI monitor already looks for red runs. No GitHub issue is filed
# (unlike helm-guide-freshness-schedule.yml / vendor-freshness-schedule.yml in the
# worker repo, which need issues:write because their cadence is every 6h and an
# every-cycle red run would spam a failure email; this workflow is weekly, so a
# red run itself is the intended, proportionate signal, and issues:write is not
# added anywhere in this file).
#
# SCOPE: site's `preflight.mjs` (bare, no --changed — the exact invocation
# scripts-verify.yml already uses for "full gate suite") plus the worker repo's
# three post-deploy sweeps (hash-sweep.mjs, verify-mcp-registered.mjs --all,
# smoke-mcp.mjs). All three sweep scripts import only node:fs/node:path/node:url
# plus global fetch — zero npm dependencies — so the worker checkout below needs
# no `npm ci` and SO #10's npm-free discipline is not in tension with anything
# here (that rule targets local sessions; ci.yml's own `validate`/`deploy` jobs
# already run `npm ci` in this worker's CI for the steps that DO need it — not
# these three). Copied verbatim from mcp-apps-poc/.github/workflows/ci.yml's
# `deploy` job: same MCP_URL, same CHAINGRAPH/KERNELS_DIR shape (pointed at the
# worker checkout's own vendored copies, matching what ci.yml passes via
# github.workspace when the worker is the only checkout in that job).
#
# SCHEDULE: weekly, mid-morning US Central (Tim's ruling for this row — a red
# discovered at 03:00 helps nobody and ORCH monitors may be dark). 15:00 UTC is
# 10:00 CDT / 09:00 CST — inside waking hours either side of the DST boundary;
# not worth a solar-time cron for a once-a-week report.
#
# dry_run input exists for SO #40a parity (main-only-trigger workflows must accept
# workflow_dispatch with a dry_run input). It is a documented no-op here: every
# step in this workflow is already read-only (no push/deploy/publish/commit
# anywhere in the file), so there is no irreversible step for dry_run to skip —
# dispatching with or without it runs the identical, already-safe steps. Kept as
# an explicit input (rather than omitted) so the workflow still SHOWS the SO #40a
# shape at a glance and the dispatch-run evidence quoted in the PR body used
# dry_run:true.

on:
  schedule:
    - cron: '0 15 * * 1'   # every Monday, 15:00 UTC (~mid-morning US Central)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no-op — this workflow already writes nothing; see header comment)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  full-suite:
    name: Full hard-gate suite + worker post-deploy sweeps (report-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout site repo (main)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🟢 Setup Node 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: 🧪 Site — full preflight gate suite (bare, no --changed)
        id: preflight
        continue-on-error: true
        run: node scripts/preflight.mjs

      - name: 📥 Checkout worker repo (mcp-apps-poc, for post-deploy sweeps)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: PostOakLabs/ainumbers-mcp-apps
          path: _worker
          fetch-depth: 1
          persist-credentials: false

      - name: 🌐 Worker — hash-sweep (every live gpu:false node returns a valid hash)
        id: hashsweep
        continue-on-error: true
        run: node _worker/scripts/hash-sweep.mjs
        env:
          MCP_URL: https://mcp.ainumbers.co/mcp
          CHAINGRAPH: ${{ github.workspace }}/_worker/data/chaingraph/chaingraph.json
          KERNELS_DIR: ${{ github.workspace }}/_worker/kernels
          THROTTLE_MS: '1500'

      - name: 🔎 Worker — verify MCP tool registration (live tools/list)
        id: verifyreg
        continue-on-error: true
        run: node _worker/scripts/verify-mcp-registered.mjs --all
        env:
          MCP_URL: https://mcp.ainumbers.co/mcp

      - name: 🔌 Worker — post-deploy /mcp smoke test
        id: smoke
        continue-on-error: true
        run: node _worker/scripts/smoke-mcp.mjs
        env:
          MCP_SMOKE_URL: https://mcp.ainumbers.co/mcp

      - name: 📋 Summarize (report-only — this run's own red/green IS the finding surface)
        if: always()
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          HASHSWEEP: ${{ steps.hashsweep.outcome }}
          VERIFYREG: ${{ steps.verifyreg.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          {
            echo "## Full Suite (scheduled) — weekly full-estate report"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Site preflight (full, bare) | $PREFLIGHT |"
            echo "| Worker hash-sweep | $HASHSWEEP |"
            echo "| Worker verify-mcp-registered --all | $VERIFYREG |"
            echo "| Worker post-deploy smoke | $SMOKE |"
            echo ""
            echo "Report-only: this workflow never blocks a merge or deploy and never writes"
            echo "to either repo. A red run here is the finding — it goes wherever the ORCH's"
            echo "CI monitor already watches for failed runs; no fix/gate row is auto-staged"
            echo "from it (SO #42(c) — findings land in research/FINDINGS-HELD-2026-08.md)."
          } >> "$GITHUB_STEP_SUMMARY"

          FAIL=0
          for R in "$PREFLIGHT" "$HASHSWEEP" "$VERIFYREG" "$SMOKE"; do
            if [ "$R" != "success" ]; then FAIL=1; fi
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "::error title=Full Suite (scheduled)::One or more checks failed this cycle — see the job summary. Report-only: does not block any merge/deploy."
            exit 1
          fi
          echo "✅ full estate + live worker sweeps clean this cycle."
