name: Protected Paths Guard

# GUARD-COVER-1 (2026-07-18): check-protected-paths.mjs's PR-blocking mode
# never ran — no pull_request trigger covered CONTRACT.md, SPEC.md, or the
# v0.4 schema, and html-verify/land-verify/scripts-verify don't invoke the
# guard even when they do trigger. This workflow is the missing coverage:
# it runs the guard, in PR context, on the protected paths (plus itself and
# the guard script, so the guard's own logic can't be weakened silently —
# GUARD-SELF-2, 2026-07-19).
#
# GUARD-LABEL-DROP-1 (2026-07-19): dropped the `protected-edit-approved`
# label / block-then-reopen design the same night it started actually
# firing (post-GUARD-TRIGGER-1). Tim was clicking the label on every
# guarded PR with no independent judgment behind it — he already has to
# review the diff to merge, since CODEOWNERS requires his review on these
# exact paths. The label was a second rubber-stamp on the same approval,
# not a second control, and pure tedium for zero added protection. This
# job is now informational only: it never fails, it just names the touched
# path(s) loudly in the log so a reviewer doesn't have to notice by memory.
# CODEOWNERS-required-review remains the actual, unchanged, enforced gate.

on:
  pull_request:
    paths:
      - 'CONTRACT.md'
      - 'chaingraph/standard/SPEC.md'
      - 'chaingraph/standard/openchain-graph-v0.4.schema.json'
      - '.github/workflows/protected-paths.yml'
      - 'scripts/check-protected-paths.mjs'

permissions:
  contents: read

jobs:
  protected-paths:
    name: Guard normative surface (informational)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check protected paths
        run: node scripts/check-protected-paths.mjs
