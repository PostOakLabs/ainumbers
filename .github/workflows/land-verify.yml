name: Land Verify

# Gate-coverage fix for LANDCI-1 (2026-07-14): `.land` PRs (art proof-attach
# splices) touch chaingraph.json + receipt fixtures + compute-proof-baseline
# + zk-sentinel HTML but NOT any *.kernel.mjs / kernel fixture file, so
# cross-engine-parity.yml's path filters never fire for them. That left the
# §18 compute-proof attachments — the evidence behind the public "N/N
# ZK-proven" claim — machine-verified nowhere in CI; only the landing
# session's local preflight.mjs attested it.
#
# This workflow runs the cheap, land-relevant SSOT/proof-coverage gates
# (NOT the cross-engine parity matrix — that needs kernel source and is
# already covered by cross-engine-parity.yml for actual kernel edits).
# Additive only: does not replace or weaken any existing gate.
#
# Gate-coverage fix for KERNELCI-1 (2026-07-19): a PR touching
# chaingraph/kernels/** or chaingraph/graph/nodes/** matched none of this
# workflow's (or any PR workflow's) path filters, so the §17 kernel-identity
# coverage gate — which only runs in deploy-to-dreamhost.yml's push-to-main
# preflight — never fired until AFTER merge (PR #429 / PPH1-CODE-1: merged
# all-green, then turned main red). Added those two path globs above plus
# the §17 step below, reusing deploy-to-dreamhost.yml's exact invocation.
#
# EXPECTED BEHAVIOUR, NOT A BUG: an EDITED-EXISTING-kernel PR will now go RED
# on its own PR, because the committed chaingraph.json still holds the old
# digest until the next assemble-and-land step regenerates it from shards.
# That red is the correct signal — edited-existing-shard PRs never self-merge.
# A BRAND-NEW-kernel PR stays GREEN — a node not yet in order.nodes isn't in
# the monolith yet, so the coverage check has nothing to compare.

on:
  push:
    branches: [ main ]
    paths:
      - 'chaingraph/chaingraph.json'
      - 'chaingraph/**.receipt.json'
      - 'scripts/compute-proof-baseline.json'
      - 'chaingraph/zkvm-compute-integrity.html'
      - 'chaingraph/chaingraph-hub.html'
      - 'chaingraph/kernels/**'
      - 'chaingraph/graph/nodes/**'
      - 'scripts/run-proptests.mjs'
      - 'scripts/check-fv-floor-coverage.mjs'
      - 'scripts/fv-floor-coverage-baseline.json'
      - '.github/workflows/land-verify.yml'
  pull_request:
    # ready_for_review added (DRAFTCI-1, 2026-07-20): draft PRs are skipped
    # below, so a readied draft must trigger a fresh run or it could merge
    # with no checks. Default types kept explicit alongside it.
    #
    # Always-report shape (2026-08-16): NO `paths:` filter here anymore —
    # see scripts-verify.yml's identical comment. The `relevant` job below
    # decides against scripts/ci-paths.json key "land-verify".
    #
    # converted_to_draft added (CI-REDNOISE-GATE-1, 2026-08-30): a PR opened
    # non-draft that goes RED by design (edited-existing-shard PR, CGSHARD-1
    # class), then converted to draft AFTER the run already failed, kept the
    # stale red forever — nothing re-dispatched this workflow on that
    # transition. Measured on PR #1584: opened 13:44:08Z, run failed by
    # 13:44:33Z, converted_to_draft 13:54:49Z, red check untouched
    # afterward. This re-fires the workflow on that exact transition so the
    # draft==false skip below supersedes the stale red.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # merge_group: see scripts-verify.yml's identical comment — required checks
  # must fire on merge_group or the queue deadlocks waiting on a status that
  # never reports.
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push/synchronize on the same PR ref supersedes its prior
  # in-progress run (CI-REDNOISE-GATE-1, 2026-08-30) — letting the stale one
  # finish is redundant CI time, not lost coverage. NEVER cancel a push:main
  # run — that run also drives attest-fv-artifacts below, and a cancelled
  # attestation just means the superseded commit goes unattested, which the
  # next push's own attest already makes moot; still cheaper to just let it
  # finish. NEVER cancel a merge_group run — a cancelled merge_group run
  # reports nothing back to the queue, which deadlocks it rather than just
  # leaving a stale red (SO #7). cancel-in-progress fires only for the
  # pull_request event.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  relevant:
    name: relevant
    # Always-report shape: see scripts-verify.yml's identical job for the
    # full rationale. Push events report hit=true unconditionally (the push
    # `paths:` filter above already scoped dispatch).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hit: ${{ steps.check.outputs.hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Check path relevance
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: node scripts/check-ci-relevant.mjs --key land-verify

  land-verify:
    name: §18 proof coverage + SSOT gates
    needs: relevant
    # DRAFTCI-1 (2026-07-20): expected-red proof/shard PRs open as drafts by
    # doctrine (they ride the next assemble-and-land step, which regenerates
    # chaingraph.json before anything merges). GitHub still runs pull_request workflows on
    # drafts, so those PRs showed a red X despite the draft rule — the red
    # carried no information. Skip drafts; the run fires on ready_for_review
    # and the push-to-main trigger remains the backstop.
    #
    # Always-report shape: also gated on needs.relevant.outputs.hit.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.relevant.outputs.hit == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # fetch-depth 0 (was 1): the touched-floor-files diff step below needs to resolve
          # github.event.before / the PR base sha as a real commit to diff against — the same
          # requirement jsdoc-checkjs.yml already solved this way. depth 1 would leave BASE unresolvable
          # on this job's own trigger shape most of the time, silently degrading the new gate to a no-op.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Assert base ref resolvable
        # The tripwire for the fetch-depth above. This job runs several
        # base-ref-consuming gates (check-shard-assembly, check-s18-digest-freshness,
        # check-node-complete, the touched-floor-files diff). With origin/<base>
        # unresolvable some fail closed and some silently degrade to "0 touched",
        # and neither says so in a way the reader can act on. Three-second red here
        # naming the cause, instead of a twenty-minute misdiagnosis. Plain git, no
        # gate script: an environment precondition, not a gate, so it adds nothing
        # for check-workflow-gate-parity.mjs to pair against.
        shell: bash
        run: |
          set -euo pipefail
          BASE="origin/${GITHUB_BASE_REF:-main}"
          if ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            echo "::error::base ref $BASE does not resolve in this checkout. Base-ref-consuming gates in this job would fail CLOSED or silently degrade. Set fetch-depth: 0 on this job's actions/checkout step."
            exit 1
          fi
          echo "base-ref: RESOLVED $BASE @ $(git rev-parse --short=12 "$BASE")"

      # Advisory on a branch, hard on main (2026-08-22). chaingraph.json is a generated monolith that only
      # the main-branch regeneration job may rewrite, so a branch that proves nodes edits the node shards
      # and cannot reassemble the monolith this gate reads. The committed monolith therefore stays stale for
      # the life of that branch, and a correctly-lowered deferred baseline reads to this gate as fabricated
      # proof regressions, blocking a branch that is not permitted to fix it. The split lives inside the
      # script (isMainContext(), the same shape check-kernel-coverage.mjs already uses): this step is
      # advisory on the `pull_request` and `merge_group` runs and stays HARD on this workflow's
      # `push: main` run, which is the one that sees the regenerated monolith. The .test.mjs beside it is
      # the red/green control proving the split both relaxes on a branch and still blocks on main.
      - name: §18 compute-proof coverage
        run: |
          node scripts/check-compute-proof-coverage.mjs
          node scripts/check-compute-proof-coverage.test.mjs

      - name: §18 digest-freshness ratchet (receipt digest vs current kernel source)
        run: |
          node scripts/check-s18-digest-freshness.mjs
          node scripts/check-s18-digest-freshness.test.mjs

      - name: Proof-badge freshness
        run: node scripts/check-proof-badge.mjs

      - name: chaingraph.json shard freshness (CGSHARD-1 CS-1)
        run: node scripts/assemble-chaingraph.mjs --check

      - name: Count-drift gate (advisory on PR, blocking on main/merge_group)
        # counts is a SHARED DERIVED ARTIFACT (derived-artifacts.mjs, id 'counts') — single-
        # writer, regenerated by derived-artifacts-regen.yml on main. A branch PR cannot
        # regenerate it itself (a prove batch or count-moving land PR has no way to satisfy
        # this gate in-branch), so blocking here made every such PR unmergeable once this
        # workflow's required check started gating merges.
        # run-gate.mjs applies the same split preflight.mjs already applies locally: warn +
        # exit 0 on a PR, block on main/merge_group (isMainContext() treats merge_group as
        # main context, not PR — the queue must still catch a stale count same as a push).
        run: node scripts/run-gate.mjs node scripts/verify-counts.mjs --check

      - name: Registry kernel-resolve coverage
        # WIRED 2026-08-23. Third instance of this workflow's founding class: a gate that
        # existed ONLY in scripts/preflight.mjs and in no workflow at all (see the two
        # earlier cases in this file's header). The divergence is not symmetric and that is what
        # made it dangerous: main CI stayed GREEN while .githooks/pre-push FAILED for every
        # session, because a node going non-live (art-99 -> deprecated) stranded its
        # kernel_digest record as an orphan. Nobody could see the cause from CI, and a red
        # local preflight actively manufactures --no-verify bypasses — which in turn skip the
        # attestation note and red main on prepush-attestation.yml. One orphan, three surfaces.
        # Blocking in both contexts: unlike counts, this artifact IS regenerable in-branch
        # (--write for missing/stale, git rm for an orphan), so there is no PR that cannot
        # satisfy it and no reason to downgrade it to advisory.
        run: node scripts/gen-registry-kernel-resolve.mjs --check

      - name: Deadline-wall freshness gate
        run: node scripts/check-deadline-freshness.mjs

      - name: Bank dated-fact freshness gate
        run: node scripts/check-bank-fact-freshness.mjs

      - name: Tool-number uniqueness gate (TOOLNUM-FIX-1)
        run: node scripts/check-tool-number-unique.mjs

      # Wired HERE and not only into the scripts workflow because this workflow's path filter is the
      # one that covers chaingraph/kernels/** — which is where the phasing note that motivated the
      # gate lives: kernel-contract.test.mjs kept its own fixture-coverage check lenient long after
      # the precondition it named had been met, because nobody re-reads a comment to check whether
      # it expired. The scripts workflow runs the same two gates via the full preflight suite.
      - name: Phasing-note ratchet
        run: node scripts/check-phasing-notes.mjs

      - name: Phasing-note gate controls (RED + GREEN + false-positive + known-answer)
        run: node scripts/check-phasing-notes.test.mjs

      - name: SSOT schema-validate
        run: node chaingraph/standard/schema-validate.mjs

      - name: SSOT version-consistency
        run: node chaingraph/standard/spec-version-consistency.mjs

      - name: SSOT gate-coverage
        run: node chaingraph/standard/spec-gate-coverage.mjs

      - name: §17 kernel-identity coverage (KERNELCI-1 + KERNELID-GATE-1)
        # Same invocations deploy-to-dreamhost.yml runs at push-to-main preflight.
        # Now also runs on PRs touching kernel/node paths — see comment above.
        # TWO checks, deliberately BOTH kept (KERNELID-GATE-1 SPLIT design):
        #   1. monolith --check is the PR-time BRAKE (KERNELCI-1) — an edited-existing-kernel
        #      PR stays RED here until the next assemble-and-land step regenerates
        #      chaingraph.json, by design (see failure-hint
        #      diagnosis text in gen-kernel-identity.mjs for how to tell that apart from a
        #      genuine identity mismatch). Do NOT remove this even though shard mode below
        #      passes the same PR — removing it re-opens the PR #429 hole.
        #   2. shard --check is the hard identity assertion + closes the "brand-new unstamped
        #      kernel passes by absence from chaingraph.json" coverage gap that monolith mode
        #      alone cannot see (see gen-kernel-identity.mjs header + KERNELID-GATE-1).
        run: |
          node chaingraph/kernels/kernel-identity.test.mjs
          node chaingraph/kernels/gen-kernel-identity.mjs --check
          node chaingraph/kernels/gen-kernel-identity.mjs --check --shard

      - name: Cross-surface fact consistency
        # This workflow's path filter is `chaingraph/kernels/**` +
        # `chaingraph/graph/nodes/**`, which is exactly the merge trap this
        # checker exists to close: a kernel PR that lands WITHOUT its page, so
        # the two surfaces publish different regulatory strings for the same
        # node and no gate notices. Legs (a)/(c)/(d) are blocking against
        # scripts/cross-surface-baseline.json (down-only); leg (b) prints the
        # stale register-digest count and never affects the exit code.
        # html-verify.yml runs the same command for page-only PRs, and
        # preflight (scripts-verify.yml) covers the script and shard paths.
        run: |
          node scripts/check-cross-surface.test.mjs
          node scripts/check-cross-surface.mjs

      # Resolve base/head once, reused by the scoped
      # Property-testing floor step below. Same BASE resolution shape as the
      # "List floor files touched" step further down (kept separate/duplicated
      # rather than reordered, to avoid touching that step's own working logic).
      - name: Resolve base/head for scoped property-floor run
        id: floor-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
            HEAD="$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            BASE="$MERGE_GROUP_BASE_SHA"
            HEAD="$MERGE_GROUP_HEAD_SHA"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_SHA"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "head=" >> "$GITHUB_OUTPUT"
          else
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Property-testing floor
        # Runs chaingraph/kernels/__proptests__/*.proptest.mjs (zero-dep,
        # hand-rolled per FV-PBT-FLOOR-BUILD-SPEC.md §2 — no fast-check, no new
        # npm dependency). An empty __proptests__/ directory is a no-op PASS —
        # this is the gate every FV-PROPFLOOR-SHARD-* rollout row depends on.
        # Scoped to floor files/kernels touched by
        # this diff when base/head resolve; falls back to a full run otherwise
        # (undeterminable diff, or a shared kernel helper touched) — see
        # run-proptests.mjs's own --base/--head doc comment for the soundness
        # argument (every floor file imports only its own sibling kernel).
        env:
          FLOOR_BASE: ${{ steps.floor-base.outputs.base }}
          FLOOR_HEAD: ${{ steps.floor-base.outputs.head }}
        run: |
          set -euo pipefail
          if [ -n "$FLOOR_BASE" ]; then
            node scripts/run-proptests.mjs --base "$FLOOR_BASE" --head "$FLOOR_HEAD"
          else
            node scripts/run-proptests.mjs
          fi

      - name: FV floor coverage ratchet
        # Coverage/freshness ratchet on top of run-proptests.mjs above: every live
        # kernel must carry a __proptests__/<tool_id>.proptest.mjs floor file whose
        # header kernel_digest_at_authoring matches the kernel as it stands now.
        # Honest ratchet — baseline may only shrink; a brand-new unfloored kernel
        # or a regression (was floored, now isn't) fails unconditionally, never
        # absorbed by --update-baseline. PBT-floor tier only, not Dafny.
        run: |
          node scripts/check-fv-floor-coverage.mjs
          node scripts/check-fv-floor-coverage.test.mjs
      - name: Floor label strength lint
        # Outcome-language labels (must/should/never/always/cannot -- corpus-derived) whose
        # file pins NO outcome to any literal: the proptest-oracle-vacuity audit F-A class
        # (labels are decoration; one census floor greens over two labels its own kernel
        # Ratcheted baseline, counts only go down. Wired here AND in preflight.mjs so the
        # gate cannot become preflight-only.
        run: |
          node scripts/check-floor-label-strength.mjs
          node scripts/check-floor-label-strength.test.mjs

      - name: Narrative vocab lint
        # Self-certifying stability and legal-event prose (unchanged since YYYY, structural,
        # vacated, upheld) in kernel comments AND the rule_note/table_source/fr_citation
        # payload fields that ride MCP responses. Dated-observation escape hatch; ratcheted
        # baseline. Runs here AND in the local preflight suite.
        run: |
          node scripts/check-narrative-vocab.mjs
          node scripts/check-narrative-vocab.test.mjs

      - name: Vow-vs-code lint
        # Consume/do-not-duplicate vows in kernels with no module import and no declared
        # shard consumes edge -- dependency claims nothing verifies. Chain-edge ocg:consumes
        # adjacency is deliberately not consulted (adjacency is not provenance). Ratcheted
        # baseline. Runs here AND in the local preflight suite.
        run: |
          node scripts/check-vow-vs-code.mjs
          node scripts/check-vow-vs-code.test.mjs

      - name: Frozen clock lint
        # Fake-now constants (TODAY/AS_OF/NOW with a date or epoch value) that feed
        # comparisons -- the time-decaying-constants audit gate-candidate 1. Scope includes
        # the __proptests__ test layer (audit addendum A3). Ratcheted baseline, counts only
        # go down. Runs here AND in the local preflight suite.
        run: |
          node scripts/lint-frozen-clock.mjs
          node scripts/lint-frozen-clock.test.mjs

      # Makes the executed-digest authoring rule (FV-PBT-FLOOR-BUILD-SPEC.md §4) ENFORCED instead of
      # merely asked-for. A prior diagnosis found floor files across several shards carrying a
      # kernel_digest_at_authoring that was never computed against anything real — the recorded value
      # matched no kernel source, no git revision, no byte variant, on any of them. ⛔ SCOPE IS THE WHOLE
      # TRICK — this must examine ONLY floor files THIS diff touched, never the full floor estate: a floor
      # file legitimately goes stale later when its kernel moves (see check-fv-floor-coverage.mjs's own
      # STALE-state comment), so a full-estate run of this exact check would false-fail on that honest
      # drift. For a file authored in THIS diff, "at authoring" is "now".
      #
      # Filenames are PR-author-controlled, so they never reach a `run:` script as `${{ }}` text — reuses
      # jsdoc-checkjs.yml's exact injection-safe plumbing rather than reinventing it: NUL-delimited
      # `git diff -z`, `mapfile -d ''`, an argv array passed as `"${FILES[@]}"`, never re-joined into a
      # string. Only an integer count crosses via $GITHUB_OUTPUT.
      - name: List floor files touched in this diff
        id: floor-files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          FILE_LIST: ${{ runner.temp }}/touched-floor-files.z
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
            HEAD="$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            BASE="$MERGE_GROUP_BASE_SHA"
            HEAD="$MERGE_GROUP_HEAD_SHA"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_SHA"
          fi
          : > "$FILE_LIST"
          # Incremental-only, same rule as jsdoc-checkjs.yml: an unresolvable BASE must never fall
          # through to a full floor-estate sweep — that's the exact widening the design forbids.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "BASE unresolvable — skipping (scoped-to-diff gate never sweeps the full floor estate)."
          else
            git diff -z --name-only --diff-filter=ACM "$BASE" "$HEAD" -- 'chaingraph/kernels/__proptests__/*.proptest.mjs' > "$FILE_LIST"
          fi
          COUNT=$(tr -cd '\0' < "$FILE_LIST" | wc -c | tr -d '[:space:]')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Verify executed-digest authoring on touched floor files only
        if: steps.floor-files.outputs.count != '0'
        shell: bash
        env:
          FILE_LIST: ${{ runner.temp }}/touched-floor-files.z
        run: |
          set -euo pipefail
          mapfile -d '' -t FILES < "$FILE_LIST"
          FILES=("${FILES[@]/#/./}")
          printf 'Verifying %s touched floor file(s):\n' "${#FILES[@]}"
          printf '  %q\n' "${FILES[@]}"
          node scripts/check-fv-floor-coverage.mjs --verify-authoring "${FILES[@]}"

      - name: No touched floor files
        if: steps.floor-files.outputs.count == '0'
        shell: bash
        run: echo "No floor files changed in this diff — skipping (scoped-to-diff gate, never a full-estate sweep)."

  land-verify-required:
    name: land-verify / required
    # Always-report shape: the check named in the branch ruleset. See
    # scripts-verify.yml's identical reporter job for the full rationale.
    needs: [relevant, land-verify]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report
        env:
          RESULT: ${{ needs.land-verify.result }}
        run: |
          echo "land-verify result: $RESULT"
          if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
            exit 1
          fi
          exit 0

  # GitHub artifact attestations (actions/attest) over the FV artifacts this
  # workflow just gated — chaingraph.json, every *.receipt.json, and the §18
  # compute-proof baseline. Runs only on push to main (needs: land-verify, so
  # it only attests a commit that already passed every gate above) — never on
  # pull_request, where a fork PR cannot hold id-token/attestations write
  # anyway. Calls actions/attest directly (not the thin attest-build-provenance
  # wrapper), full-commit-SHA pinned, with least-privilege permissions scoped
  # to this JOB rather than the whole workflow.
  #
  # Scope honesty: this covers PUBLIC repos only (GitHub's free-plan Sigstore
  # identity). The private prover repo is NOT covered here — that needs a
  # separate signing lane. Provenance is a PROCESS claim ("this workflow, at
  # this commit, produced this artifact") — never a review claim; no copy
  # anywhere may present it as one.
  attest-fv-artifacts:
    name: actions/attest — FV artifact provenance
    needs: land-verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build FV-artifact checksums manifest
        # subject-checksums (not subject-path) so ~300+ receipts + chaingraph.json +
        # the compute-proof baseline become ONE attestation over ONE named batch,
        # rather than one attestation per file. Standard `sha256sum` two-space format,
        # repo-root-relative paths, sorted for a deterministic manifest byte-for-byte.
        shell: bash
        run: |
          set -euo pipefail
          : > fv-artifact-checksums.txt
          sha256sum chaingraph/chaingraph.json scripts/compute-proof-baseline.json \
            >> fv-artifact-checksums.txt
          find chaingraph -name '*.receipt.json' -print0 \
            | sort -z \
            | xargs -0 sha256sum >> fv-artifact-checksums.txt
          echo "Manifest covers $(wc -l < fv-artifact-checksums.txt) FV artifact(s):"
          cat fv-artifact-checksums.txt

      - name: Generate build provenance attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: fv-artifact-checksums.txt

      - name: Fetch trusted root for offline verification
        # gh attestation trusted-root fetches Sigstore's current TUF root ONCE, here, in
        # CI, and writes it to a local file. Every subsequent `gh attestation verify
        # --custom-trusted-root` call — including one run by a maintainer offline, days
        # later, from a downloaded bundle — needs no live TUF/Sigstore network fetch of
        # its own; only the artifact + bundle + this root file — a deterministic
        # offline verifier, not a live service dependency.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation trusted-root > trusted_root.jsonl

      - name: Demonstrate offline verify (representative subject — chaingraph.json)
        # One artifact from the attested batch, verified purely from the downloaded
        # bundle + the trusted-root file fetched above — no attestation lookup over the
        # network. This exact command (see PR body) is what an outside verifier runs
        # against a downloaded bundle + chaingraph.json, offline.
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          gh attestation verify chaingraph/chaingraph.json \
            --bundle "$BUNDLE_PATH" \
            --owner PostOakLabs \
            --custom-trusted-root trusted_root.jsonl
