name: Derived Artifacts Regen

# Move freshness OWNERSHIP of shared derived artifacts from PR branches to main.
#
# WHY THIS EXISTS — two measured incidents on 2026-08-11, one cause:
#   1. MERGE-REF SKEW: three PRs failed `gen-sitemap-html --check` on the merge
#      ref inside 90 minutes while each was locally green.
#   2. SILENT CI REMOVAL (worse): a conflict on these files DELETES the merge
#      ref; a `pull_request` run builds on the merge commit, so GitHub
#      dispatches ZERO CI, and a PR can live its entire life ungated while
#      rendering identical to an all-green PR.
# Both follow from per-branch ownership of files EVERY page-adding shard
# rewrites. This workflow makes main the single writer.
#
# The artifact set, generators and measured skew rates live in ONE place —
# scripts/derived-artifacts.mjs — which preflight.mjs also reads for its
# PR-advisory / main-blocking split. One SSOT, no second enumeration to drift.
#
# chaingraph.json joined this set (COVERED id 'chaingraph-assemble') — a
# single-kernel PR no longer needs a separate hand-staged commit to assemble
# it; this workflow assembles it after merge, exactly like catalogs/sitemap.
# Its generator (assemble-chaingraph.mjs) is also the refusal gate: a node
# removal/rename or any graph/chains/ change makes it leave chaingraph.json
# untouched (a distinct no-write state, not a failure) — those stay a
# separate, explicit hand-assembled commit. Validated against the §15 gate
# suite before staging (see "Validate against the §15 gate suite" step).

on:
  push:
    branches: [ main ]
  # A main-only workflow like this one should be provable end-to-end on a
  # branch before a real push exercises it for the first time — this workflow
  # took four merges to first-run once (chaingraph-assemble is the second
  # thing it now writes, same requirement applies again). dry_run runs every
  # step except the commit/push.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every step except the commit/push; print what would happen'
        type: boolean
        default: true

# Least privilege: the default GITHUB_TOKEN is read-only everywhere in this
# workflow. The push credential is a short-lived GitHub App installation token
# minted in-job (see "Mint push token") — NOT GITHUB_TOKEN. Two reasons, both
# measured 2026-08-16:
#   1. Ruleset `main-ci-anchor` requires the `anchor` check on every push to
#      main and its bypass list cannot contain the built-in Actions app
#      (GitHub: "must be part of the ruleset source or owner organization"), so
#      a GITHUB_TOKEN push is refused with GH013 — run 31961134410. The
#      org-owned `ainumbers-spec-sync` App IS a permitted bypass actor and is
#      the one listed.
#   2. A GITHUB_TOKEN push does not dispatch workflows, which is why the old
#      version needed `actions: write` + a manual `gh workflow run` for the
#      deploy. An App-authored push DOES fire `deploy-to-dreamhost.yml`
#      natively, so that step and that permission are gone.
permissions:
  contents: read

# Never let two regen runs race a push to the same branch. Do NOT cancel a run
# in progress — it may already be mid-push; queue instead.
concurrency:
  group: derived-artifacts-regen
  cancel-in-progress: false

jobs:
  regen:
    name: Regenerate shared derived artifacts
    runs-on: ubuntu-latest
    steps:
      # MINTS A CREDENTIAL. Scoped to this one repo, contents:write only, and
      # it expires with the job. Same App + same action pin as
      # sync-chaingraph-spec.yml; the App must have this repo in its
      # installation's repository list (it does — added 2026-08-16).
      - name: Mint push token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout main
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          # Do NOT persist any credential in .git/config (zizmor: artipacked).
          # The App token is supplied only at push time, exactly as
          # sync-chaingraph-spec.yml does.
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Show the covered set (and what is deliberately excluded)
        run: node scripts/derived-artifacts.mjs

      - name: Regenerate every covered artifact
        # Stops on the first generator failure — a half-regenerated tree must
        # never reach a commit. chaingraph.json is one of the covered
        # artifacts — its generator (assemble-chaingraph.mjs) is itself the
        # refusal gate for out-of-scope diffs: a node removal/rename or a
        # graph/chains/ change makes it print a notice and leave the file
        # untouched (exit 0, not a failure) rather than auto-write something
        # that needs an explicit, reviewed commit instead.
        run: node scripts/derived-artifacts.mjs --regen

      # §15 gate suite validates the regenerated tree BEFORE anything is
      # staged or committed. A red run here stops the job — no commit step
      # executes — so a bad assemble is a visible failed run, never a
      # partial write.
      - name: Validate against the §15 gate suite (SPEC.md conformance)
        run: |
          node chaingraph/standard/schema-validate.mjs
          node chaingraph/standard/spec-version-consistency.mjs
          node chaingraph/standard/spec-gate-coverage.mjs

      - name: Stage by explicit pathspec, and prove nothing escaped the set
        id: stage
        run: |
          set -euo pipefail

          # Explicit pathspec only — never `git add -A`. The pathspec comes from
          # the same SSOT that declares the set, and `--paths` itself exits 1 if
          # any declared artifact is absent from disk (so a phantom entry fails
          # HERE, visibly). Stage one path at a time: `git add` aborts the WHOLE
          # command on a pathspec that matches nothing, and the earlier
          # `--pathspec-from-file ... || true` form swallowed that abort, staged
          # nothing, and made the escape check below misreport every real
          # artifact as escaped (measured 2026-08-16, runs 31957347527/31958761151).
          # (`--ignore-missing` is only valid with --dry-run — it never did anything.)
          node scripts/derived-artifacts.mjs --paths > /tmp/paths.txt
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            git add --ignore-removal -- "$p"
          done < /tmp/paths.txt

          # SELF-CHECK (independent derivation): the declared path set is
          # recomputed against what the regen ACTUALLY wrote. If a generator's
          # output set ever grows, this goes RED rather than silently committing
          # an undeclared file or silently dropping a real one.
          ESCAPED="$(git status --porcelain -- . | grep -E '^( M|\?\?| D)' || true)"
          if [ -n "$ESCAPED" ]; then
            echo "::error title=Undeclared regen output::A generator wrote outside scripts/derived-artifacts.mjs's declared path set. Add it there (or exclude it with a reason) — do not widen the pathspec here."
            echo "$ESCAPED"
            exit 1
          fi

          # LINE-ENDING GUARD. regen_catalog.py writes platform-native endings.
          # On ubuntu that is LF, which is what .gitattributes mandates — but
          # assert it rather than assume, so a CRLF payload can never be
          # auto-committed. (Measured while building this row: the same script
          # run on Windows silently produced CRLF that `git status` normalized
          # away, and only a byte-comparing gate could see it.)
          CRLF_HITS=""
          for f in $(git diff --cached --name-only -- .); do
            if git show ":$f" | grep -qU $'\r'; then
              CRLF_HITS="$CRLF_HITS $f"
            fi
          done
          if [ -n "$CRLF_HITS" ]; then
            echo "::error title=CRLF in regenerated output::A regenerated artifact contains CR bytes; .gitattributes mandates LF:$CRLF_HITS"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ every shared derived artifact already fresh — nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      # Dry-run report: print exactly what the commit step would have staged,
      # then stop — no push, no mutation of main, regardless of the change flag.
      - name: Dry-run report (no commit)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: |
          echo "### Dry run — Derived Artifacts Regen" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.stage.outputs.changed }}" = "true" ]; then
            echo "Would commit and push the following:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing to commit — every covered artifact (including chaingraph.json) is already fresh." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "dry_run=true — commit/push step skipped." >> "$GITHUB_STEP_SUMMARY"

      # ── LOOP GUARD ──────────────────────────────────────────────────────────
      # The push below is App-authored, so it DOES re-trigger this workflow
      # (unlike a GITHUB_TOKEN push). The chain is still bounded — two
      # independent layers, either one alone terminates it:
      #
      # 1. CONVERGENCE: every covered generator was verified idempotent — run
      #    twice against a clean checkout of fresh main, the second pass yields a
      #    zero diff. Two generators FAILED that probe (wall-clock
      #    `generated_at`) and are excluded for exactly this reason; see EXCLUDED
      #    in scripts/derived-artifacts.mjs. So the re-triggered run regenerates
      #    an already-fresh tree and finds nothing to commit.
      # 2. EXPLICIT SKIP (this condition): if the regen produced no diff, the job
      #    stops before committing. This is what implements "skip when the
      #    pushed commit only touched derived artifacts" — such a push is already
      #    fresh BY CONSTRUCTION, so the regen yields no diff. The guard is a
      #    RECOMPUTED property of the tree, not a self-attested marker on the
      #    commit — never trust the artifact's claim about itself.
      #
      # Steady state per real push to main: one regen run that commits, one
      # follow-up regen run that finds zero diff and exits at this step. If a
      # generator ever regresses to non-idempotent, the follow-up commits again
      # and the chain grows — the `concurrency` group serialises it and the
      # commit stream is the visible symptom; fix the generator, do not add
      # loop-breaking markers here.
      - name: Commit and push
        if: steps.stage.outputs.changed == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name  "ainumbers-spec-sync[bot]"
          git config user.email "ainumbers-spec-sync[bot]@users.noreply.github.com"
          # Two -m flags, not one multi-line literal: an unindented continuation
          # line inside `run: |` silently invalidates the whole workflow file
          # (measured 2026-08-16: 11 zero-job failure runs across every branch).
          git commit \
            -m "chore(derived): regenerate shared derived artifacts on main" \
            -m "Automated by .github/workflows/derived-artifacts-regen.yml. main is the single writer for these artifacts; PR branches must not regenerate them. See scripts/derived-artifacts.mjs for the set and its derivation."
          # App-authored push: clears ruleset main-ci-anchor via the App's bypass
          # entry, and fires deploy-to-dreamhost.yml on the new commit natively —
          # no manual dispatch, no `actions: write`. Checkout ran with
          # persist-credentials:false, so supply the token explicitly here only.
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
          SHA="$(git rev-parse HEAD)"
          echo "### Regenerated shared derived artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`$SHA\` pushed to main by the App; deploy-to-dreamhost.yml fires on it natively." >> "$GITHUB_STEP_SUMMARY"
