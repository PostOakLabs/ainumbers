name: Derived Artifacts Regen

# Move freshness OWNERSHIP of shared derived artifacts from PR branches to main.
#
# WHY THIS EXISTS — two measured incidents on 2026-08-11, one cause:
#   1. MERGE-REF SKEW: three PRs failed `gen-sitemap-html --check` on the merge
#      ref inside 90 minutes while each was locally green.
#   2. SILENT CI REMOVAL (worse): a conflict on these files DELETES the merge
#      ref; a `pull_request` run builds on the merge commit, so GitHub
#      dispatches ZERO CI, and a PR can live its entire life ungated while
#      rendering identical to an all-green PR.
# Both follow from per-branch ownership of files EVERY page-adding shard
# rewrites. This workflow makes main the single writer.
#
# The artifact set, generators and measured skew rates live in ONE place —
# scripts/derived-artifacts.mjs — which preflight.mjs also reads for its
# PR-advisory / main-blocking split. One SSOT, no second enumeration to drift.
#
# chaingraph.json joined this set (COVERED id 'chaingraph-assemble') — a
# single-kernel PR no longer needs a separate hand-staged commit to assemble
# it; this workflow assembles it after merge, exactly like catalogs/sitemap.
# Its generator (assemble-chaingraph.mjs) is also the refusal gate. Since
# 2026-08-22 it classifies the diff rather than
# refusing every chain touch: copy-only chain edits (description/title) and
# purely additive new chains auto-land; structural chain edits, chain
# removals/renames and node removals/renames leave chaingraph.json untouched
# and stay a separate, explicit hand-assembled commit. A refusal is NOT a
# silent no-op any more — it emits an ::error annotation and the final step
# below fails the run, because a workflow that declines to act and still
# reports success hid exactly this for 7+ commits. Validated against the §15
# gate suite before staging (see "Validate against the §15 gate suite" step).

on:
  push:
    branches: [ main ]
  # A main-only workflow like this one should be provable end-to-end on a
  # branch before a real push exercises it for the first time — this workflow
  # took four merges to first-run once (chaingraph-assemble is the second
  # thing it now writes, same requirement applies again). dry_run runs every
  # step except the commit/push.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every step except the commit/push; print what would happen'
        type: boolean
        default: true
      # The escape hatch that keeps the mass-delete refusal from becoming a
      # blocker a human cannot clear. A refusal prints the exact deletion list
      # and this number; a human who has read that list re-dispatches with
      # confirm_deletions set to it, authorising exactly that many deletions
      # for exactly that one manual run. The unattended `push: main` path can
      # never reach this input, which is the whole point.
      confirm_deletions:
        description: 'Deletions confirmed intended for THIS manual run (raises the mass-delete refusal ceiling). Leave 0 unless you have read a refused path list.'
        type: string
        default: '0'
      # SELF-TEST HARNESS. See the "Self-test" step for why it exists and why
      # it cannot leak into main.
      self_test:
        description: 'SELF-TEST ONLY — mutate the regenerated tree to exercise a staging guard. Hard-blocks the commit/push step.'
        type: choice
        default: 'off'
        options:
          - 'off'
          - 'okf_pair_deletion'
          - 'mass_delete'
          - 'mass_modify'
          - 'undeclared_escape'

# Least privilege: the default GITHUB_TOKEN is read-only everywhere in this
# workflow. The push credential is a short-lived GitHub App installation token
# minted in-job (see "Mint push token") — NOT GITHUB_TOKEN. Two reasons, both
# measured 2026-08-16:
#   1. Ruleset `main-ci-anchor` requires the `anchor` check on every push to
#      main and its bypass list cannot contain the built-in Actions app
#      (GitHub: "must be part of the ruleset source or owner organization"), so
#      a GITHUB_TOKEN push is refused with GH013 — run 31961134410. The
#      org-owned `ainumbers-spec-sync` App IS a permitted bypass actor and is
#      the one listed.
#   2. A GITHUB_TOKEN push does not dispatch workflows, which is why the old
#      version needed `actions: write` + a manual `gh workflow run` for the
#      deploy. An App-authored push DOES fire `deploy-to-dreamhost.yml`
#      natively, so that step and that permission are gone.
permissions:
  contents: read

# Never let two regen runs race a push to the same branch. Do NOT cancel a run
# in progress — it may already be mid-push; queue instead.
concurrency:
  group: derived-artifacts-regen
  cancel-in-progress: false

jobs:
  regen:
    name: Regenerate shared derived artifacts
    runs-on: ubuntu-latest
    steps:
      # MINTS A CREDENTIAL. Scoped to this one repo, contents:write only, and
      # it expires with the job. Same App + same action pin as
      # sync-chaingraph-spec.yml; the App must have this repo in its
      # installation's repository list (it does — added 2026-08-16).
      - name: Mint push token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout main
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # fetch-depth: 0 is REQUIRED, not a preference. gen-debt-ledger.mjs reads
          # per-file commit dates via `git log -1 -- <file>`. On a shallow clone that
          # returns the single fetched commit's date for every file, so the bot writes
          # today's date into every row, while scripts-verify (fetch-depth: 0) reads the
          # real dates and correctly calls the page stale. Writer and checker then
          # disagree BY CONSTRUCTION: the bot regenerates the same degraded bytes, sees
          # zero drift, skips its commit, and the gate can never go green on any push.
          # That deadlocked main on 2026-08-21 and ejected every queued PR.
          # Any generator added to the covered set that reads git history needs this too.
          fetch-depth: 0
          # Do NOT persist any credential in .git/config (zizmor: artipacked).
          # The App token is supplied only at push time, exactly as
          # sync-chaingraph-spec.yml does.
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Show the covered set (and what is deliberately excluded)
        run: node scripts/derived-artifacts.mjs

      # Runs BEFORE the regen, on purpose. If a generator that a node
      # registration can turn stale is declared in neither the covered nor the
      # excluded list, this job regenerates an incomplete set, pushes, and leaves
      # main red anyway — which happened three times on 2026-08-21 (art-661,
      # art-664, art-665). Each of those reds also failed the merge queue's
      # simulated-merge check, which silently ejects every queued PR. Fail here,
      # naming the unclassified generator, rather than after a misleading green
      # regen. Same command scripts/preflight.mjs runs, so a branch cannot merge
      # into a state this job then rejects.
      - name: Prove the node fan-out classification is total
        run: node scripts/check-derived-fanout-coverage.mjs

      - name: Regenerate every covered artifact
        # Stops on the first generator failure — a half-regenerated tree must
        # never reach a commit. chaingraph.json is one of the covered
        # artifacts — its generator (assemble-chaingraph.mjs) is itself the
        # refusal gate for out-of-scope diffs: a node removal/rename, a chain
        # removal/rename, or a structural chain edit makes it print an ::error
        # annotation and leave the file untouched rather than auto-write
        # something that needs an explicit, reviewed commit instead. It exits 0
        # even then, ON PURPOSE, so a refusal does not abort the other
        # generators here and leave every shared artifact stale; the run is
        # failed instead by the final --refusal-status step.
        run: node scripts/derived-artifacts.mjs --regen

      # §15 gate suite validates the regenerated tree BEFORE anything is
      # staged or committed. A red run here stops the job — no commit step
      # executes — so a bad assemble is a visible failed run, never a
      # partial write.
      - name: Validate against the §15 gate suite (SPEC.md conformance)
        run: |
          node chaingraph/standard/schema-validate.mjs
          node chaingraph/standard/spec-version-consistency.mjs
          node chaingraph/standard/spec-gate-coverage.mjs

      # READER-FACING COPY. The §15 suite above validates schema and spec
      # conformance and never reads the regenerated PROSE — but many covered
      # artifacts are reader-facing pages (fv-explainer.html, index.html,
      # sitemap.html, tools.html, start.html, llms.txt). A generator emitting
      # copy that violates CONTRACT.md §1.4 therefore had it auto-committed from
      # here, with no pull request in between and no gate that could catch it.
      #
      # Not hypothetical. On 2026-08-21 a newly-landed ratchet baseline file was
      # the first input ever to reach gen-debt-ledger.mjs's fallbackExtract(),
      # whose description string carried an em-dash; that string renders inside
      # fv-explainer.html, this job committed it, and main went red on
      # copy-hallmarks. A red main fails the merge queue's simulated-merge
      # check, which silently ejects every queued pull request — so one bad
      # generated string stalls everyone's merges, not merely this job.
      #
      # THE TRADE-OFF, STATED PLAINLY: a refused commit leaves a derived
      # artifact stale and loudly flagged. That is strictly better than
      # publishing bad copy. Stale costs one visible failed run that names the
      # generator; published bad copy reds the default branch and ejects the
      # queue until a human notices.
      #
      # Both checks are pure in-repo source scans: no network, no git history,
      # no clock, and no workspace-root read on this path (check-copy-hallmarks
      # touches those only under --report, deliberately not used here). Measured
      # 111-129 ms with byte-identical output across repeated runs, so neither
      # can make this job flaky.
      - name: Validate the regenerated reader-facing copy (CONTRACT.md §1.4)
        run: |
          node scripts/check-copy-hallmarks.mjs
          node scripts/check-shipped-prose.mjs

      # ── SELF-TEST HARNESS (workflow_dispatch only; can never commit) ──────
      # SO #34: "verify a checker by MUTATION, not by reading it", and SO #34c:
      # a gate that has only ever been observed green has not been observed at
      # all. Every guard in the staging step below — the undeclared-path escape
      # check, and the mass-delete refusal added with it — fires only on a
      # broken generator, so on a healthy tree they are unobservable. SO #40(a)
      # requires this workflow to be exercised end-to-end on a branch before a
      # merge, and there is otherwise no way to exercise the failure paths.
      #
      # This step mutates the freshly-regenerated tree so each guard can be
      # driven from Actions > Run workflow. It runs AFTER the §15 and copy
      # gates on purpose: those validate what the generators actually produced,
      # and must not be scored against a deliberately corrupted tree.
      #
      # It cannot reach main: it is workflow_dispatch-only, and the commit/push
      # step below is hard-gated off whenever self_test is not 'off' — so even
      # a below-threshold self-test deletion with dry_run=false commits nothing.
      - name: Self-test — mutate the regenerated tree (never commits)
        if: github.event_name == 'workflow_dispatch' && inputs.self_test != 'off'
        env:
          SELF_TEST: ${{ inputs.self_test }}
        run: |
          set -euo pipefail
          # Written to a file rather than piped into `head`: under `pipefail` a
          # closed pipe would fail the whole step on a large file list.
          git ls-files -- chaingraph/okf/tools > /tmp/st-okf-tools.txt
          case "$SELF_TEST" in
            okf_pair_deletion)
              # GREEN control — the exact art-99 shape. A node leaving service
              # makes generate-okf.mjs drop chaingraph/okf/{tools,computations}/
              # <tool_id>.md, which is what PR #1479 exists to let through.
              # art-99's own pair cannot be re-deleted (aebca55e already removed
              # it from main), so replay the identical shape and count against a
              # live node.
              ID="$(basename "$(head -1 /tmp/st-okf-tools.txt)" .md)"
              rm -f "chaingraph/okf/tools/$ID.md" "chaingraph/okf/computations/$ID.md"
              echo "self-test: deleted the okf pair for $ID — 2 declared deletions, the art-99 count."
              ;;
            mass_delete)
              # RED control — a generator dropping a slice of its own output.
              head -40 /tmp/st-okf-tools.txt > /tmp/st-del.txt
              xargs -r rm -f < /tmp/st-del.txt
              echo "self-test: deleted 40 declared okf pages."
              ;;
            mass_modify)
              # Modifications are NOT the hazard and are deliberately not
              # thresholded — prove a wide modification still commits.
              head -40 /tmp/st-okf-tools.txt > /tmp/st-mod.txt
              while IFS= read -r f; do
                printf '\n<!-- self-test -->\n' >> "$f"
              done < /tmp/st-mod.txt
              echo "self-test: modified 40 declared okf pages, deleted none."
              ;;
            undeclared_escape)
              # #1479's escape check must still fire on a genuinely undeclared
              # write. This row must not weaken it.
              printf 'self-test\n' > chaingraph/UNDECLARED-SELFTEST.txt
              echo "self-test: wrote chaingraph/UNDECLARED-SELFTEST.txt, outside the declared set."
              ;;
          esac

      - name: Stage by explicit pathspec, and prove nothing escaped the set
        id: stage
        run: |
          set -euo pipefail

          # Explicit pathspec only — never `git add -A`. The pathspec comes from
          # the same SSOT that declares the set, and `--paths` itself exits 1 if
          # any declared artifact is absent from disk (so a phantom entry fails
          # HERE, visibly). Stage one path at a time: `git add` aborts the WHOLE
          # command on a pathspec that matches nothing, and the earlier
          # `--pathspec-from-file ... || true` form swallowed that abort, staged
          # nothing, and made the escape check below misreport every real
          # artifact as escaped (measured 2026-08-16, runs 31957347527/31958761151).
          # (`--ignore-missing` is only valid with --dry-run — it never did anything.)
          #
          # `--ignore-removal` REMOVED 2026-08-22. It made a generator's legitimate
          # DELETION unstageable: a node leaving service (art-99 → deprecated) makes
          # generate-okf.mjs delete chaingraph/okf/{tools,computations}/<tool_id>.md,
          # those paths ARE declared (derived-artifacts.mjs id:'okf', writes:
          # ['chaingraph/okf']), but --ignore-removal skipped them, so they survived
          # as ` D` and the escape self-check below reported a DECLARED deletion as
          # "undeclared regen output". That disabled the single writer that repairs
          # the count sentinels, so one non-live node reddened four main workflows
          # (Derived Artifacts Regen, Scripts Verify, Land Verify, Deploy): a single
          # undeclared-looking write path cascades into every downstream surface that
          # depends on this job having committed. Measured on run 32605372977; the two escaped
          # entries were exactly art-99's okf pair. Plain `git add -- <path>` stages
          # modifications AND deletions within the declared pathspec, which is the
          # invariant this step actually wants: the SET is what is declared, not the
          # direction of change. Undeclared paths still trip the check below, because
          # nothing outside the pathspec is ever staged.
          node scripts/derived-artifacts.mjs --paths > /tmp/paths.txt
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            git add -- "$p"
          done < /tmp/paths.txt

          # SELF-CHECK (independent derivation): the declared path set is
          # recomputed against what the regen ACTUALLY wrote. If a generator's
          # output set ever grows, this goes RED rather than silently committing
          # an undeclared file or silently dropping a real one.
          ESCAPED="$(git status --porcelain -- . | grep -E '^( M|\?\?| D)' || true)"
          if [ -n "$ESCAPED" ]; then
            echo "::error title=Undeclared regen output::A generator wrote outside scripts/derived-artifacts.mjs's declared path set. Add it there (or exclude it with a reason) — do not widen the pathspec here."
            echo "$ESCAPED"
            exit 1
          fi

          # LINE-ENDING GUARD. regen_catalog.py writes platform-native endings.
          # On ubuntu that is LF, which is what .gitattributes mandates — but
          # assert it rather than assume, so a CRLF payload can never be
          # auto-committed. (Measured while building this row: the same script
          # run on Windows silently produced CRLF that `git status` normalized
          # away, and only a byte-comparing gate could see it.)
          CRLF_HITS=""
          for f in $(git diff --cached --name-only -- .); do
            if git show ":$f" | grep -qU $'\r'; then
              CRLF_HITS="$CRLF_HITS $f"
            fi
          done
          if [ -n "$CRLF_HITS" ]; then
            echo "::error title=CRLF in regenerated output::A regenerated artifact contains CR bytes; .gitattributes mandates LF:$CRLF_HITS"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ every shared derived artifact already fresh — nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      # ── MASS-DELETE REFUSAL ───────────────────────────────────────────────
      # WHY THIS EXISTS — it is the second half of PR #1479's invariant.
      # #1479 removed `git add --ignore-removal` from the staging step above
      # because it made a LEGITIMATE deletion unstageable: art-99 went
      # deprecated, generate-okf.mjs correctly dropped its two OKF pages, those
      # paths ARE declared, and the escape check still reported them as
      # "undeclared regen output" — which disabled the single writer that
      # repairs the count sentinels and reddened four main workflows.
      #
      # That fix opened a new door. This bot commits UNATTENDED, on main, with
      # an App token. Before #1479 a generator bug that dropped its whole
      # output set could not auto-commit the deletions; now it can. So
      # deletions above a small threshold get a loud REFUSED rather than an
      # auto-commit — the same shape as the assembler's refusal at the bottom
      # of this file: a refusal is never a silent green.
      #
      # It runs on the dry-run path too, so a workflow_dispatch dry run
      # exercises it instead of stopping short of it, and it runs BEFORE the
      # commit step so a refusal means nothing was committed and nothing was
      # pushed — this step failing aborts the job.
      - name: Refuse a mass deletion
        env:
          # THE THRESHOLD, CHOSEN FROM DATA — measured on origin/main @ 34cd823a.
          #
          # Blast radius: the declared path set expands to 2,621 tracked files
          #   (chaingraph/okf 1,318 · chaingraph/register 640 ·
          #    registry/kernel 623 · fv-status 1 · 39 single-file paths).
          #   That is what a runaway generator can delete in one unattended run.
          #
          # Observed history: across 101 bot commits this workflow has committed
          #   ZERO deletions — `git log --author=ainumbers-spec-sync
          #   --diff-filter=D` is empty — because --ignore-removal suppressed
          #   them until 2026-08-22. The entire deletion history INSIDE the
          #   declared set is a single root cause, art-99 leaving service, landed
          #   by hand in three PRs: aebca55e (#1479) 2 okf pages, 4daa8b6f
          #   (#1480) 1 registry/kernel entry, bec907ed (#1486) 1 register entry.
          #
          # Per-node arity: one node leaving service therefore drops FOUR
          #   declared files. Corroborated by the corpus rather than by reading
          #   the generators: 640 okf/tools = 640 okf/computations = 640
          #   register entries, and 623 registry/kernel entries for the proven
          #   subset.
          #
          # 12 = three simultaneous node deprecations (3 x 4), against an
          #   observed maximum of one. Deliberately generous at the bottom so an
          #   ordinary deprecation never needs a human — a guard that fires on
          #   routine work is a guard that gets bypassed — and still only 0.46%
          #   of the 2,621-file blast radius, so every real mass-delete shape (a
          #   dropped output directory is 623-1,318 files) sits orders of
          #   magnitude above it.
          #
          # Modifications are deliberately NOT thresholded: a healthy regen
          # rewrites dozens of files every run, so deletion is the asymmetric,
          # hard-to-notice direction.
          MAX_STAGED_DELETIONS: '12'
          # Empty on a `push: main` run — the inputs context does not exist
          # there — so the unattended path always uses the constant above.
          CONFIRMED: ${{ inputs.confirm_deletions }}
        run: |
          set -euo pipefail

          # INDEPENDENT DERIVATION (SO #34): recount from the INDEX itself,
          # never from the staging step's own report of what it did.
          # -M pins rename detection explicitly rather than inheriting
          # diff.renames from repo config: a re-proved kernel that moves
          # registry/kernel/<digest>.json is a rename, not a deletion.
          git diff --cached -M --diff-filter=D --name-only -- . > /tmp/staged-deletions.txt
          DEL_COUNT="$(wc -l < /tmp/staged-deletions.txt)"
          DEL_COUNT="${DEL_COUNT// /}"

          CEILING="$MAX_STAGED_DELETIONS"
          case "$CONFIRMED" in ''|*[!0-9]*) CONFIRMED=0 ;; esac
          if [ "$CONFIRMED" -gt "$CEILING" ]; then
            CEILING="$CONFIRMED"
            echo "::notice title=Deletion ceiling raised by hand::A human dispatched this run with confirm_deletions=$CONFIRMED, authorising up to that many deletions for this run only."
          fi

          echo "staged deletions: $DEL_COUNT   (refusal threshold: more than $CEILING)"

          if [ "$DEL_COUNT" -le "$CEILING" ]; then
            if [ "$DEL_COUNT" -gt 0 ]; then
              echo "OK — $DEL_COUNT staged deletion(s), at or below the threshold; the commit step proceeds normally:"
              cat /tmp/staged-deletions.txt
            else
              echo "OK — no staged deletions."
            fi
            exit 0
          fi

          PATHS="$(head -20 /tmp/staged-deletions.txt | tr '\n' ' ')"
          {
            echo "### REFUSED — mass deletion"
            echo ""
            echo "$DEL_COUNT staged deletions exceed the ceiling of $CEILING. **Nothing was committed and nothing was pushed.**"
            echo ""
            echo '```'
            cat /tmp/staged-deletions.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error title=REFUSED: mass deletion ($DEL_COUNT staged deletions, ceiling $CEILING)::The regen staged $DEL_COUNT deletions inside the declared artifact set. This run committed NOTHING and pushed NOTHING. First paths: $PATHS (full list in this step's log and in the job summary). WHAT TO DO: (1) read that list; (2) if a generator is wrongly dropping output it should still be writing, fix the generator under scripts/ and re-run — do NOT raise MAX_STAGED_DELETIONS to make the run pass; (3) if the deletions really are intended, because that many nodes or chains genuinely left service, re-run this workflow by hand from Actions > Derived Artifacts Regen > Run workflow with dry_run=false and confirm_deletions=$DEL_COUNT, which authorises exactly this many deletions for that single run."
          cat /tmp/staged-deletions.txt
          exit 1

      # Dry-run report: print exactly what the commit step would have staged,
      # then stop — no push, no mutation of main, regardless of the change flag.
      #
      # ⚠ A dry-run that never exercises a newly-added write is NOT evidence, and
      # "nothing to commit" is the shape that hides exactly that: a change adding
      # a new write once passed its dry-run green because the run never reached
      # the new step, and the undeclared write then killed the regen job on main.
      # So the report always ENUMERATES the declared coverage — every generator
      # and every path it is permitted to write — whether or not anything
      # drifted. A reader can name the file a new entry covers instead of
      # inferring it from an empty diff.
      - name: Dry-run report (no commit)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        env:
          STAGE_CHANGED: ${{ steps.stage.outputs.changed }}
        run: |
          echo "### Dry run — Derived Artifacts Regen" >> "$GITHUB_STEP_SUMMARY"
          if [ "$STAGE_CHANGED" = "true" ]; then
            echo "Would commit and push the following:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing to commit — every covered artifact (including chaingraph.json) is already fresh." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### Declared coverage exercised by this run" >> "$GITHUB_STEP_SUMMARY"
          echo "Every generator below RAN in the regen step above; every path below is what the" >> "$GITHUB_STEP_SUMMARY"
          echo "staging step is permitted to commit. A generator writing outside its own lines" >> "$GITHUB_STEP_SUMMARY"
          echo "fails the escape self-check, not this report." >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node scripts/derived-artifacts.mjs >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "dry_run=true — commit/push step skipped." >> "$GITHUB_STEP_SUMMARY"

      # ── LOOP GUARD ──────────────────────────────────────────────────────────
      # The push below is App-authored, so it DOES re-trigger this workflow
      # (unlike a GITHUB_TOKEN push). The chain is still bounded — two
      # independent layers, either one alone terminates it:
      #
      # 1. CONVERGENCE: every covered generator was verified idempotent — run
      #    twice against a clean checkout of fresh main, the second pass yields a
      #    zero diff. Two generators FAILED that probe (wall-clock
      #    `generated_at`) and are excluded for exactly this reason; see EXCLUDED
      #    in scripts/derived-artifacts.mjs. So the re-triggered run regenerates
      #    an already-fresh tree and finds nothing to commit.
      # 2. EXPLICIT SKIP (this condition): if the regen produced no diff, the job
      #    stops before committing. This is what implements "skip when the
      #    pushed commit only touched derived artifacts" — such a push is already
      #    fresh BY CONSTRUCTION, so the regen yields no diff. The guard is a
      #    RECOMPUTED property of the tree, not a self-attested marker on the
      #    commit — never trust the artifact's claim about itself.
      #
      # Steady state per real push to main: one regen run that commits, one
      # follow-up regen run that finds zero diff and exits at this step. If a
      # generator ever regresses to non-idempotent, the follow-up commits again
      # and the chain grows — the `concurrency` group serialises it and the
      # commit stream is the visible symptom; fix the generator, do not add
      # loop-breaking markers here.
      #
      # The third clause is the self-test containment: a deliberately corrupted
      # tree must never reach main, not even when the corruption is small enough
      # to pass the mass-delete refusal above.
      - name: Commit and push
        if: steps.stage.outputs.changed == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) && !(github.event_name == 'workflow_dispatch' && inputs.self_test != 'off')
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name  "ainumbers-spec-sync[bot]"
          git config user.email "ainumbers-spec-sync[bot]@users.noreply.github.com"
          # Two -m flags, not one multi-line literal: an unindented continuation
          # line inside `run: |` silently invalidates the whole workflow file
          # (measured 2026-08-16: 11 zero-job failure runs across every branch).
          git commit \
            -m "chore(derived): regenerate shared derived artifacts on main" \
            -m "Automated by .github/workflows/derived-artifacts-regen.yml. main is the single writer for these artifacts; PR branches must not regenerate them. See scripts/derived-artifacts.mjs for the set and its derivation."
          # App-authored push: clears ruleset main-ci-anchor via the App's bypass
          # entry, and fires deploy-to-dreamhost.yml on the new commit natively —
          # no manual dispatch, no `actions: write`. Checkout ran with
          # persist-credentials:false, so supply the token explicitly here only.
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
          SHA="$(git rev-parse HEAD)"
          echo "### Regenerated shared derived artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`$SHA\` pushed to main by the App; deploy-to-dreamhost.yml fires on it natively." >> "$GITHUB_STEP_SUMMARY"

      # ── THE RUN'S CONCLUSION MUST NOT READ GREEN ON A NO-WRITE ────────────
      # assemble-chaingraph.mjs can DECLINE to write chaingraph.json — a
      # structural chain edit, a chain removal/rename, or a node removal/rename
      # still needs a human ASSEMBLE/LAND row. Until 2026-08-22 that refusal
      # printed a notice and exited 0, so this workflow reported SUCCESS on 7+
      # consecutive commits while writing nothing, and main sat red on a 2-byte
      # wording drift with no run conclusion pointing at the cause. A workflow
      # that can refuse and still report success turns a loud failure into an
      # invisible one.
      #
      # This step is LAST, and deliberately not folded into the regen step
      # above: derived-artifacts.mjs --regen stops at the first non-zero
      # generator, so failing there would leave every OTHER shared artifact
      # stale too. Everything auto-landable is regenerated and committed first;
      # then this decides whether the run may be called a success. It
      # RECOMPUTES the classification from the shards — it never reads the write
      # step's own claim about what it did — and exits 3, with an ::error
      # annotation naming each refused chain/node, when anything was refused.
      #
      # It runs on the dry-run path too (the commit step is skipped, not
      # failed), so a workflow_dispatch dry run exercises this step rather than
      # stopping short of it. A dry run that never reaches a newly added step
      # is not evidence that the step works.
      - name: Fail the run if the assembler refused to write
        run: node scripts/assemble-chaingraph.mjs --refusal-status
