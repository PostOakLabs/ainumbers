name: Cross-Engine Parity

# Verifies that kernel compute() outputs are byte-identical across V8 (Node),
# Bun, and QuickJS-ng (the §18 zkVM guest engine). Divergence = a finding for
# the kernel owner: the kernel may need fdlibm-pinning or a range guard.
#
# NO schedule — runs per push/PR only (push-gated, not time-gated).
# Runtime versions are PINNED. Update them deliberately; a version bump is an
# intentional decision, not a routine housekeeping task.
#
# QuickJS binary: downloaded from the pinned release, sha256-verified.
# To update: download the new binary, run sha256sum, update QJS_SHA256 below.

on:
  push:
    branches: [ main ]
    paths:
      - 'chaingraph/kernels/**.kernel.mjs'
      - 'chaingraph/kernels/fixtures/**'
      - 'scripts/check-engine-parity.mjs'
      - '.github/workflows/cross-engine-parity.yml'
  pull_request:
    # ready_for_review added (DRAFTCI-3, 2026-07-20): draft PRs are skipped
    # below, so a readied draft must trigger a fresh run or it could merge
    # with no checks. Default types kept explicit alongside it.
    #
    # converted_to_draft added (2026-08-30): a PR opened
    # non-draft that goes RED by design, then converted to draft AFTER the
    # run already failed, kept the stale red forever — nothing re-dispatched
    # this workflow on that transition. Measured on PR #1584: opened
    # 13:44:08Z, run failed by 13:44:33Z, converted_to_draft 13:54:49Z, red
    # check untouched afterward. This re-fires the workflow on that exact
    # transition so the draft==false skip below supersedes the stale red.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'chaingraph/kernels/**.kernel.mjs'
      - 'chaingraph/kernels/fixtures/**'
      - 'scripts/check-engine-parity.mjs'
      - '.github/workflows/cross-engine-parity.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push/synchronize on the same PR ref supersedes its prior
  # in-progress run (2026-08-30) — letting the stale one
  # finish is redundant CI time, not lost coverage. Also cancels a stale
  # push:main run: derived-artifacts-regen.yml commits a regen fix-up on
  # the same `github.ref` shortly after most human pushes to main, and
  # this workflow has no push-only downstream job depending on it — so the
  # newer commit's run fully supersedes the older one. Measured 2026-08-30
  # run 33315676452: scripts-verify.yml's own push run stayed red on stale
  # derived artifacts (debt-ledger) for 9 minutes while the regen bot's
  # own push, 36s later, produced a clean green run for the same ref; same
  # race shape hits every workflow gating a COVERED derived artifact on
  # push:main. No merge_group trigger on this workflow, so no queue-safety
  # carve-out is needed.
  cancel-in-progress: true

permissions:
  contents: read

env:
  # --- PINNED RUNTIME VERSIONS ---
  # Node: matches the site deploy workflow (ubuntu-latest runner default LTS)
  NODE_VERSION: '20'
  # Bun: pin a specific release; update deliberately
  BUN_VERSION: '1.2.18'
  # QuickJS-ng: linux-x86_64 static binary from the pinned release
  QJS_VERSION: '0.9.0'
  # sha256 of the downloaded qjs binary — the "Verify QuickJS binary sha256"
  # step below recomputes it with sha256sum and fails the job on mismatch.
  #
  # PROVENANCE (2026-08-23) — recorded because a pin whose origin is unstated
  # is just another placeholder, not a control. This digest was
  # computed from the artifact THIS workflow downloads (the release asset at
  # the QJS_VERSION URL used by the download step below), never from a mirror
  # and never from documentation. Method: fetched
  #   https://github.com/quickjs-ng/quickjs/releases/download/v0.9.0/qjs-linux-x86_64
  # twice; both fetches were byte-identical (cmp) at 2,183,896 bytes, which is
  # the size GitHub's release API reports for that asset; hashed with sha256sum
  # and again with node crypto, which agreed. The bytes are an ELF 64-bit
  # x86-64 image (7f 45 4c 46 02 01, e_machine 0x3e), so what was hashed is the
  # binary itself and not an error page. GitHub's own asset digest field is
  # null for this asset (uploaded 2025-03-08, before that field existed), so
  # local recomputation is the only primary source.
  #
  # To update on a version bump: download the new binary from the release URL
  # this workflow uses, run sha256sum, paste the result here, and record how
  # you obtained it. This is the check that prevents supply-chain substitution.
  QJS_SHA256: 'b3113dd1cc6f2c05edfa4263b79d3b01cb8755bad29d7528b5b92b0ce83b894e'

jobs:
  parity:
    name: Kernel parity — ${{ matrix.engine }}
    # DRAFTCI-3 (2026-07-20): expected-red shard/kernel PRs open as drafts by
    # doctrine (they ride the next assemble-and-land regeneration step).
    # GitHub still runs pull_request
    # workflows on drafts, so those PRs showed a red X despite the draft
    # rule — the red carried no information. Skip drafts; the run fires on
    # ready_for_review and the push-to-main trigger remains the backstop.
    # `compare` (needs: parity) is skipped automatically when this is.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        engine: [node, bun, quickjs]
      fail-fast: false  # run all three even if one fails; report all divergences

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # ── Node ──────────────────────────────────────────────────────────────
      - name: Setup Node ${{ env.NODE_VERSION }}
        if: matrix.engine == 'node'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run parity (Node)
        if: matrix.engine == 'node'
        run: node scripts/check-engine-parity.mjs --out parity-node.json

      # ── Bun ───────────────────────────────────────────────────────────────
      - name: Setup Bun ${{ env.BUN_VERSION }}
        if: matrix.engine == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Run parity (Bun)
        if: matrix.engine == 'bun'
        run: bun run scripts/check-engine-parity.mjs --out parity-bun.json

      # ── QuickJS-ng ────────────────────────────────────────────────────────
      - name: Setup Node (bundle generator for QuickJS)
        if: matrix.engine == 'quickjs'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download QuickJS-ng v${{ env.QJS_VERSION }} (pinned)
        if: matrix.engine == 'quickjs'
        run: |
          curl -fsSL \
            "https://github.com/quickjs-ng/quickjs/releases/download/v${{ env.QJS_VERSION }}/qjs-linux-x86_64" \
            -o ./qjs
          chmod +x ./qjs

      - name: Verify QuickJS binary sha256
        if: matrix.engine == 'quickjs'
        run: |
          ACTUAL=$(sha256sum ./qjs | awk '{print $1}')
          EXPECTED="${{ env.QJS_SHA256 }}"
          if [ "$EXPECTED" = "PLACEHOLDER_REPLACE_AFTER_FIRST_DOWNLOAD" ]; then
            echo "⚠  QJS_SHA256 is a placeholder — record the actual value:"
            echo "   $ACTUAL"
            echo "   Update env.QJS_SHA256 in this workflow and re-run."
            # Allow first run through (so you can capture the sha256) but warn loudly.
            # Change 'echo' to 'exit 1' once the real sha256 is recorded.
          elif [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "✗ QuickJS binary sha256 mismatch! Supply-chain integrity check FAILED."
            echo "  expected: $EXPECTED"
            echo "  actual:   $ACTUAL"
            exit 1
          else
            echo "✓ QuickJS binary sha256 verified."
          fi

      - name: Generate self-contained bundle for QuickJS
        if: matrix.engine == 'quickjs'
        run: node scripts/check-engine-parity.mjs --bundle parity-bundle.js

      - name: Run parity (QuickJS-ng)
        if: matrix.engine == 'quickjs'
        run: ./qjs parity-bundle.js > parity-quickjs.json

      # ── Upload manifests for the compare job ──────────────────────────────
      - name: Upload manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parity-${{ matrix.engine }}
          path: |
            parity-node.json
            parity-bun.json
            parity-quickjs.json
          if-no-files-found: ignore

  compare:
    name: Compare manifests (fail on divergence)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: parity
    steps:
      - name: Download all manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: parity-*
          merge-multiple: true

      - name: Diff Node vs Bun
        id: diff_bun
        run: |
          # ASYNC_KERNEL / NOT_RUNNABLE entries are expected engine-capability findings,
          # not hash divergences. Strip them before diffing so they don't block CI.
          node -e "
            const a=JSON.parse(require('fs').readFileSync('parity-node.json','utf8'));
            const b=JSON.parse(require('fs').readFileSync('parity-bun.json','utf8'));
            const skip=v=>typeof v==='string'&&(v.startsWith('ASYNC_KERNEL')||v.startsWith('NOT_RUNNABLE'));
            for(const k of Object.keys(a)){for(const v of Object.keys(a[k]||{})){if(skip(a[k][v])||skip((b[k]||{})[v])){delete a[k][v];if(b[k])delete b[k][v];}}}
            require('fs').writeFileSync('parity-node-cmp.json',JSON.stringify(a,null,2));
            require('fs').writeFileSync('parity-bun-cmp.json',JSON.stringify(b,null,2));
          "
          if diff -u parity-node-cmp.json parity-bun-cmp.json; then
            echo "bun_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "bun_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Diff Node vs QuickJS
        id: diff_qjs
        run: |
          # ASYNC_KERNEL / NOT_RUNNABLE entries are expected engine-capability findings.
          # Strip them before diffing; log them as informational findings instead.
          node -e "
            const a=JSON.parse(require('fs').readFileSync('parity-node.json','utf8'));
            const q=JSON.parse(require('fs').readFileSync('parity-quickjs.json','utf8'));
            const skip=v=>typeof v==='string'&&(v.startsWith('ASYNC_KERNEL')||v.startsWith('NOT_RUNNABLE'));
            const findings=[];
            for(const k of Object.keys(q)){for(const v of Object.keys(q[k]||{})){if(skip(q[k][v])){findings.push(k+'/'+v+': '+q[k][v]);delete(q[k]||{})[v];if(a[k])delete a[k][v];}}}
            if(findings.length){console.log('QuickJS engine-capability findings ('+findings.length+'):');findings.forEach(f=>console.log('  '+f));}
            require('fs').writeFileSync('parity-node-qjs-cmp.json',JSON.stringify(a,null,2));
            require('fs').writeFileSync('parity-qjs-cmp.json',JSON.stringify(q,null,2));
          "
          if diff -u parity-node-qjs-cmp.json parity-qjs-cmp.json; then
            echo "qjs_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "qjs_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report and gate
        env:
          BUN_OK: ${{ steps.diff_bun.outputs.bun_ok }}
          QJS_OK: ${{ steps.diff_qjs.outputs.qjs_ok }}
        run: |
          if [ "$BUN_OK" = "true" ] && [ "$QJS_OK" = "true" ]; then
            echo "✓ All three engines produce byte-identical manifests."
            exit 0
          fi

          echo "✗ ENGINE PARITY FAILURE — divergent execution_hash preimage detected."
          echo ""
          echo "This means at least one kernel's compute() produces different output"
          echo "in different JS engines. This is a FINDING, not an auto-fix."
          echo ""
          echo "Next steps for the kernel owner:"
          echo "  1. Identify the diverging kernel(s) from the diff above."
          echo "  2. Check if the kernel uses transcendental Math (log/exp/sin/etc)."
          echo "     If so, add it to scripts/kernel-determinism-allowlist.json and"
          echo "     verify that the §18 zkVM guest (QuickJS-ng, ImageID a1a0bc89)"
          echo "     produces the same output as Node for your fixture inputs."
          echo "  3. If the divergence is in pure integer/string logic, it is a bug —"
          echo "     fix the kernel to produce identical output across engines."
          echo "  4. Do NOT silently patch the fixture hashes to match one engine."
          echo ""

          if [ "$BUN_OK" != "true" ]; then
            echo "FAILED: Node vs Bun (V8 engines should be identical — this is a bug)"
          fi
          if [ "$QJS_OK" != "true" ]; then
            echo "FAILED: Node vs QuickJS-ng (check transcendental allowlist and §18 guest)"
          fi

          exit 1

  # Sentinel: confirm no schedule: trigger is present in this workflow.
  # If someone adds a cron schedule, this grep would catch it in review.
  # (The grep runs the check itself — no separate step needed; the lack of
  # 'schedule:' in this file's 'on:' block is the invariant.)
  no-schedule-sentinel:
    name: Confirm no schedule trigger
    # DRAFTCI-3 (2026-07-20): same draft-skip rationale as `parity` above —
    # this job has no `needs:` so it doesn't inherit the skip automatically.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Assert no schedule trigger in this workflow
        run: |
          # Match only lines where 'schedule:' appears at the 2-space YAML indent
          # level (i.e. as a direct child of the 'on:' block). This avoids false
          # positives from comments and from this grep command itself.
          if grep -qE '^  schedule:' .github/workflows/cross-engine-parity.yml; then
            echo "✗ schedule: trigger found — cross-engine parity must be push/PR only."
            exit 1
          fi
          echo "✓ No schedule trigger (push/PR only confirmed)."
