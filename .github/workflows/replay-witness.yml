name: Replay Witness

# Fork-facing replay of the tracked fixture corpus. Manual trigger only.
# On the upstream repository the job does not start. In a fork it runs the
# same replay and attestation steps as Replay House Attest, signing the beacon
# and the result with the fork's own GitHub identity.
# The source commit must exist in the upstream repository. An edited fork
# carries a commit upstream does not have and is refused by the guard.
# Never a required check, never on merge_group, no secrets.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  witness:
    if: github.repository != 'PostOakLabs/ainumbers'
    name: witness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Check source commit exists upstream
        id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/PostOakLabs/ainumbers.git
          if git fetch --no-tags --depth=1 upstream "$SOURCE_SHA" >/dev/null 2>&1 \
             && git cat-file -e "$SOURCE_SHA^{commit}" 2>/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce witness guard
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          UPSTREAM_PRESENT: ${{ steps.source.outputs.present }}
        run: node scripts/replay-witness-guard.mjs

      - name: Replay corpus
        shell: bash
        run: node scripts/replay-result.mjs --out replay-out

      - name: Derive attestation subjects
        shell: bash
        run: node scripts/replay-house-subjects.mjs replay-out

      - name: Attest replay result
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: replay-out/replay-subjects.txt
          predicate-type: ainumbers.co/replay-witness/v1
          predicate-path: replay-out/replay-env.json

      - name: Upload result files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: replay-result-witness-${{ matrix.os }}
          path: replay-out/
          if-no-files-found: error

      - name: Compare with the committed house line
        shell: bash
        run: node scripts/replay-house-subjects.mjs replay-out --compare data/replay-house-line.json
