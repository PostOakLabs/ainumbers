name: Unwired Gates

# Wire 19 standalone gate scripts (all green on main, ~21s total, node stdlib
# only — zero npm deps) as one parallel CI job, so a PR that breaks or weakens
# any of them is caught before merge instead of never.
#
# check-node-surface-parity.mjs runs here in REPORT MODE only
# (continue-on-error + step summary + uploaded artifact): it is red today
# (171/624 compared page<->kernel pairs divergent), so making it blocking
# would red main. It surfaces the drift per run; a later change can promote
# it to blocking once the drift sweep lands.
#
# mandate-binding.test.mjs reads ../mcp-apps-poc/test/linear-hash-freeze.goldens.json
# — a file that lives in the companion worker repo, not this one, so an
# isolated checkout of this repo reds with ENOENT. The "Stage linear-hash-
# freeze goldens" step guarantees that path before the gate runs, fetching
# the file pinned to a worker-repo commit SHA.

on:
  # REGEN-COMPLETION TRIGGER (2026-10-08 move): main-side gates fire on the
  # single-writer regen's
  # COMPLETION, not on the bare PR-merge commit (measured four-week census:
  # ~95 of 203 failed runs were push-triggered gates red-by-construction on
  # the merge commit before the regen's chore commit landed). Every landing
  # still reaches this workflow on a fresh tree — the trigger mechanics, the
  # two-completions-per-drift-repairing-landing shape, the stand-down on the
  # superseded first completion, and the regen's own exposure of which commit
  # this is are documented at the top of land-verify.yml, which shares it.
  workflow_run:
    workflows: [ "Derived Artifacts Regen" ]
    types: [ completed ]
    branches: [ main ]
  pull_request:
    paths:
      - 'scripts/**'
      - 'chaingraph/**'
      - '.github/workflows/unwired-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

# The commit this run gates. On workflow_run, github.sha is the head of the
# default branch at event time — it has already moved to the regen's repair
# commit when one exists, which is exactly the supersede signal the job's
# `if:` reads — and the tree to gate is the completed regen's head_sha, never
# the event-time branch head (it can race past what the regen actually
# validated; same rule as deploy-to-dreamhost.yml's DEPLOY_SHA). On
# pull_request / workflow_dispatch, github.ref is the PR merge ref / the
# dispatched ref — byte-for-byte today's default checkout.
env:
  GATE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

jobs:
  gates:
    name: 19 measured-green gates + surface-parity report
    # The regen-completion workflow_run guard (2026-10-08 move): only a
    # SUCCESSFUL main regen
    # may drive these gates, and only while its commit is still the default
    # branch's head at event time. The first completion of a drift-repairing
    # landing fires with head_sha = the merge commit M — stale-by-construction
    # for every shared derived artifact, and already superseded by the regen
    # bot's commit R (github.sha has moved past it) — so this job stands down
    # there and the second completion, head_sha = R, runs every gate on the
    # fresh tree. Zero red runs on the merge commit is the point of the move;
    # a stale artifact the regen will NOT repair still reds here on the
    # surviving completion, because github.sha never moves.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout site repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # The one commit this run gates (workflow-level GATE_SHA — the
          # completed regen's head_sha on the workflow_run trigger; the
          # PR merge ref / dispatched ref unchanged on other events).
          ref: ${{ env.GATE_SHA }}
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      # Fixture step: mandate-binding.test.mjs resolves
      # test/linear-hash-freeze.goldens.json under ../mcp-apps-poc. Pin the
      # fetch to commit 809c7da1eb1d032424836b9f46f46b7410641687 of
      # PostOakLabs/ainumbers-mcp-apps so the fixture is immutable.
      - name: Stage linear-hash-freeze goldens
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../mcp-apps-poc/test"
          curl -fsSL \
            "https://raw.githubusercontent.com/PostOakLabs/ainumbers-mcp-apps/809c7da1eb1d032424836b9f46f46b7410641687/test/linear-hash-freeze.goldens.json" \
            -o "$GITHUB_WORKSPACE/../mcp-apps-poc/test/linear-hash-freeze.goldens.json"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); console.log('goldens fixture: valid JSON')" \
            "$GITHUB_WORKSPACE/../mcp-apps-poc/test/linear-hash-freeze.goldens.json"

      # The 17 green gates, sequentially; any red fails the job.
      - name: Run the 17 measured-green gates
        run: |
          set -e
          gates=(
            "chaingraph/kernels/kernel-hash-integrity.mjs"
            "chaingraph/kernels/kernel-contract.test.mjs"
            "chaingraph/exporters/export.test.mjs"
            "chaingraph/exporters/xbrl-json-fixtures.test.mjs"
            "chaingraph/exporters/xbrl-csv-fixtures.test.mjs"
            "scripts/compile-mandate-determinism.test.mjs"
            "scripts/mandate-binding.test.mjs"
            "scripts/check-workflow-gate-parity.test.mjs"
            "chaingraph/standard/cid-roundtrip.test.mjs"
            "chaingraph/standard/catalog-snapshot.test.mjs"
            "chaingraph/standard/head-commit.test.mjs"
            "chaingraph/standard/car-roundtrip.test.mjs"
            "chaingraph/kernels/seed-replay.test.mjs"
            "chaingraph/kernels/validate-ha-records.test.mjs"
            "chaingraph/kernels/clause-binding.test.mjs"
            "chaingraph/standard/ancestry-digest.test.mjs"
            "chaingraph/standard/retention-profile.test.mjs"
          )
          for g in "${gates[@]}"; do
            echo "::group::node $g"
            node "$g"
            echo "::endgroup::"
          done

      # The F2 registry absence-tree gates, wired here so they are enforced in
      # CI and not only in preflight (raw `node` lines — the gate-parity
      # checker credits explicit `node <script>` invocations only).
      - name: Run the 2 registry absence-tree gates
        run: |
          set -e
          node scripts/gen-registry-absence-tree.mjs --check
          node scripts/gen-registry-absence-tree.test.mjs

      # REPORT MODE only: surface-parity is red today (171/624 divergent).
      # continue-on-error + summary artifact — never blocking.
      - name: Surface-parity report (non-blocking)
        id: parity
        continue-on-error: true
        run: |
          node scripts/check-node-surface-parity.mjs | tee parity-report.txt
          {
            echo "## Surface-parity report (non-blocking)"
            echo
            echo '```'
            cat parity-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload parity report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surface-parity-report
          path: parity-report.txt
          if-no-files-found: error
