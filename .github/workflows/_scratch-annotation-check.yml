name: Scratch — annotation matcher positive control

# TEMPORARY, throwaway verification workflow. Runs the REAL, fixed
# scripts/jsdoc-checkjs-gate.mjs against two scratch fixture files (not
# under chaingraph/kernels — no kernel/proptest files touched) that
# reproduce one real ignored-dependency diagnostic (TS2307 against an
# untouched import) and one real blocking diagnostic (TS2353 against the
# touched file itself), the same two diagnostic shapes the gate emits in
# production. Confirms via the actual check-run annotations whether the
# ignored one still leaves a GitHub annotation and whether the blocking one
# still does. All three scratch files deleted before merge.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/_scratch-annotation-check.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Run the real gate against scratch fixtures
        shell: bash
        run: |
          node scripts/jsdoc-checkjs-gate.mjs ./.github/workflows/_scratch-fixture-touched.mjs
