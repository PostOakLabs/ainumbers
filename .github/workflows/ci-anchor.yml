name: CI Anchor

# CI-ANCHOR-REQUIRED-CHECK-1 (2026-08-11): closes the "PR gets zero CI and
# merges ungated" hole PR #1199 fell into (diagnosed in
# board/done/CI-NOTRIGGER-1199-SCOPE-1.md). #1199's branch conflicted with
# main, so refs/pull/1199/merge never existed, a pull_request run builds on
# that merge commit, and GitHub dispatched nothing: 0 runs, 0 check-suites.
# A PR with zero checks and a PR with all-green checks look identical on the
# PR page (SO #34c: green-by-absence is not green).
#
# Design, deliberately this shape and no cleverer one:
# - ONE thin job, NO paths/paths-ignore filter, runs on every pull_request.
#   It does nothing but report success.
# - Made a REQUIRED status check on main's branch protection (by Tim, SO #8
#   — branch protection is a console/API act, not something this workflow
#   or this session changes).
# - CI dispatched => this check exists => merge allowed.
#   CI could NOT dispatch (conflicting merge ref, path-filter miss, Actions
#   outage, billing cap, or any future cause) => this check is MISSING =>
#   GitHub blocks the merge itself. The control lives at the platform layer,
#   not in session discipline — the #1199 failure was invisible precisely
#   because it depended on someone noticing zero checks.
#
# Relationship to SITEMAP-MAIN-REGEN-1: that row removes the *cause* behind
# #1199 by making the land row the single writer of shared derived
# artifacts (SO #35). This workflow is the independent backstop for every
# OTHER cause of zero dispatch. Neither replaces the other.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  anchor:
    name: anchor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report
        run: echo "CI dispatched for this PR."
