var COST_LABELS = {
  exportClearance:"Export Clearance",
  preCarriage:"Pre-Carriage to Port/Terminal",
  loadingOrigin:"Loading at Origin",
  mainCarriage:"Main Carriage (Freight)",
  insurance:"Insurance",
  unloading:"Unloading at Destination",
  importClearance:"Import Clearance & Duties",
  deliveryDest:"Delivery to Final Destination"
};

var lastResult = null;

function cell(val){
  if(val==="Seller") return '<span class="cell-seller">SELLER</span>';
  if(val==="Buyer")  return '<span class="cell-buyer">BUYER</span>';
  if(val==="Shared") return '<span class="cell-shared">SHARED</span>';
  return '<span class="cell-na">'+val+'</span>';
}
function riskBadge(r){
  var cls=r==="Low"?"risk-low":r==="Medium"?"risk-med":"risk-high";
  return '<span class="risk-badge '+cls+'">'+r+'</span>';
}

function buildAllocTable(code, label){
  var d=INCO[code];
  var html='<table class="alloc-table">';
  if(label) html+='<caption style="font-family:\'JetBrains Mono\',monospace;font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);text-align:left;padding:.5rem 0 .75rem">'+label+'</caption>';
  html+='<thead><tr><th>Cost / Responsibility</th><th>Party</th></tr></thead><tbody>';
  var keys=Object.keys(COST_LABELS);
  for(var i=0;i<keys.length;i++){
    var k=keys[i];
    html+='<tr><td style="color:var(--bright)">'+COST_LABELS[k]+'</td><td>'+cell(d.costs[k])+'</td></tr>';
  }
  html+='<tr><td style="color:var(--bright)">Risk to Buyer</td><td>'+riskBadge(d.riskBuyer)+'</td></tr>';
  html+='<tr><td style="color:var(--bright)">Risk to Seller</td><td>'+riskBadge(d.riskSeller)+'</td></tr>';
  html+='</tbody></table>';
  return html;
}

function runMapper(){
  var code1=document.getElementById('inco1').value;
  var code2=document.getElementById('inco2').value;
  var transport=document.getElementById('transport').value;
  var goods=document.getElementById('goods').value;
  var countryRisk=document.getElementById('countryRisk').value;
  var txnVal=parseFloat(document.getElementById('txnValue').value)||0;

  var d1=INCO[code1];

  // Modal suitability warnings
  var warnings=[];
  var seaTerms=["FAS","FOB","CFR","CIF"];
  var nonSeaModes=["air","road","rail","multi"];
  if(seaTerms.indexOf(code1)>-1 && nonSeaModes.indexOf(transport)>-1){
    warnings.push(code1+" is restricted to Sea & Inland Waterway. For "+transport+" shipments, use "+
      (code1==="FOB"||code1==="FAS"?"FCA":code1==="CFR"?"CPT":"CIP")+" instead.");
  }
  if(code2 && seaTerms.indexOf(code2)>-1 && nonSeaModes.indexOf(transport)>-1){
    warnings.push(code2+" is restricted to Sea & Inland Waterway. For "+transport+" shipments, consider an alternative.");
  }
  if((code1==="FOB"||code1==="CFR"||code1==="CIF") && goods==="container"){
    warnings.push("ICC strongly advises against using "+code1+" for containerised cargo. Risk transfers on-board — but containers are typically handed to carrier at inland depot (CY), not on-board. Use FCA (or CPT/CIP) to align risk transfer with the actual handover point.");
  }
  if(code1==="EXW" && (countryRisk==="medium"||countryRisk==="high")){
    warnings.push("EXW places export clearance on the buyer — in "+countryRisk+" risk jurisdictions, the buyer (foreign party) may face difficulties obtaining export licences and clearance certificates.");
  }
  if(code1==="DDP" && (countryRisk==="medium"||countryRisk==="high")){
    warnings.push("DDP requires the seller to handle import clearance in the buyer's country — challenging if seller has no local presence or importer-of-record status in a "+countryRisk+" risk jurisdiction.");
  }

  var warnCard=document.getElementById('warnCard');
  var warnText=document.getElementById('warnText');
  if(warnings.length>0){
    warnText.innerHTML=warnings.map(function(w){return '⚠ '+w;}).join('<br><br>');
    warnCard.style.display='';
  } else {
    warnCard.style.display='none';
  }

  // Insurance callout
  var insCard=document.getElementById('insCard');
  var insText=document.getElementById('insText');
  var insHTML='';
  if(code1==="CIP"){
    insHTML='<strong style="color:var(--purple-lt)">CIP — ICC (A) All-Risks (2020 change):</strong> Under Incoterms 2020, CIP now requires the seller to provide insurance under Institute Cargo Clauses (A) — all-risks comprehensive cover, minimum 110% of contract value. This is a significant upgrade from the ICC (C) minimum required under Incoterms 2010.';
  } else if(code1==="CIF"){
    insHTML='<strong style="color:var(--purple-lt)">CIF — ICC (C) Minimum (unchanged):</strong> CIF retains only the ICC (C) named-perils minimum. Unlike CIP (which was upgraded to ICC A in 2020), CIF insurance covers only major perils. Buyer should consider purchasing supplemental ICC (A) or (B) cover independently.';
  } else if(d1.insurance==="neither"){
    insHTML='<strong style="color:var(--purple-lt)">'+code1+' — No Insurance Obligation:</strong> '+d1.insObligation;
  }
  if(code2 && (code2==="CIP"||code2==="CIF")){
    var d2=INCO[code2];
    insHTML+=insHTML?'<br><br>':'';
    if(code2==="CIP") insHTML+='<strong style="color:var(--purple-lt)">CIP (comparison) — ICC (A) All-Risks:</strong> Seller provides comprehensive all-risks cover.';
    else insHTML+='<strong style="color:var(--purple-lt)">CIF (comparison) — ICC (C) Minimum:</strong> Seller provides basic named-perils cover only.';
  }
  if(insHTML){insText.innerHTML=insHTML;insCard.style.display='';}
  else{insCard.style.display='none';}

  // Allocation table
  document.getElementById('allocTitle').textContent='Risk & Cost Allocation — '+code1;
  document.getElementById('allocTableWrap').innerHTML=buildAllocTable(code1,null);

  // Comparison
  var compareCard=document.getElementById('compareCard');
  var compareBody=document.getElementById('compareBody');
  if(code2){
    compareCard.style.display='';
    var html='<div class="compare-grid">'+buildAllocTable(code1,code1+' — '+d1.name)+buildAllocTable(code2,''+code2+' — '+INCO[code2].name)+'</div>';
    compareBody.innerHTML=html;
  } else {
    compareCard.style.display='none';
  }

  // Recommendation
  var rec=recommend(code1,code2,transport,goods,countryRisk,txnVal);
  document.getElementById('recCard').innerHTML=
    '<h3>'+rec.title+'</h3><p>'+rec.rationale+'</p>'+
    (rec.note?'<p style="margin-top:.5rem;font-size:.68rem;color:var(--muted)">'+rec.note+'</p>':'');

  // Docs
  var docBody=document.getElementById('docBody');
  var docHTML='<ul class="doc-list">';
  var docs=d1.docs;
  for(var i=0;i<docs.length;i++) docHTML+='<li>'+docs[i]+'</li>';
  docHTML+='</ul>';
  if(d1.icc2020){
    docHTML+='<div style="margin-top:.75rem;background:var(--bg-3);border:1px solid var(--border);border-left:3px solid var(--teal);border-radius:var(--radius);padding:.65rem .85rem;font-size:.72rem;color:var(--body);line-height:1.55"><strong style="color:var(--teal-lt);font-family:\'JetBrains Mono\',monospace;font-size:.48rem;letter-spacing:.08em;text-transform:uppercase">ICC 2020 Note</strong><br>'+d1.icc2020+'</div>';
  }
  docBody.innerHTML=docHTML;

  // AP2 meta
  document.getElementById('ap2Meta').textContent='v1.0 · Cat-26 · T422 · '+code1+(code2?' vs '+code2:'');

  // Store result
  lastResult={inco1:code1,inco2:code2,transport:transport,goods:goods,countryRisk:countryRisk,txnValue:txnVal,
    inco1Data:d1,inco2Data:code2?INCO[code2]:null,recommendation:rec,warnings:warnings,timestamp:new Date().toISOString()};

  document.getElementById('outputSection').classList.add('visible');
  document.getElementById('mfstCode').textContent=JSON.stringify(MANIFEST,null,2);
}

function recommend(code1,code2,transport,goods,countryRisk,txnVal){
  var d1=INCO[code1];
  var issues=[];
  var preferred=code1;

  // Check modal fit
  var seaTerms=["FAS","FOB","CFR","CIF"];
  var nonSeaModes=["air","road","rail","multi"];
  if(seaTerms.indexOf(code1)>-1 && nonSeaModes.indexOf(transport)>-1){
    preferred=(code1==="FOB"||code1==="FAS")?"FCA":code1==="CFR"?"CPT":"CIP";
    issues.push(code1+" is not suitable for "+transport+" — "+preferred+" recommended instead");
  }

  // Containerised warning
  if((code1==="FOB"||code1==="CFR")&&goods==="container"){
    if(preferred===code1) preferred="FCA";
    issues.push("FCA preferred over "+code1+" for containerised cargo");
  }

  // High-value goods
  if(goods==="highvalue"&&(code1==="CIP"||preferred==="CIP")){
    issues.push("CIP provides ICC (A) all-risks — suitable for high-value goods");
  }

  // Country risk
  if(countryRisk==="high"&&code1==="EXW"){
    issues.push("EXW in high-risk origin jurisdiction — buyer may struggle with export formalities");
  }
  if(countryRisk==="high"&&code1==="DDP"){
    issues.push("DDP in high-risk destination — seller may lack import clearance capability");
  }

  var title=preferred===code1?
    (code1+(code2?' appears well-suited compared to '+code2:'')+" for this transaction"):
    preferred+" recommended over "+code1;
  var rationale='';
  if(issues.length>0){
    rationale=issues.join('. ')+'. ';
  }
  rationale+="For "+goods+" goods via "+transport+" with a "+countryRisk+" seller country risk tier";
  if(txnVal>500000) rationale+=", at USD "+txnVal.toLocaleString()+" consider insured terms (CIP/CIF) for insurance coverage";
  rationale+=".";

  var note=d1.useCases?"Common use cases for "+code1+": "+d1.useCases:null;
  return{title:title,rationale:rationale,note:note};
}

      transport:lastResult.transport,goods:lastResult.goods,

      costAllocation1:lastResult.inco1Data.costs,
      riskBuyer1:lastResult.inco1Data.riskBuyer,riskSeller1:lastResult.inco1Data.riskSeller,
      costAllocation2:lastResult.inco2Data?lastResult.inco2Data.costs:null,
      insuranceNote:lastResult.inco1Data.insObligation},

      jurisdiction:"International",framework:"ICC Incoterms 2020",
      status:"informational",generated_by:"AINumbers.co T422"}

}
